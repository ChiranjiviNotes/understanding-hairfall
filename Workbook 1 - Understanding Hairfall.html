  /* ───────── WHAT NEXT ───────── */
  {_type:'nxt', badge:'What Next', sec:'Going Forward', title:'The Journey Continues',
   purp:'You\u2019ve chosen understanding over panic. That matters more than any single treatment.',
   covered:[
     'Why hair fall begins in the mind as much as the scalp',
     'The hair cycle — and why healthy hair is meant to fall',
     'The difference between shedding and thinning',
     'Six clues a doctor uses to reconstruct the pattern',
     'Six distinct causes — from genetics to internal medicine',
     'What the evidence actually says about treatment',
     'When to watch, when to wait, and when to act',
   ],
   series:[
     { t:'Understanding My Fatigue', d:'Why tiredness isn\u2019t always simple — and when it matters' },
     { t:'Understanding My Weight', d:'A humane, evidence-based look at weight and health' },
     { t:'Understanding My Thyroid', d:'The butterfly gland that shapes so much' },
     { t:'Understanding My Skin', d:'When your largest organ is trying to tell you something' },
   ],
   quoteLines:['Fear counts hairs.','Medicine looks for patterns.','Wisdom knows the difference.']},
 ]
};

</script>
<script>
/* ═══════════════════════════════════════════════════════
   ENGINE — Understanding My Hair Fall
   Adapted from the Chiranjivi Notes zine engine.
   LocalStorage-based persistence (no window.storage API).
═══════════════════════════════════════════════════════ */
const LANG = 'en';
const L = () => T[LANG];
const STORE_KEY = 'cn_hf_wb';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e){}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}
}
let saveTick;
function markSaved() {
  clearTimeout(saveTick);
  const el = document.getElementById('save-tag');
  if (el) { el.classList.add('show'); saveTick = setTimeout(() => el.classList.remove('show'), 1400); }
}
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

/* ─── COVER ─── */
function buildCover() {
  const l = L();
  return `<div class="wb-cov">
  <div class="cov-in">
    <div class="cov-mn">CN</div>
    <p class="cov-br">${l.brand}</p>
    <h1 class="cov-h1">${l.title}</h1>
    <p class="cov-su">${l.sub}</p>
    <div class="cov-rl"></div>
    <p class="cov-intro">${l.intro.replace(/\n/g,'<br>')}</p>
    <button class="cov-btn" onclick="scrollToFirst()">${l.beginBtn}</button>
    ${Object.keys(store).length > 0 ? `<p style="font-family:var(--serif);font-size:.68rem;color:var(--accent);opacity:.5;margin-top:.9rem;letter-spacing:.08em">◦ Your previous notes have been restored ◦</p>` : ''}
  </div>
</div>`;
}

/* ─── SUMMARY PAGE ─── */
function buildSummary(page, idx) {
  const l = L();
  const allPages = l.pages.filter(p => !p._type);
  const knownKeys = new Set();
  allPages.forEach(pg => {
    [...(pg.body || '').matchAll(/data-key="([^"]+)"/g)].forEach(m => knownKeys.add(m[1]));
  });
  const reflKeys = Object.keys(store).filter(k => knownKeys.has(k) && store[k] && store[k].trim());
  const totalRefl = reflKeys.length;
  const totalPossible = knownKeys.size;

  let summaryBody = '';
  allPages.forEach(pg => {
    const matches = [...(pg.body || '').matchAll(/data-key="([^"]+)"/g)];
    if (!matches.length) return;
    const filled = matches.filter(m => store[m[1]] && store[m[1]].trim());
    if (!filled.length) return;
    summaryBody += `<p class="subsec" style="margin-top:1.05rem;font-size:.88rem">${pg.badge} — ${pg.title}</p>`;
    filled.forEach(m => {
      summaryBody += `<p style="font-family:var(--body);font-style:italic;font-size:.88rem;color:var(--ink-light);border-left:2px solid rgba(191,160,122,.3);padding-left:.75rem;margin:.45rem 0;line-height:1.62">${store[m[1]].replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`;
    });
  });

  // Smart summary
  let smartText = '';
  const storeVals = Object.values(store).join(' ').toLowerCase();
  if (storeVals.includes('fever') || storeVals.includes('surgery') || storeVals.includes('ill') || storeVals.includes('covid')) {
    smartText += 'Your notes mention a recent illness or physical stress. This is consistent with a temporary shedding pattern (telogen effluvium), which usually settles on its own once the body has recovered. ';
  }
  if (storeVals.includes('family') || storeVals.includes('father') || storeVals.includes('mother') || storeVals.includes('genetic')) {
    smartText += "You've noted a family history, which is a meaningful clue — worth discussing with a doctor to understand the pattern and timeline better. ";
  }
  if (storeVals.includes('baby') || storeVals.includes('pregnan') || storeVals.includes('delivery') || storeVals.includes('postpartum')) {
    smartText += 'Postpartum shedding appears relevant to your situation. This is common, expected, and usually resolves within six to twelve months. ';
  }
  if (storeVals.includes('patch') || storeVals.includes('bald spot') || storeVals.includes('round')) {
    smartText += "You've described a patchy pattern, which is worth a clinical evaluation to distinguish between possible causes — some resolve spontaneously, others benefit from specific treatment. ";
  }
  if (storeVals.includes('tired') || storeVals.includes('fatigue') || storeVals.includes('weight') || storeVals.includes('period')) {
    smartText += 'Symptoms beyond the hair — fatigue, weight changes, or menstrual irregularities — suggest it may be worth investigating an underlying internal cause alongside the hair itself. ';
  }
  if (!smartText) {
    smartText = "Your reflections show a thoughtful engagement with your own hair story. The most useful next step is sharing what you've noticed with a doctor who can look at the full picture rather than any single symptom.";
  }
  smartText += ' This summary is for reflection only — not a diagnosis.';

  return `<div class="sum-pg" id="pg-${idx}">
  <span class="pg-badge">${page.badge}</span>
  <span class="sec-lbl">${page.sec}</span>
  <h2 class="pg-title">${page.title}</h2>
  <p class="pg-purp">${page.purp}</p>
  <hr class="pg-hr">

  <p class="comp-stat">You've answered <span>${totalRefl}</span> of <span>${totalPossible}</span> reflection prompts across this workbook.</p>

  ${summaryBody || '<p class="instr" style="opacity:.5;font-style:italic">Your reflections will appear here as you work through the chapters.</p>'}

  <div id="smart-sum" class="${smartText ? 'show' : ''}">
    <span class="ss-lbl">◆ Chiranjivi Reflection</span>
    <p class="ss-txt">${smartText}</p>
    <p class="ss-disc">Based on your own notes. Not a clinical diagnosis.</p>
  </div>

  <div class="dl-sec">
    <button class="copy-btn" onclick="copyForDoctor()">Copy Summary for Doctor</button><br>
    <button class="dl-btn" onclick="window.print()">Print This Workbook</button>
    <p class="dl-note">Share your reflections with your doctor at your next visit.</p>
  </div>
  <button id="reset-btn" onclick="resetAll()">Clear All Saved Notes</button>
</div>`;
}

function copyForDoctor() {
  const l = L();
  const allPages = l.pages.filter(p => !p._type);
  let text = `Chiranjivi Notes® — ${l.title}\n`;
  text += 'Patient Reflection Summary\n\n';
  let hasContent = false;
  allPages.forEach(pg => {
    const matches = [...(pg.body || '').matchAll(/data-key="([^"]+)"/g)];
    const filled = matches.filter(m => store[m[1]] && store[m[1]].trim());
    if (!filled.length) return;
    text += `${pg.badge} — ${pg.title}\n`;
    filled.forEach(m => { text += `  — ${store[m[1]].trim()}\n`; });
    text += '\n';
    hasContent = true;
  });
  if (!hasContent) { toast('No notes to share yet.'); return; }
  text += '(Prepared using Chiranjivi Notes® — for educational purposes only. Not a clinical diagnosis.)';
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard ✓')).catch(() => toast('Copy failed — please screenshot instead'));
}

function resetAll() {
  if (!confirm('Clear all your saved notes and start fresh? This cannot be undone.')) return;
  store = {};
  try { localStorage.removeItem(STORE_KEY); } catch(e) {}
  renderWB();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ─── WHAT NEXT PAGE ─── */
function buildWhatNext(page, idx) {
  const covered = page.covered || [];
  const series = page.series || [];
  const quoteLines = page.quoteLines || [];
  return `<div class="nxt-pg" id="pg-${idx}">
  <span class="pg-badge">${page.badge}</span>
  <span class="sec-lbl">${page.sec}</span>
  <h2 class="pg-title">${page.title}</h2>
  <p class="pg-purp">${page.purp}</p>
  <hr class="pg-hr">

  <div class="done-badge">Workbook Complete</div>

  ${page.closingBody || ''}

  ${covered.length ? `<p class="subsec" style="color:rgba(238,233,222,.72)">What this companion has covered</p>
  <ul class="nlist" style="margin-bottom:1.45rem">
    ${covered.map(c => `<li style="color:rgba(238,233,222,.52)">${c}</li>`).join('')}
  </ul>` : ''}

  ${series.length ? `<p class="ser-tag">Other titles in the Chiranjivi Notes® Clinical Companion series</p>
  <div class="nb-grid">
    ${series.map(s => `<div class="nb"><span class="nb-t">${s.t}</span><span class="nb-d">${s.d}</span></div>`).join('')}
  </div>` : ''}

  ${quoteLines.length ? `<blockquote class="nxt-bq">
    ${quoteLines.map(l => `<span>${l}</span>`).join('')}
    <cite>— Chiranjivi Notes®</cite>
  </blockquote>` : ''}
</div>`;
}

/* ─── PAGE BUILDER ─── */
function buildPage(page, idx) {
  if (page._type === 'sum') return buildSummary(page, idx);
  if (page._type === 'nxt') return buildWhatNext(page, idx);
  let body = page.body || '';
  // replace {{TABLE:storeKey}} markers with the table shell (rows wired in after DOM insert)
  body = body.replace(/\{\{TABLE:([a-zA-Z0-9_-]+)\}\}/g, (_, key) => buildTableHtml(key));
  return `<div class="pg" id="pg-${idx}">
  <span class="pg-badge">${page.badge}</span>
  <span class="sec-lbl">${page.sec}</span>
  <h2 class="pg-title">${page.title}</h2>
  <p class="pg-purp">${page.purp}</p>
  <hr class="pg-hr">
  ${body}
  ${page.closer ? `<p class="pgcloser">${page.closer}</p>` : ''}
</div>`;
}

/* ─── MAIN RENDER ─── */
function renderWB() {
  const l = L();
  const wb = document.getElementById('workbook');
  wb.innerHTML = buildCover() + l.pages.map((p, i) => buildPage(p, i)).join('');
  document.getElementById('col-txt').innerHTML = l.colophon.replace(/\n/g,'<br>');
  buildNav();
  buildDots();
  wireInputs();
  observePgs();
}

/* ─── NAV DRAWER ─── */
function buildNav() {
  const l = L();
  const list = document.getElementById('nav-list');
  if (!list) return;
  list.innerHTML = l.pages.map((p, i) => {
    const lbl = p.title || p.sec || p.badge;
    return `<button class="nav-item${store['vis_'+i] ? ' visited' : ''}" onclick="goTo(${i})">${p.badge ? `<span style="font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);opacity:.55;margin-right:.4rem">${p.badge}</span>` : ''}${lbl}</button>`;
  }).join('');
}
function openNav() { document.getElementById('nav-drawer').classList.add('open'); document.getElementById('nav-overlay').classList.add('show'); }
function closeNav() { document.getElementById('nav-drawer').classList.remove('open'); document.getElementById('nav-overlay').classList.remove('show'); }
function goTo(idx) { closeNav(); const el = document.getElementById('pg-'+idx); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }
function scrollToFirst() { const el = document.getElementById('pg-0'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

/* ─── PROGRESS DOTS ─── */
function buildDots() {
  const l = L();
  const container = document.getElementById('pdots');
  if (!container) return;
  container.innerHTML = l.pages.map((_, i) => `<span class="pdot" id="dot-${i}" title="${l.pages[i].badge || i+1}"></span>`).join('');
}
function updateDots(activeIdx) {
  const l = L();
  l.pages.forEach((_, i) => {
    const dot = document.getElementById('dot-'+i);
    if (!dot) return;
    dot.classList.toggle('done', i < activeIdx);
    dot.classList.toggle('active', i === activeIdx);
  });
  const psec = document.getElementById('psec');
  if (psec) {
    const p = l.pages[activeIdx];
    if (p) psec.textContent = p.badge || '';
  }
}

/* ─── REFRESH SUMMARY ON VIEW (data may have changed since boot-time render) ─── */
function refreshSummaryIfPresent() {
  const l = L();
  const sumIdx = l.pages.findIndex(p => p._type === 'sum');
  if (sumIdx === -1) return;
  const el = document.getElementById('pg-' + sumIdx);
  if (!el) return;
  const freshHtml = buildSummary(l.pages[sumIdx], sumIdx);
  // buildSummary returns a full <div class="sum-pg" id="pg-N">...</div> — swap innerHTML only, keep node identity for IntersectionObserver
  const temp = document.createElement('div');
  temp.innerHTML = freshHtml;
  el.innerHTML = temp.firstElementChild.innerHTML;
  el.classList.add('vis');
}

/* ─── SCROLL OBSERVER ─── */
function observePgs() {
  const l = L();
  const pbar = document.getElementById('pbar');
  const btt = document.getElementById('btt');
  const prog = document.getElementById('scroll-prog');
  let currentIdx = -1;

  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = parseInt(entry.target.id.replace('pg-', ''));
        if (!isNaN(idx) && idx !== currentIdx) {
          currentIdx = idx;
          updateDots(idx);
          store['vis_'+idx] = true;
          persist();
          if (l.pages[idx] && l.pages[idx]._type === 'sum') {
            refreshSummaryIfPresent();
          }
        }
      }
    });
  }, { threshold: 0.15, rootMargin: '-15% 0px -55% 0px' });

  l.pages.forEach((_, i) => {
    const el = document.getElementById('pg-'+i);
    if (el) io.observe(el);
  });

  const fadeIO = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.08 });
  document.querySelectorAll('.pg,.sum-pg,.nxt-pg').forEach(el => fadeIO.observe(el));

  function onScroll() {
    const scrollY = window.scrollY;
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    const pct = maxScroll > 0 ? (scrollY / maxScroll) * 100 : 0;
    if (prog) prog.style.width = pct + '%';
    if (pbar) pbar.classList.toggle('show', scrollY > 120);
    if (btt) btt.classList.toggle('show', scrollY > 800);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* ─── DYNAMIC WORKSHEET TABLES (e.g. Action Plan progress log) ───
   A table whose rows are stored as an array in `store[storeKey]`,
   with add/remove controls. Re-renders its own tbody on change. */
const TABLE_REGISTRY = {};
function registerTable(storeKey, columns) {
  TABLE_REGISTRY[storeKey] = columns;
}
// process any registrations queued by content.js before this function existed
if (window.__tableQueue) {
  window.__tableQueue.forEach(([key, cols]) => registerTable(key, cols));
  window.__tableQueue = [];
}
function buildTableHtml(storeKey) {
  const cols = TABLE_REGISTRY[storeKey];
  if (!cols) return '';
  return `<div class="wstab-wrap">
    <table class="wstab">
      <thead><tr>${cols.map(c => `<th>${c.label}</th>`).join('')}<th></th></tr></thead>
      <tbody id="tbody-${storeKey}"></tbody>
    </table>
  </div>
  <button class="wstab-add" data-add-table="${storeKey}" type="button">+ Add Row</button>`;
}
function renderTableBody(storeKey) {
  const cols = TABLE_REGISTRY[storeKey];
  const tbody = document.getElementById('tbody-' + storeKey);
  if (!tbody || !cols) return;
  const rows = Array.isArray(store[storeKey]) ? store[storeKey] : [];
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${cols.length + 1}" class="wstab-empty">No entries yet — add your first row whenever you're ready.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map((row, ri) => `<tr>
    ${cols.map(c => `<td><input type="text" data-table="${storeKey}" data-row="${ri}" data-field="${c.key}" value="${(row[c.key]||'').replace(/"/g,'&quot;')}" placeholder="${c.placeholder||''}"></td>`).join('')}
    <td><button class="wstab-rm" data-rm-row="${ri}" data-rm-table="${storeKey}" type="button" aria-label="Remove row">✕</button></td>
  </tr>`).join('');
}
function initTable(storeKey) {
  if (!Array.isArray(store[storeKey])) store[storeKey] = [];
  renderTableBody(storeKey);
}
function wireTableEvents(root) {
  (root || document).querySelectorAll('[data-add-table]').forEach(btn => {
    if (btn.dataset.wired) return;
    btn.dataset.wired = '1';
    btn.addEventListener('click', () => {
      const key = btn.dataset.addTable;
      const cols = TABLE_REGISTRY[key];
      if (!Array.isArray(store[key])) store[key] = [];
      const blank = {};
      cols.forEach(c => blank[c.key] = '');
      store[key].push(blank);
      persist();
      renderTableBody(key);
      wireTableRowEvents(key);
    });
  });
}
function wireTableRowEvents(storeKey) {
  const tbody = document.getElementById('tbody-' + storeKey);
  if (!tbody) return;
  tbody.querySelectorAll('input[data-table]').forEach(inp => {
    inp.addEventListener('input', debounceLocal(() => {
      const ri = parseInt(inp.dataset.row);
      const field = inp.dataset.field;
      if (store[storeKey] && store[storeKey][ri]) {
        store[storeKey][ri][field] = inp.value;
        persist();
        markSaved();
      }
    }, 400));
  });
  tbody.querySelectorAll('[data-rm-row]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ri = parseInt(btn.dataset.rmRow);
      const key = btn.dataset.rmTable;
      if (store[key]) {
        store[key].splice(ri, 1);
        persist();
        renderTableBody(key);
        wireTableRowEvents(key);
      }
    });
  });
}
function debounceLocal(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* ─── INPUTS / AUTOSAVE ─── */
function wireInputs() {
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    if (store[key]) el.value = store[key];
    el.addEventListener('input', () => {
      store[key] = el.value;
      persist();
      markSaved();
    });
  });
  // dynamic worksheet tables
  Object.keys(TABLE_REGISTRY).forEach(key => {
    initTable(key);
    wireTableRowEvents(key);
  });
  wireTableEvents();
  // select / checkbox fields with data-skey (single-value) and data-ckey (checkbox group)
  document.querySelectorAll('select[data-skey]').forEach(el => {
    const key = el.dataset.skey;
    if (store[key]) el.value = store[key];
    el.addEventListener('change', () => {
      store[key] = el.value;
      persist();
      markSaved();
      const showKey = el.dataset.showOther;
      if (showKey) {
        const wrap = document.getElementById(showKey);
        if (wrap) wrap.style.display = el.value === 'Other' ? 'block' : 'none';
      }
    });
    const showKey = el.dataset.showOther;
    if (showKey) {
      const wrap = document.getElementById(showKey);
      if (wrap) wrap.style.display = el.value === 'Other' ? 'block' : 'none';
    }
  });
  document.querySelectorAll('input[type=checkbox][data-ckey]').forEach(el => {
    const key = el.dataset.ckey;
    if (store[key]) el.checked = true;
    el.addEventListener('change', () => {
      store[key] = el.checked;
      persist();
      markSaved();
    });
  });
}

/* ─── FONT SIZE ─── */
const FS_SIZES = [14, 16, 18, 20];
let fsIdx = parseInt(localStorage.getItem('cn_hf_fs') || '1');
document.body.style.fontSize = FS_SIZES[fsIdx] + 'px';
function setFS(dir) {
  fsIdx = Math.max(0, Math.min(FS_SIZES.length - 1, fsIdx + dir));
  document.body.style.fontSize = FS_SIZES[fsIdx] + 'px';
  try { localStorage.setItem('cn_hf_fs', fsIdx); } catch(e) {}
}

/* ─── BOOT ─── */
document.addEventListener('DOMContentLoaded', () => { renderWB(); });

</script>
