<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Understanding My Hair Fall — Chiranjivi Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --ground:#0f0e0c;--paper:#eee9de;--ink:#232018;--ink-light:#4a4438;
  --accent:#bfa07a;--accent-dim:#8a7056;--rule:rgba(191,160,122,0.25);
  --rule-dark:rgba(191,160,122,0.12);--shadow:rgba(15,14,12,0.4);
  --serif:'Cormorant Garamond',Georgia,serif;--body:'EB Garamond',Georgia,serif;
  --page-w:700px;
}
#scroll-prog{position:fixed;top:0;left:0;height:2px;width:0%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));z-index:300;transition:width .1s linear;pointer-events:none}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ground);font-family:var(--body);font-size:16px;color:var(--ink);min-height:100vh}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5}
/* PROGRESS BAR */
#pbar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(15,14,12,.93);backdrop-filter:blur(10px);border-bottom:1px solid rgba(191,160,122,.12);padding:.58rem 1.1rem;display:flex;align-items:center;gap:.9rem;transform:translateY(-100%);transition:transform .35s ease}
#pbar.show{transform:translateY(0)}
#plabel{font-family:var(--serif);font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);opacity:.62;flex-shrink:0;white-space:nowrap}
#pdots{display:flex;gap:.32rem;flex-wrap:wrap}
.pdot{width:6px;height:6px;border-radius:50%;border:1px solid rgba(191,160,122,.26);background:transparent;transition:background .25s,transform .2s}
.pdot.done{background:var(--accent-dim);border-color:var(--accent-dim)}
.pdot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.4)}
#psec{margin-left:auto;font-family:var(--serif);font-size:.6rem;letter-spacing:.1em;color:var(--accent);opacity:.5;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#save-tag{font-family:var(--serif);font-size:.57rem;letter-spacing:.1em;color:var(--accent-dim);opacity:0;transition:opacity .4s;flex-shrink:0}
#save-tag.show{opacity:.62}
/* WORKBOOK */
#workbook{max-width:var(--page-w);margin:0 auto;padding:3rem 1.2rem 6rem}
/* COVER */
.wb-cov{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:4rem 2rem;text-align:center;position:relative}
.wb-cov::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 35% 45%,rgba(191,160,122,.055) 0%,transparent 65%)}
.cov-in{position:relative;max-width:480px}
.cov-mn{width:48px;height:48px;border:1.5px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.9rem;font-family:var(--serif);font-size:.98rem;color:var(--accent);letter-spacing:.06em;opacity:.78}
.cov-br{font-family:var(--serif);font-size:.6rem;letter-spacing:.38em;text-transform:uppercase;color:var(--accent);opacity:.58;margin-bottom:1.1rem}
.cov-h1{font-family:var(--serif);font-weight:300;font-size:clamp(1.95rem,5.5vw,3rem);color:var(--paper);line-height:1.15;margin-bottom:.45rem}
.cov-h1 em{font-style:italic;color:var(--accent)}
.cov-su{font-family:var(--serif);font-style:italic;font-size:.92rem;color:var(--paper);opacity:.38;margin-bottom:2.3rem;letter-spacing:.03em}
.cov-rl{width:46px;height:1px;background:var(--accent);opacity:.32;margin:0 auto 2.3rem}
.cov-in p.cov-intro{font-style:italic;font-size:.98rem;color:var(--paper);opacity:.52;line-height:1.8;margin-bottom:2.3rem}
.cov-btn{font-family:var(--serif);font-size:.66rem;letter-spacing:.27em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(191,160,122,.36);padding:.78rem 1.9rem;background:transparent;cursor:pointer;transition:background .3s,border-color .3s,color .3s}
.cov-btn:hover{background:rgba(191,160,122,.07);border-color:var(--accent);color:var(--paper)}
/* PAGE */
.pg{background:var(--paper);padding:2.7rem 3rem;margin-bottom:2.7rem;position:relative;box-shadow:0 6px 34px var(--shadow);opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}
.pg.vis{opacity:1;transform:translateY(0)}
.pg::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent) 0%,transparent 100%);opacity:.5}
.pg-badge{position:absolute;top:1.3rem;right:1.7rem;font-family:var(--serif);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-dim);opacity:.62}
.sec-lbl{font-family:var(--serif);font-size:.56rem;letter-spacing:.34em;text-transform:uppercase;color:var(--accent-dim);display:block;margin-bottom:.42rem}
.pg-title{font-family:var(--serif);font-size:1.72rem;font-weight:400;color:var(--ink);line-height:1.2;margin-bottom:.28rem}
.pg-purp{font-style:italic;font-size:.91rem;color:var(--ink-light);border-left:2px solid var(--accent);padding-left:.95rem;line-height:1.65;margin-bottom:1.45rem;opacity:.87}
.pg-hr{border:none;border-top:1px solid var(--rule);margin:1.35rem 0}
.instr{font-size:.95rem;color:var(--ink-light);line-height:1.75;margin-bottom:1.05rem}
.subsec{font-family:var(--serif);font-size:.98rem;font-weight:500;color:var(--ink);margin:1.45rem 0 .62rem;letter-spacing:.01em}
/* FORM */
.fl{display:block;width:100%;border:none;border-bottom:1.5px solid var(--rule-dark);border-radius:0;background:transparent;font-family:var(--body);font-size:1rem;color:var(--ink);padding:.4rem 0;margin-bottom:.82rem;outline:none;transition:border-color .2s;-webkit-appearance:none}
.fl::placeholder{color:var(--accent-dim);opacity:.48;font-style:italic}
.fl:focus{border-bottom-color:var(--accent)}
.fpair{display:grid;grid-template-columns:1fr 1fr;gap:1.05rem;margin-bottom:.85rem}
.fgrp label{display:block;font-family:var(--serif);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);margin-bottom:.18rem;opacity:.65}
.fa{display:block;width:100%;border:none;border-bottom:1.5px solid var(--rule-dark);background:rgba(191,160,122,.04);font-family:var(--body);font-size:1rem;color:var(--ink);padding:.52rem .48rem;margin-bottom:.82rem;outline:none;resize:vertical;min-height:66px;line-height:1.75;transition:border-color .2s,background .2s}
.fa::placeholder{color:var(--accent-dim);opacity:.44;font-style:italic}
.fa:focus{border-bottom-color:var(--accent);background:rgba(191,160,122,.07)}
/* CHECKBOXES */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:.43rem 1.25rem;margin-bottom:.88rem}
.cg.c1{grid-template-columns:1fr}
.ck{display:flex;align-items:flex-start;gap:.52rem;cursor:pointer;padding:.08rem 0}
.ck input[type=checkbox]{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1.5px solid var(--accent-dim);background:transparent;flex-shrink:0;cursor:pointer;position:relative;margin-top:3px;transition:background .15s,border-color .15s}
.ck input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.ck input[type=checkbox]:checked::after{content:'';position:absolute;top:1px;left:4px;width:3px;height:7px;border:1.5px solid var(--paper);border-top:none;border-left:none;transform:rotate(45deg)}
.ck-l{font-size:.88rem;color:var(--ink-light);line-height:1.45}
/* RATING */
.rat-w{margin:.68rem 0 1.15rem}
.rat-ends{display:flex;justify-content:space-between;font-family:var(--serif);font-size:.66rem;letter-spacing:.07em;color:var(--ink-light);opacity:.52;margin-bottom:.42rem}
.rat-r{display:flex;gap:.32rem}
.rat-r input[type=radio]{display:none}
.rat-r label{flex:1;text-align:center;font-family:var(--serif);font-size:.83rem;color:var(--ink-light);padding:.38rem 0;border:1px solid var(--rule);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.rat-r input[type=radio]:checked+label{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:600}
.rat-r label:hover{background:rgba(191,160,122,.1);border-color:var(--accent)}
/* BOXES */
.refbox{background:rgba(191,160,122,.062);border-left:2px solid var(--accent);padding:1.05rem 1.25rem;margin:1.45rem 0 .45rem}
.reflbl{font-family:var(--serif);font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);opacity:.66;display:block;margin-bottom:.52rem}
.refq{font-family:var(--serif);font-style:italic;font-size:.98rem;color:var(--ink);margin-bottom:.62rem;line-height:1.55}
.stepbox{background:rgba(191,160,122,.032);border:1px solid rgba(191,160,122,.18);padding:.95rem 1.25rem;margin-top:1.25rem}
.steplbl{font-family:var(--serif);font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);opacity:.58;display:block;margin-bottom:.42rem}
.stepq{font-family:var(--serif);font-style:italic;font-size:.9rem;color:var(--ink-light);margin-bottom:.52rem;line-height:1.5}
.ctxbox{background:rgba(191,160,122,.052);border:1px solid rgba(191,160,122,.19);padding:.9rem 1.15rem;margin:.85rem 0 1.25rem}
.ctxlbl{font-family:var(--serif);font-size:.55rem;letter-spacing:.27em;text-transform:uppercase;color:var(--accent);opacity:.6;display:block;margin-bottom:.48rem}
.ctxn{font-style:italic;font-size:.85rem;color:var(--ink-light);line-height:1.6;margin-bottom:.42rem}
.ctxr{font-size:.86rem;color:var(--ink-light);line-height:1.55}
.ctxd{font-size:.74rem;color:var(--ink-light);opacity:.48;font-style:italic;margin-top:.48rem}
.pgcloser{margin-top:1.65rem;padding-top:1.05rem;border-top:1px solid var(--rule-dark);font-style:italic;font-size:.86rem;color:var(--ink-light);opacity:.6;text-align:center;line-height:1.65}
.bq{border-left:2px solid var(--accent);margin:1.05rem 0;padding:.42rem 1.05rem;font-family:var(--serif);font-style:italic;font-size:.98rem;color:var(--ink-light);line-height:1.6}
.bq cite{display:block;font-size:.73rem;font-style:normal;letter-spacing:.1em;color:var(--accent-dim);margin-top:.32rem;opacity:.76}
.isnot{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin:1.05rem 0}
.isnot-col h4{font-family:var(--serif);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:.68rem}
.ii{display:flex;gap:.48rem;align-items:baseline;margin-bottom:.48rem;font-size:.88rem;color:var(--ink-light);line-height:1.4}
.iy{font-size:.68rem;color:var(--accent);opacity:.72;flex-shrink:0}
.in{font-size:.68rem;color:var(--ink-light);opacity:.42;flex-shrink:0}
.ctab{width:100%;border-collapse:collapse;margin-bottom:1.05rem;font-size:.91rem}
.ctab th{font-family:var(--serif);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-dim);padding:.42rem .58rem;text-align:left;border-bottom:1px solid var(--rule)}
.ctab td{padding:.48rem .58rem;border-bottom:1px solid var(--rule-dark);color:var(--ink-light)}
.nlist{list-style:none;counter-reset:nl;margin-bottom:.88rem}
.nlist li{display:flex;align-items:baseline;gap:.68rem;margin-bottom:.72rem;counter-increment:nl}
.nlist li::before{content:counter(nl);font-family:var(--serif);font-size:.7rem;color:var(--accent);font-weight:500;min-width:1.05rem;opacity:.8}
.tl-track{height:2px;background:linear-gradient(90deg,var(--accent-dim),var(--accent));opacity:.28;margin:1.7rem 0 .75rem;border-radius:2px}
.tl-labs{display:flex;justify-content:space-between;font-family:var(--serif);font-size:.66rem;letter-spacing:.07em;color:var(--ink-light);opacity:.48;margin-bottom:1.05rem}
.bridge{text-align:center;padding:1.6rem 0 1.35rem;font-family:var(--serif);font-style:italic;font-size:1.07rem;color:var(--ink);line-height:1.9;letter-spacing:.01em}
/* PEARL / DOCTOR'S NOTE / MYTH-FACT (Hair Fall–specific additions to the component family) */
.pearl{background:linear-gradient(135deg,rgba(191,160,122,.07),rgba(191,160,122,.03));border:1px solid rgba(191,160,122,.22);border-top:2px solid var(--accent);padding:1.25rem 1.4rem;margin:1.45rem 0;text-align:center}
.pearl-lbl{font-family:var(--serif);font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);opacity:.7;display:flex;align-items:center;justify-content:center;gap:.4rem;margin-bottom:.65rem}
.pearl-tx{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--ink);line-height:1.55}
.dnote{display:flex;gap:.85rem;background:rgba(191,160,122,.045);border:1px solid rgba(191,160,122,.16);padding:1rem 1.2rem;margin:1.25rem 0}
.dnote-ic{width:26px;height:26px;border-radius:50%;border:1.3px solid var(--accent-dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--accent-dim);opacity:.85}
.dnote-ic svg{width:13px;height:13px}
.dnote-lbl{font-family:var(--serif);font-size:.55rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-dim);opacity:.75;display:block;margin-bottom:.32rem}
.dnote-tx{font-size:.88rem;color:var(--ink-light);line-height:1.62}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:.05rem;border-bottom:1px solid var(--rule-dark);padding:.7rem 0}
.mf-col{padding:0 .85rem}
.mf-col:first-child{border-right:1px solid var(--rule-dark)}
.mf-tag{font-family:var(--serif);font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;opacity:.68;display:block;margin-bottom:.3rem}
.mf-tag.m{color:var(--accent-dim)}
.mf-tag.f{color:var(--accent)}
.mf-tx{font-size:.85rem;color:var(--ink-light);line-height:1.5}
.evbadge{border:1px solid rgba(191,160,122,.22);margin:1.1rem 0;background:rgba(191,160,122,.02)}
.evbadge summary{cursor:pointer;padding:.85rem 1.1rem;font-size:.87rem;color:var(--ink);font-weight:500;list-style:none;display:flex;align-items:baseline;gap:.6rem}
.evbadge summary::-webkit-details-marker{display:none}
.evbadge summary::before{content:'◇';color:var(--accent);font-size:.8rem;flex-shrink:0}
.evbadge summary::after{content:'+';margin-left:auto;color:var(--accent-dim);font-family:var(--serif)}
.evbadge[open] summary::after{content:'−'}
.ev-body{padding:0 1.1rem 1.1rem}
.ev-row{padding:.6rem 0;border-top:1px solid var(--rule-dark)}
.ev-tag{font-family:var(--serif);font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7;display:block;margin-bottom:.3rem}
.ev-tag.high{color:var(--accent)}
.ev-tag.unc{color:var(--accent-dim)}
.ev-tag.mis{color:#a8665c}
.ev-row p{font-size:.84rem;color:var(--ink-light);line-height:1.55}
/* ZONES (traffic-light, translated to gold-system tones) */
.zone{border:1px solid rgba(191,160,122,.2);padding:1.1rem 1.3rem;margin:1rem 0}
.zone-h{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem}
.zone-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.zone.g .zone-dot{background:#8a9a72}
.zone.y .zone-dot{background:var(--accent)}
.zone.r .zone-dot{background:#a8665c}
.zone-t{font-family:var(--serif);font-size:1rem;color:var(--ink)}
.zone ul{list-style:none;padding-left:1.4rem}
.zone li{font-size:.86rem;color:var(--ink-light);line-height:1.6;margin-bottom:.35rem;position:relative}
.zone li::before{content:'—';position:absolute;left:-1.4rem;opacity:.5}
/* SUMMARY */
.sum-pg{background:var(--paper);padding:2.7rem 3rem;margin-bottom:2.7rem;position:relative;box-shadow:0 6px 34px var(--shadow);opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}
.sum-pg.vis{opacity:1;transform:translateY(0)}
.sum-pg::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent) 0%,transparent 100%);opacity:.5}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:.42rem 1.4rem;margin:.88rem 0 1.25rem}
.sc{display:flex;align-items:center;gap:.52rem;padding:.42rem 0;border-bottom:1px solid var(--rule-dark);font-size:.88rem;color:var(--ink-light);cursor:pointer}
.sc input[type=checkbox]{appearance:none;-webkit-appearance:none;width:13px;height:13px;border:1.5px solid var(--accent-dim);background:transparent;flex-shrink:0;cursor:pointer;position:relative;transition:background .15s}
.sc input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.sc input[type=checkbox]:checked::after{content:'';position:absolute;top:1px;left:3px;width:3px;height:7px;border:1.5px solid var(--paper);border-top:none;border-left:none;transform:rotate(45deg)}
.t3w{margin:1.05rem 0}
.t3i{display:flex;align-items:baseline;gap:.75rem;margin-bottom:.85rem}
.t3n{font-family:var(--serif);font-size:1.45rem;font-weight:300;color:var(--accent);opacity:.42;line-height:1;min-width:1.25rem}
#smart-sum{background:rgba(191,160,122,.068);border-left:3px solid var(--accent);padding:1.25rem 1.4rem;margin:1.35rem 0;display:none}
#smart-sum.show{display:block}
#smart-sum .ss-lbl{font-family:var(--serif);font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);opacity:.66;display:block;margin-bottom:.65rem}
#smart-sum .ss-txt{font-style:italic;font-size:.95rem;color:var(--ink);line-height:1.72}
#smart-sum .ss-disc{font-size:.74rem;color:var(--ink-light);opacity:.48;margin-top:.65rem;font-style:italic}
.dl-sec{text-align:center;margin:1.7rem 0 .75rem;padding-top:1.25rem;border-top:1px solid var(--rule-dark)}
.dl-btn{display:inline-flex;align-items:center;gap:.52rem;font-family:var(--serif);font-size:.65rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(191,160,122,.3);padding:.78rem 1.75rem;background:transparent;cursor:pointer;transition:background .3s,border-color .3s,color .3s}
.dl-btn:hover{background:rgba(191,160,122,.07);border-color:var(--accent);color:var(--paper)}
.dl-note{font-size:.75rem;font-style:italic;color:var(--accent-dim);opacity:.52;margin-top:.58rem}
.copy-btn{display:inline-flex;align-items:center;gap:.52rem;font-family:var(--serif);font-size:.65rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(191,160,122,.3);padding:.78rem 1.75rem;background:transparent;cursor:pointer;transition:background .3s,border-color .3s,color .3s;margin-bottom:.6rem}
.copy-btn:hover{background:rgba(191,160,122,.07);border-color:var(--accent);color:var(--paper)}
.comp-stat{font-family:var(--serif);font-size:.78rem;color:var(--ink-light);opacity:.65;margin-bottom:1.2rem;letter-spacing:.04em}
.comp-stat span{color:var(--accent);font-weight:500}
/* WHAT NEXT */
.nxt-pg{background:var(--ground);border:1px solid rgba(191,160,122,.11);padding:2.7rem 3rem;margin-bottom:2.7rem;position:relative;box-shadow:0 6px 34px rgba(0,0,0,.5);opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}
.nxt-pg.vis{opacity:1;transform:translateY(0)}
.nxt-pg::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent) 0%,transparent 100%);opacity:.58}
.nxt-pg .pg-badge{color:rgba(191,160,122,.36)}
.nxt-pg .sec-lbl{color:rgba(191,160,122,.43)}
.nxt-pg .pg-title{color:var(--paper)}
.nxt-pg .pg-purp{color:rgba(238,233,222,.43);border-left-color:rgba(191,160,122,.32)}
.nxt-pg .pg-hr{border-top-color:rgba(191,160,122,.1)}
.nxt-pg .subsec{color:rgba(238,233,222,.72)}
.done-badge{display:inline-flex;align-items:center;gap:.48rem;background:rgba(191,160,122,.09);border:1px solid rgba(191,160,122,.2);padding:.42rem .9rem;margin-bottom:1.35rem;font-family:var(--serif);font-size:.7rem;letter-spacing:.13em;color:var(--accent)}
.done-badge::before{content:'✓';font-size:.73rem}
.ser-tag{font-family:var(--serif);font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);opacity:.52;display:block;margin-bottom:1.15rem}
.nb-grid{display:grid;grid-template-columns:1fr 1fr;gap:.68rem;margin:.85rem 0 1.25rem}
.nb{border:1px solid rgba(191,160,122,.13);padding:.9rem 1.05rem;transition:border-color .2s,background .2s}
.nb:hover{border-color:rgba(191,160,122,.3);background:rgba(191,160,122,.04)}
.nb-t{font-family:var(--serif);font-size:.9rem;color:var(--paper);opacity:.76;display:block;margin-bottom:.22rem}

</div>
<script>
/* ═══════════════════════════════════════════════════════
   CONTENT — Understanding My Hair Fall (English)
   Structure mirrors the Chiranjivi Notes zine engine:
   T.en.pages[] is an ordered array of page objects.
═══════════════════════════════════════════════════════ */
const T = {};

T.en = {
 lang:'en', brand:'Chiranjivi Notes®',
 title:'Understanding My Hair Fall', sub:'A Patient Companion Workbook',
 beginBtn:'Begin Reading ↓',
 intro:'Before asking how to stop it,\nlet us first understand why it began.',
 saved:'Saved', progLbl:'Your Journey',
 colophon:'Chiranjivi Notes®\nUnderstanding My Hair Fall\nA Patient Companion Workbook',

 pages:[

  /* ───────── 1. THE DAY YOU STARTED COUNTING HAIRS ───────── */
  {badge:'Chapter One', sec:'Beginning', title:'The Day You Started Counting Hairs',
   purp:'For many people, hair fall doesn\u2019t begin in the scalp. It begins in the mind.',
   body:`<p class="instr">"I wasn't worried until I saw them on my pillow."</p>
<p class="instr" style="margin-top:.9rem">A few strands on a pillow. A small cluster caught in the shower drain. Hair wrapped around a comb after getting ready for work. And suddenly, an ordinary morning becomes a frightening one.</p>
<p class="instr">Questions arrive almost instantly. <em>Am I going bald? Is something seriously wrong with me? Will this get worse?</em></p>
<p class="instr">Some people start counting the hairs. Others avoid washing their hair because they're afraid of what they might see. Some take photographs every week, comparing one image with another. And some lie awake scrolling through strangers' hair loss photographs online, trying to work out — half hoping, half dreading — whether their own case looks "that bad" too.</p>
<p class="instr">None of this makes you anxious or unreasonable. It simply means you've noticed something, and you don't yet know what it means.</p>
<p class="instr">Hair occupies a strange place in our lives. It shows up in wedding photographs and passport pictures, in the parting your mother used to comb every morning, in the selfie you almost didn't post because of the light. Somewhere along the way, it stopped being just hair and became a small, quiet measure of how things are going.</p>
<div class="bq">Seeing hair is not the same as losing hair.<cite>— Chiranjivi Notes</cite></div>
<p class="instr">Every day, healthy hair follicles complete their natural cycle. Some hairs grow. Some rest. Some are released so that new ones can eventually take their place. The problem is that our minds are not very good at judging this process. We notice what is visible. We notice what is unexpected. We notice what confirms our fears.</p>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect</span>
 <p class="refq">Think back to the moment you first started worrying. Was it a single observation — a clump in the drain, a photograph that startled you — or a change you'd been half-noticing for weeks?</p>
 <textarea class="fa" data-key="ch1-r1" placeholder="There's no right answer here. Just notice which one it was." rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">A few weeks ago, a patient sat across from me holding her phone, scrolling to a photograph of her hairbrush. <em>"Doctor, dekhiye"</em> she said — look at this. For three weeks she had been documenting the evidence: her brush, her pillow, the shower drain, almost like a case file.</p>
<p class="instr">I didn't ask how many hairs were in the photograph. I asked when it had started. Whether anything had changed around that time. Whether the thinning was spread across the scalp, or concentrated along the parting.</p>
<p class="instr">By the time we had talked for ten minutes, the photographs hadn't been opened once. They weren't needed. The story she told me mattered more than anything a picture could show.</p>
<div class="dnote">
 <div class="dnote-ic"><svg viewBox="0 0 20 20" fill="none"><path d="M6 3v6a4 4 0 008 0V3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="16" cy="11" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M14 13c-1 2-3 3-5 3-3.5 0-6-2.5-6-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
 <div><span class="dnote-lbl">Doctor's Note</span><p class="dnote-tx">Doctors rarely begin by asking "How many hairs did you count today?" The questions that matter more: when did you first notice the change, is it spread across the scalp or concentrated in one area, has anything changed recently — an illness, surgery, childbirth, a new medication — and does this run in your family?</p></div>
</div>
<p class="instr">Throughout this workbook, you'll discover that hair fall is not a single disease. It's a symptom with many possible stories — sometimes a healthy cycle, sometimes a fever or an operation, sometimes genetics, sometimes nutrition or hormones, and sometimes it simply needs time.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">Fear counts hairs. Medicine looks for patterns.</p>
</div>`,
   closer:'In the next chapter, we\u2019ll look more closely at how a doctor actually thinks through these patterns — not as one question, but as several small ones.'},

  /* ───────── 2. HAIR IS MEANT TO FALL ───────── */
  {badge:'Chapter Two', sec:'The Cycle', title:'Hair Is Meant to Fall',
   purp:'If your hair never fell, new hair would never have the chance to grow.',
   body:`<p class="instr">"Doctor, if hair is supposed to stay on my head, why does it keep falling?" It's one of the most common questions heard in clinic — and the answer tends to surprise people.</p>
<div class="bq">Healthy hair falls.<cite>— Chiranjivi Notes</cite></div>
<p class="instr">Think of how your skin renews itself, or how nails grow and are quietly trimmed without anyone calling it a loss. Hair follows something similar — not on a seasonal clock, but on a cycle that repeats itself thousands of times over, across your scalp, every single day.</p>
<p class="instr">At any given moment, every follicle on your head is at a different point in this cycle. Some hairs are growing. Some are pausing. Some are quietly preparing to fall. Some have just finished their turn and are making room for the next strand to begin.</p>
<p class="instr">Growth (<em>anagen</em>) is by far the longest stage — anywhere from two to seven years, which is why some people can grow hair down to their waist and others can't get much past their shoulders. Then comes a brief transition (<em>catagen</em>), so short you'd never notice it happening. And finally, rest and release (<em>telogen</em>) — the hair rests, then is shed, making way for a new hair to begin.</p>
<div class="tl-track"></div>
<div class="tl-labs"><span>Anagen — Growing</span><span>Catagen — Transitioning</span><span>Telogen — Resting</span></div>
<p class="instr"><strong style="color:var(--ink)">A hair falling out does not necessarily mean the follicle has died.</strong> More often, it means the follicle has simply completed one cycle, and is already preparing for the next.</p>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect</span>
 <p class="refq">Until now, did "hair fall" and "hair loss" feel like the same thing to you?</p>
 <textarea class="fa" data-key="ch2-r1" placeholder="One is a daily, ongoing process. The other is what happens when that process is disrupted." rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">There's no magic number that separates health from disease, but most healthy people shed somewhere between fifty and a hundred hairs a day. You're likely to notice more on the days you wash or brush your hair, if your hair is long, or after a gap of several days without shampooing.</p>
<p class="instr">This is also why the shower drain can be misleading. The shower didn't cause the hair to fall — it simply gathered together hairs that had already reached the end of their cycle.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">The drain is a collector. It is not a diagnosis.</p>
</div>
<div class="evbadge">
 <summary>Worth mentioning to your doctor</summary>
 <div class="ev-body">
  <p style="font-size:.84rem;color:var(--ink-light);line-height:1.6;padding-top:.6rem">Most shedding is ordinary. A few patterns genuinely deserve a closer look — not so you can diagnose yourself, but so you know what's worth raising.</p>
  <ul class="nlist" style="margin-top:.6rem">
   <li>Hair becoming visibly thinner over weeks or months, rather than days</li>
   <li>A central part that's gradually widening, or a receding hairline</li>
   <li>Smooth, well-defined bald patches</li>
   <li>Heavier shedding that started after an illness, surgery, childbirth, or rapid weight loss</li>
   <li>Itching, pain, redness, or scaling of the scalp</li>
  </ul>
 </div>
</div>`,
   closer:'Normal biology is often quiet. Sometimes, it leaves a few strands behind.'},

  /* ───────── 3. SHEDDING IS NOT THE SAME AS THINNING ───────── */
  {badge:'Chapter Three', sec:'The Distinction', title:'Shedding Is Not the Same as Thinning',
   purp:'These are different things, and telling them apart is one of the most useful skills in this entire workbook.',
   body:`<p class="instr">"Doctor, my hair is falling so much. Am I going bald?" Before answering, I usually ask another question: <em>is your hair falling, or is it becoming thinner?</em></p>
<p class="instr">At first glance, they sound like the same thing. They're not — and the difference matters more than most people expect.</p>
<p class="instr"><strong style="color:var(--ink)">Shedding</strong> is about hair that's leaving the scalp — strands in the comb, on the pillow, in the drain. Sometimes it increases for a while after a fever, childbirth, surgery, or a stretch of significant stress, and it usually reflects a change in the hair cycle rather than permanent damage.</p>
<p class="instr"><strong style="color:var(--ink)">Thinning</strong> is different. Here, the question isn't how many hairs fell today, but whether the hair that remains is changing — a ponytail that feels thinner, a scalp that's easier to see, a parting that's slowly widening. This change is often so gradual that a photograph from a year ago tells a clearer story than memory does.</p>
<div class="ctxbox">
 <span class="ctxlbl">Case Reflection</span>
 <p class="ctxn">Two patients came to see me within the same week, both worried about their hair.</p>
 <p class="ctxr">The first arrived holding a small bundle of hair she'd gathered after washing it. Her scalp examination was normal; her hair was still dense under the light. Almost as an afterthought, she mentioned a bad viral fever two months earlier. She was <strong>shedding</strong>.</p>
 <p class="ctxr" style="margin-top:.5rem">The second said very little about hair falling at all. What had brought her in was an old wedding photograph, held next to her reflection in the clinic mirror. Her temples had receded slightly; the crown looked less dense. She was <strong>thinning</strong>.</p>
 <p class="ctxd">The first was likely to recover with time. The second might benefit from a longer-term plan. The stories were different — so the conversations that followed were different too.</p>
</div>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect</span>
 <p class="refq">When you think about your own hair, are you mostly noticing what's fallen, or what's changed?</p>
 <textarea class="fa" data-key="ch3-r1" placeholder="Hold onto your answer — we'll come back to it later in this workbook." rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">Shedding and thinning can also occur together. Someone with an inherited tendency toward thinning may also go through a stretch of heavier shedding after an illness. Real life rarely sorts itself into clean categories — which is exactly why a careful history matters more than any single observation.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">The comb tells you that hair has fallen.<br>The mirror tells you whether your hair is changing.<br>The story emerges only when you look at both.</p>
</div>`,
   closer:'In the next chapter, we\u2019ll look more closely at how a doctor actually thinks through these patterns — not as one question, but as several small ones.'},
  /* ───────── 4. YOUR COMB COUNTS HAIRS. YOUR DOCTOR COUNTS CLUES. ───────── */
  {badge:'Chapter Four', sec:'The Clue Map', title:'Your Comb Counts Hairs. Your Doctor Counts Clues.',
   purp:'A number alone could never tell the whole story.',
   body:`<p class="instr">"Doctor, I counted 147 hairs after my shower today." He looked at me, expecting the number itself to explain everything. It couldn't — not because the hairs didn't matter, but because medicine rarely works by counting isolated events. It works by looking for patterns.</p>
<p class="instr">Once you've noticed something, what is your doctor actually trying to find out? Not a number. A set of clues — and there are six that matter most.</p>
<table class="ctab">
 <tr><th>Clue</th><th>What it reveals</th></tr>
 <tr><td><strong>Timeline</strong></td><td>When this began, and whether suddenly or gradually</td></tr>
 <tr><td><strong>Pattern</strong></td><td>Whether it's everywhere, or concentrated in certain areas</td></tr>
 <tr><td><strong>Trigger</strong></td><td>Illness, surgery, childbirth, or stress in the last 3–6 months</td></tr>
 <tr><td><strong>The Scalp</strong></td><td>Itching, pain, redness, scaling, or smooth bald patches</td></tr>
 <tr><td><strong>The Rest of the Story</strong></td><td>Fatigue, weight change, diet, family history</td></tr>
 <tr><td><strong>The Mirror</strong></td><td>What a photo from months ago shows, compared to today</td></tr>
</table>
<p class="instr">Sometimes the body remembers an event long after the mind has moved on. A severe infection, major surgery, rapid weight loss, childbirth, a new medicine — any of these can leave a delayed signature, showing up in the hair months after the event itself has been forgotten.</p>
<div class="dnote">
 <div class="dnote-ic"><svg viewBox="0 0 20 20" fill="none"><path d="M6 3v6a4 4 0 008 0V3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="16" cy="11" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M14 13c-1 2-3 3-5 3-3.5 0-6-2.5-6-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
 <div><span class="dnote-lbl">Doctor's Note</span><p class="dnote-tx">I ask about the 2–4 months before shedding began before almost anything else, because follicles respond on a delay. This single question often does more diagnostic work than any test I could order.</p></div>
</div>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect</span>
 <p class="refq">Think back over the last six to twelve months. Was there an illness, a stressful stretch, a change in medication, or a shift in diet or weight you hadn't connected to your hair until now?</p>
 <textarea class="fa" data-key="ch4-r1" placeholder="You don't need to draw conclusions. Just notice if something comes to mind." rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">Many patients spend hours studying the hair that's already fallen. Far fewer spend time comparing a recent photograph with one from six or twelve months ago — even though that's often where the more useful story lives.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">The comb records an event. The doctor reconstructs a pattern. And somewhere between the two lies the diagnosis.</p>
</div>`,
   closer:'In the next chapter, we\u2019ll look at exactly what your doctor is likely to ask, and why each question earns its place.'},

  /* ───────── 5. THE QUESTIONS YOUR DOCTOR WILL ASK ───────── */
  {badge:'Chapter Five', sec:'The Consultation', title:'The Questions Your Doctor Will Ask — And Why',
   purp:'You came in because of your hair. But your hair didn\u2019t arrive alone.',
   body:`<p class="instr">"Doctor, why are you asking about my fever? I came because of my hair." It's a fair question. Many people expect a hair consultation to begin and end with the scalp. Instead, it often opens with a conversation that seems to wander everywhere except the scalp.</p>
<p class="instr">At first, these questions can feel like a detour. They're not — they're usually the shortest route to an answer.</p>
<p class="instr">A recent illness, a hospital stay, a new baby, a new medicine, a strict diet, a sudden change in weight — each of these can show up in the hair weeks or months later, long after the event itself has stopped feeling relevant.</p>
<p class="instr">Family history comes up too — not because genetics decide everything, but because they often shape the pattern and timing of thinning.</p>
<div class="bq">Inheritance is a clue, not a sentence.<cite>— Chiranjivi Notes</cite></div>
<p class="instr">Then come the questions that can feel the most out of place: how are you sleeping, how have you been coping. These aren't asked to suggest your hair fall is "just stress." They're asked because the body doesn't keep separate ledgers for physical and emotional load — a difficult year can show up in your hair just as it can in your sleep or your appetite.</p>
<div class="stepbox">
 <span class="steplbl">Before Your Appointment</span>
 <p class="stepq">A few minutes of thought beforehand can make the conversation more useful for both of you.</p>
 <ul class="nlist">
  <li>Roughly when you first noticed the change, even just an approximate month</li>
  <li>Anything from the last year that felt significant — illness, stress, a change in diet, weight, or medication</li>
  <li>Whether your scalp itches, hurts, or looks different anywhere</li>
  <li>Whether anyone in your family has had similar changes, and roughly when</li>
 </ul>
</div>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect</span>
 <p class="refq">If you had to describe your hair concern in one sentence — without mentioning a number — what would you say?</p>
 <textarea class="fa" data-key="ch5-r1" placeholder="When did you first notice a change? Has anything else changed around the same time?" rows="2"></textarea>
</div>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">You came in because of your hair. But your hair didn't arrive alone — it brought the rest of your story with it.</p>
</div>`,
   closer:'The next several chapters look at the most common stories hair fall tells — starting with the one that frightens people most, and reassures them most once understood.'},

  /* ───────── 6. A MAP, NOT A DESTINATION ───────── */
  {badge:'Chapter Six', sec:'Genetics', title:'A Map, Not a Destination',
   purp:'Your family history hands you a map. It does not write your destination.',
   body:`<p class="instr">"Doctor, every man in my family lost his hair. Is there even any point in worrying about it? Isn't my future already written?" It's a question I hear often, and it usually arrives heavier than the words suggest.</p>
<p class="instr">Think of your family history not as a prophecy carved in stone, but as a map handed down through generations. A map shows you the terrain ahead. It's genuinely useful information. But it doesn't chain you to anyone else's journey, and it doesn't dictate exactly where you'll end up. It simply tells you what to watch for.</p>
<p class="instr">One reason inherited hair loss feels so inevitable is that it rarely announces itself with drama. Unlike sudden, heavy shedding, this kind of change is slow — unfolding over years rather than weeks.</p>
<div class="evbadge">
 <summary>What's actually happening underneath</summary>
 <div class="ev-body">
  <p style="font-size:.84rem;color:var(--ink-light);line-height:1.6;padding-top:.6rem">A common misconception is that the follicle simply dies. For most people with inherited hair loss, something more subtle happens: the follicle goes through <em>miniaturization</em>, gradually producing hair that's shorter, finer, and lighter than before. The follicle isn't gone — it's producing something much smaller and less visible.</p>
 </div>
</div>
<p class="instr">This is why so many people say "I don't see much shedding, but my ponytail feels thinner" — they're noticing a change in quality, not quantity.</p>
<p class="instr">You've probably also heard the old idea that pattern hair loss comes only from your mother's side. There is a relevant gene on the X chromosome, so the idea isn't entirely invented — but it's an oversimplification. The genetics involved are complex, influenced by multiple genes from both sides of your family.</p>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect</span>
 <p class="refq">Whose hair story in your family has shaped your own fears the most? What's the main feeling that comes up when you think of it?</p>
 <textarea class="fa" data-key="ch6-r1" placeholder="There's no need to do anything with the answer yet. Just notice it." rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">Many people assume that if something is genetic, it must be untreatable. That isn't quite right. No treatment can rewrite your genetic code, but several evidence-based options can help slow the progression and maintain the hair you have. The earlier this kind of change is recognised, the more these options tend to help.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">A family history is a clue, not a conclusion. Your genes hand you a map. You're still the one holding the compass.</p>
</div>`,
   closer:'Not every story is genetic, though. Sometimes the body is simply finishing a conversation it started months ago — which is where we turn next.'},

  /* ───────── 7. THE ECHO OF A PAST STORM ───────── */
  {badge:'Chapter Seven', sec:'Telogen Effluvium', title:'The Echo of a Past Storm',
   purp:'Hair doesn\u2019t always react in real time. Sometimes it\u2019s finishing a conversation your body started months ago.',
   body:`<p class="instr">"Doctor, I recovered from a bad illness three months ago. I'm finally feeling like myself again. So why is my hair falling out now?" At first, it makes no sense. More often, the truth runs the other way: what you're seeing is the delayed echo of a storm your body has already weathered.</p>
<p class="instr">When your body goes through a major physical stress — a high fever, major surgery, childbirth, rapid weight loss — it makes a series of quietly brilliant decisions about where to send its resources. Hair growth, however important it feels, isn't on the survival list. So the body, sensibly, hits pause — shifting a larger-than-usual number of follicles out of their growth phase and into a resting one.</p>
<p class="instr">Those hairs don't fall the next day. They sit quietly for two, three, sometimes four months before being shed all at once. By the time that happens, the original event is often long out of mind.</p>
<div class="evbadge" open>
 <summary>Telogen effluvium and recovery</summary>
 <div class="ev-body">
  <div class="ev-row"><span class="ev-tag high">High confidence</span><p>A clear trigger followed by diffuse shedding 2–4 months later, resolving as the trigger settles, is well documented and consistently observed.</p></div>
  <div class="ev-row"><span class="ev-tag unc">Still uncertain</span><p>Exactly how long full recovery takes varies by person and by trigger. A minority of cases become more prolonged without a single identifiable cause.</p></div>
  <div class="ev-row"><span class="ev-tag mis">Common misconception</span><p>That any dramatic, sudden shedding automatically means something is critically wrong right now. Often it's the delayed tail of something the body already dealt with.</p></div>
 </div>
</div>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect — Looking at Your Timeline</span>
 <p class="refq">Count back three to four months from today. What was happening in your life around then?</p>
 <textarea class="fa" data-key="ch7-r1" placeholder="An illness, a hospital stay, a stretch of severe stress, a new medication?" rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">In the large majority of cases, this kind of shedding — known as telogen effluvium — is temporary and resolves on its own. The follicles aren't damaged or gone; they were simply resting.</p>
<p class="instr">It's worth being clear that this should still be confirmed with a doctor rather than self-diagnosed — but if it does fit this pattern, it's worth letting that reframe what you see in the drain. Not the start of something new. The last, delayed sign-off from something already finished.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">The shedding you see today may be the echo of a challenge you've already survived.</p>
</div>`,
   closer:'Some stories are sudden, but most are slow. The next chapter looks at the slowest and most common of all — pattern hair loss.'},
  /* ───────── 8. THE GREAT EXHALE ───────── */
  {badge:'Chapter Eight', sec:'Postpartum', title:'The Great Exhale',
   purp:'It is your body\u2019s great, messy, beautiful exhale.',
   body:`<p class="instr">"Doctor, my baby is three months old, and my hair is falling out in handfuls. Did pregnancy ruin my hair forever?" You expected the sleepless nights and the round-the-clock feeding. What you probably didn't expect was standing in the shower, watching a genuinely frightening amount of hair gather around the drain.</p>
<p class="instr">During pregnancy, your body performs a quiet kind of magic. Elevated hormones keep hair follicles in their growth phase for longer than usual — part of why so many women enjoy thicker, fuller hair while pregnant. For nine months, your body is essentially holding its breath.</p>
<p class="instr">After delivery, hormone levels begin their journey back toward where they were before. As that tide recedes, all the hairs that had been held back get the signal to move into shedding, more or less together.</p>
<div class="bq">What feels like a sudden, dramatic loss is really a great and necessary exhale.<cite>— Chiranjivi Notes</cite></div>
<p class="instr">Picture a tree that holds onto its leaves through an unusually long, warm autumn. When the first real cold finally arrives, it sheds them all at once — the ground suddenly carpeted, looking dramatic, though the tree itself is perfectly fine. Postpartum shedding works the same way. It looks like more because it's arriving all at once.</p>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect — A Season of Profound Change</span>
 <p class="refq">Beyond your hair, what are three other ways your body and your life have changed over these last few months?</p>
 <textarea class="fa" data-key="ch8-r1" placeholder="Write them down without judging them." rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">For the great majority of women, this kind of shedding is temporary, and the cycle normalises with time. It moves at the pace of biology — hair grows in millimetres, not miracles.</p>
<p class="instr">While nothing can stop this hormonal process outright, you can support your body as it finds its balance: eat well, rest when you're able to, be gentle with your hair, and try to let go of comparison with whatever you're seeing online.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">The hair that falls after childbirth isn't a sign that something has gone wrong. It's a sign that a cycle is completing, making room for what's next.</p>
</div>`,
   closer:'For most mothers, the fear doesn\u2019t come true. The cycle moves on. The body finds its balance.'},

  /* ───────── 9. A CASE OF MISTAKEN IDENTITY ───────── */
  {badge:'Chapter Nine', sec:'Alopecia Areata', title:'A Case of Mistaken Identity',
   purp:'A story of confusion, not destruction.',
   body:`<p class="instr">"Doctor, I woke up with a round bald patch on my scalp. It appeared out of nowhere. It doesn't hurt or itch. But I'm terrified." Most changes to our hair happen in slow motion. Sometimes the story arrives differently — a perfectly smooth, coin-sized patch of bare scalp where hair was, just the day before.</p>
<p class="instr">The discovery often brings a jolt of real fear. If that's where your thoughts have gone, take a slow breath. The most common explanation for this kind of sudden patch is a story of confusion rather than disease.</p>
<p class="instr">Think of your immune system as a vigilant, well-trained security force. It does this job brilliantly, almost all the time. But occasionally, for reasons not yet fully understood, it misidentifies something of yours as an intruder — in this case, a healthy hair follicle. This is the basis of a condition called <strong>alopecia areata</strong>.</p>
<div class="bq">The follicle isn't destroyed. It's interrupted — quietly waiting for the confusion to settle.<cite>— Chiranjivi Notes</cite></div>
<div class="evbadge">
 <summary>Alopecia areata and regrowth</summary>
 <div class="ev-body">
  <div class="ev-row"><span class="ev-tag high">High confidence</span><p>Spontaneous regrowth in limited alopecia areata is common and well documented.</p></div>
  <div class="ev-row"><span class="ev-tag unc">Still uncertain</span><p>The course is genuinely unpredictable for an individual — some have a single patch that regrows and never recurs, others have a more extensive or recurring pattern.</p></div>
  <div class="ev-row"><span class="ev-tag mis">Common misconception</span><p>That one patch means inevitable progression to total hair loss. For most people with limited disease, that's not the typical course.</p></div>
 </div>
</div>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect — Naming the First Fear</span>
 <p class="refq">What was the very first word that came to mind when you found the patch?</p>
 <textarea class="fa" data-key="ch9-r1" placeholder="Naming the first fear plainly is often the first real step toward replacing it with facts." rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">A common question that follows is "was it stress, did I cause this?" The honest answer is that while severe stress may act as a trigger for some people, the link isn't fully proven and certainly doesn't explain every case. Blaming yourself for the intricate workings of your immune system is a weight you don't need to carry.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">A patch of hair loss can feel like a final verdict. In reality, it's a biological question waiting for an answer.</p>
</div>`,
   closer:'This is a different kind of story from much of what this workbook covers — not hormones, not genetics, but a temporary, localised mix-up.'},

  /* ───────── 10. A MESSENGER FROM WITHIN ───────── */
  {badge:'Chapter Ten', sec:'Internal Causes', title:'A Messenger From Within',
   purp:'Sometimes the most effective treatment has nothing to do with the scalp.',
   body:`<p class="instr">"Doctor, could my hair be trying to tell me something about the rest of my health?" It's one of the more insightful questions a person can ask. And the quiet, honest answer is yes.</p>
<p class="instr">Hair doesn't exist in isolation. It's nourished by the same blood, the same nutrients, the same hormones that support every other part of your body. When something is under strain, hair is often one of the first places that change becomes visible — a sensitive messenger, rather than the problem itself.</p>
<p class="instr">Imagine your body as a well-run city facing a resource shortage. The people in charge make hard calls — power stays on for hospitals, while the public gardens get switched off for a while. Your body works on a similar logic, sending resources toward organs essential for keeping you alive, and away from things that matter less urgently, hair growth among them.</p>
<table class="ctab">
 <tr><th>Internal cause</th><th>What often comes with it</th></tr>
 <tr><td>Iron deficiency</td><td>Heavy periods, fatigue, restrictive diet</td></tr>
 <tr><td>Thyroid disease</td><td>Weight change, temperature intolerance, fatigue</td></tr>
 <tr><td>Crash dieting</td><td>Severe protein restriction, rapid weight loss</td></tr>
 <tr><td>Hormonal disorders (e.g. PCOS)</td><td>Irregular periods, acne, excess facial hair</td></tr>
</table>
<div class="evbadge">
 <summary>On vitamins and supplements</summary>
 <div class="ev-body">
  <div class="ev-row"><span class="ev-tag high">High confidence</span><p>Treating a lab-confirmed deficiency has a reasonable evidence base for improving related shedding.</p></div>
  <div class="ev-row"><span class="ev-tag unc">Still uncertain</span><p>For people without a confirmed deficiency, evidence that extra supplementation meaningfully helps hair is weak and inconsistent.</p></div>
  <div class="ev-row"><span class="ev-tag mis">Common misconception</span><p>That more vitamins are automatically safer. Excessive doses of some supplements have been associated with worsened shedding rather than improvement.</p></div>
 </div>
</div>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect</span>
 <p class="refq">Beyond your hair, have you noticed any other "messages" lately — changes in energy, sleep, weight, or mood?</p>
 <textarea class="fa" data-key="ch10-r1" placeholder="" rows="2"></textarea>
</div>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">Hair isn't separate from the rest of the body — it's a sensitive reflection of it.</p>
</div>`,
   closer:'A blood test is a flashlight, not a crystal ball. We\u2019ll look at exactly how and when to use one in a later chapter.'},

  /* ───────── 11. THE HABITS WE BLAME ───────── */
  {badge:'Chapter Eleven', sec:'Myths', title:'The Habits We Blame — And the Habits That Matter',
   purp:'Evidence lasts longer than advertising.',
   body:`<p class="instr">"Doctor, is my shampoo causing my hair fall? Should I stop washing it? Would oiling every day make it stronger? Did wearing a helmet damage my hair?" When it comes to hair, myths spread faster than evidence.</p>
<div class="mf-row">
 <div class="mf-col"><span class="mf-tag m">Myth</span><span class="mf-tx">Washing my hair makes it fall.</span></div>
 <div class="mf-col"><span class="mf-tag f">Fact</span><span class="mf-tx">The shower reveals hairs already ready to shed. It doesn't create the shedding.</span></div>
</div>
<div class="mf-row">
 <div class="mf-col"><span class="mf-tag m">Myth</span><span class="mf-tx">More oil means stronger hair.</span></div>
 <div class="mf-col"><span class="mf-tag f">Fact</span><span class="mf-tx">Oil cares for the hair shaft. It cannot rewrite the biology of the follicle.</span></div>
</div>
<div class="mf-row">
 <div class="mf-col"><span class="mf-tag m">Myth</span><span class="mf-tx">Cutting hair makes it grow back faster.</span></div>
 <div class="mf-col"><span class="mf-tag f">Fact</span><span class="mf-tx">Hair grows from the follicle. The scissors never reach it.</span></div>
</div>
<div class="mf-row">
 <div class="mf-col"><span class="mf-tag m">Myth</span><span class="mf-tx">Wearing a cap or helmet causes baldness.</span></div>
 <div class="mf-col"><span class="mf-tag f">Fact</span><span class="mf-tx">Worn properly, they don't suffocate the scalp. Skipping a helmet is the greater risk.</span></div>
</div>
<p class="instr" style="margin-top:1.2rem">While many popular fears are exaggerated, a few everyday choices genuinely support healthy hair: eating enough, sleeping enough, managing physical stress, being gentle with styling, and not chasing every new trend that appears online.</p>
<div class="stepbox">
 <span class="steplbl">Action Step</span>
 <p class="stepq">Which one everyday habit could you improve this week to care for your hair more gently?</p>
 <textarea class="fa" data-key="ch11-as" placeholder="Keep it small and specific." rows="2"></textarea>
</div>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">Lifestyle should empower you. It should not make you feel guilty.</p>
</div>`,
   closer:'Habits explain some of the story. The stories we tell ourselves about hair fall explain even more — which is where we turn next.'},
  /* ───────── 12. THE LIES HAIR FALL TELLS US ───────── */
  {badge:'Chapter Twelve', sec:'The Stories We Tell', title:'The Lies Hair Fall Tells Us',
   purp:'The goal of this workbook isn\u2019t to replace one myth with another — but to replace uncertainty with understanding.',
   body:`<p class="instr">"Sometimes the biggest problem isn't the hair that falls. It's the story we tell ourselves when it does." One morning, you find hair on your pillow. By lunchtime, you've searched the internet. By evening, you're convinced you're going bald. Within a week, you have ten explanations, twenty remedies, and one growing emotion: fear.</p>
<p class="instr">Hair fall is surrounded by stories because it's deeply personal, and we want simple answers to complicated questions. But biology rarely obliges.</p>
<div class="bq">A pillow can collect hairs. It cannot explain them.<cite>— Chiranjivi Notes</cite></div>
<p class="instr">Life is stressful, and it's tempting to file every shed hair under "stress" and leave it there. The truth sits in an uncomfortable middle — severe physical stress can genuinely influence the hair cycle; the ordinary stress of a hard week usually doesn't work the same way.</p>
<p class="instr">Somewhere, a friend or an influencer is taking biotin. Supplements have a real role — when a genuine deficiency exists. The best supplement is the one your body is actually short of, and the only reliable way to know that is through assessment, not assumption.</p>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect</span>
 <p class="refq">Which myth have I believed the longest? Have I spent more time searching for a miracle cure than trying to understand my own hair?</p>
 <textarea class="fa" data-key="ch12-r1" placeholder="" rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">And then there's the myth this whole workbook keeps circling back to — that if you count carefully enough, the number itself will tell you something. Anxiety likes numbers. A number feels like something you can hold, track, compare, control — even when it isn't actually telling you very much.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">Hair fall doesn't lie. But the stories we build around it sometimes do.</p>
</div>`,
   closer:'Let\u2019s understand the pattern first. That answer requires patience. It\u2019s usually the wiser one anyway.'},

  /* ───────── 13. DO I NEED BLOOD TESTS? ───────── */
  {badge:'Chapter Thirteen', sec:'Investigations', title:'Do I Need Blood Tests?',
   purp:'A blood test is a flashlight, not a crystal ball.',
   body:`<p class="instr">"Doctor, just write every test. I want to know everything." It's an understandable request. But more tests do not necessarily mean better care. The best test isn't the one that finds the most numbers. It's the one that answers the right question.</p>
<p class="instr">A blood test can't tell your doctor your timeline, your pattern, or what your scalp looks like. Those clues come from your story and your examination. Only once those are answered does it become clear which tests, if any, are worth doing.</p>
<table class="ctab">
 <tr><th>Test</th><th>When it's considered</th></tr>
 <tr><td>Iron studies (ferritin)</td><td>Heavy periods, restrictive diet, anaemia symptoms</td></tr>
 <tr><td>Thyroid function</td><td>Weight change, temperature intolerance, fatigue</td></tr>
 <tr><td>Vitamin D, B12, zinc</td><td>Clinical suspicion or nutritional risk</td></tr>
 <tr><td>Complete blood count</td><td>Suspected anaemia or blood-related condition</td></tr>
 <tr><td>Hormonal evaluation</td><td>Irregular periods, acne, excess facial hair alongside thinning</td></tr>
</table>
<p class="instr">Sometimes the diagnosis is already clear — a man with a slowly receding hairline and a strong family history likely has inherited pattern hair loss. In situations like these, extensive testing can add cost without changing anything about the management.</p>
<div class="dnote">
 <div class="dnote-ic"><svg viewBox="0 0 20 20" fill="none"><path d="M6 3v6a4 4 0 008 0V3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="16" cy="11" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M14 13c-1 2-3 3-5 3-3.5 0-6-2.5-6-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
 <div><span class="dnote-lbl">Doctor's Note</span><p class="dnote-tx">Every test I add without a specific reason to suspect something is a chance to find an incidental, unrelated finding — which then has to be chased down, adding cost and anxiety without adding clarity.</p></div>
</div>
<div class="refbox">
 <span class="reflbl">Pause &amp; Reflect</span>
 <p class="refq">Am I hoping a test will replace uncertainty with certainty, or am I seeking evidence?</p>
 <textarea class="fa" data-key="ch13-r1" placeholder="Would the result of this test actually change what I do next?" rows="2"></textarea>
</div>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">It can illuminate part of the path — but it cannot walk the journey for you.</p>
</div>`,
   closer:'Once a diagnosis is clearer, the next question naturally follows: what actually works?'},

  /* ───────── 14. WHAT ACTUALLY WORKS ───────── */
  {badge:'Chapter Fourteen', sec:'Treatment', title:'What Actually Works? And What Only Empties Your Wallet?',
   purp:'The best treatment begins with the right diagnosis.',
   body:`<p class="instr">"Doctor, just tell me the best oil, the best vitamin, the best shampoo, and the best medicine." Hidden inside that question is another one: "Can you promise me my hair will come back?" I wish I could. But medicine is rarely about guarantees.</p>
<p class="instr">Imagine three people in the same waiting room, each saying "my hair is falling." One has inherited pattern hair loss. One is recovering from a viral illness. One has iron deficiency. If all three were handed the same bottle of oil, at least two would be unlikely to benefit.</p>
<div class="isnot">
 <div class="isnot-col"><h4>What Helps</h4>
  <div class="ii"><span class="iy">✓</span><span>Time, for temporary shedding</span></div>
  <div class="ii"><span class="iy">✓</span><span>Correcting the underlying cause</span></div>
  <div class="ii"><span class="iy">✓</span><span>Minoxidil &amp; finasteride, for pattern loss</span></div>
  <div class="ii"><span class="iy">✓</span><span>Specialist therapies, in the right context</span></div>
 </div>
 <div class="isnot-col"><h4>What Doesn't</h4>
  <div class="ii"><span class="in">✕</span><span>Oils &amp; shampoos, on their own</span></div>
  <div class="ii"><span class="in">✕</span><span>Supplements without a deficiency</span></div>
  <div class="ii"><span class="in">✕</span><span>Stopping treatment after a few weeks</span></div>
  <div class="ii"><span class="in">✕</span><span>Starting many products at once</span></div>
 </div>
</div>
<div class="evbadge">
 <summary>Minoxidil's initial shedding phase</summary>
 <div class="ev-body">
  <div class="ev-row"><span class="ev-tag high">High confidence</span><p>A temporary increase in shedding as the hair cycle resets is well recognised and widely reported as part of how minoxidil works.</p></div>
  <div class="ev-row"><span class="ev-tag unc">Still uncertain</span><p>It isn't universal — not everyone experiences it, and its absence doesn't mean the treatment isn't working.</p></div>
  <div class="ev-row"><span class="ev-tag mis">Common misconception</span><p>That increased shedding always means stop the treatment. Check in with a doctor first.</p></div>
 </div>
</div>
<p class="instr">A single photograph can be persuasive. It can also be misleading — lighting, styling, and angle all change the story. Trust well-conducted studies more than isolated testimonials.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">The strongest medicine cannot help if it's the wrong medicine.</p>
</div>`,
   closer:'And finally — the question that brings everything together: when should you actually see a doctor?'},

  /* ───────── 15. WHEN SHOULD I SEE A DOCTOR ───────── */
  {badge:'Chapter Fifteen', sec:'Closing', title:'When Should I See a Doctor?',
   purp:'Fear counts hairs. Medicine looks for patterns. Wisdom knows the difference.',
   body:`<p class="instr">"Doctor, have I waited too long?" It's a question that often comes with regret. Some people delay seeking help because they assume hair loss is "just cosmetic." Others rush to the clinic after seeing a few strands on a pillow. The challenge is finding the middle ground.</p>
<div class="zone g">
 <div class="zone-h"><span class="zone-dot"></span><span class="zone-t">Watching Is Usually Enough</span></div>
 <ul>
  <li>Shedding after a high fever, delivery, or recent surgery</li>
  <li>Mild increases that settle as the body recovers</li>
  <li>A normal-looking scalp, no pain or scaling</li>
 </ul>
</div>
<div class="zone r">
 <div class="zone-h"><span class="zone-dot"></span><span class="zone-t">Worth Seeing a Doctor Promptly</span></div>
 <ul>
  <li>A rapidly widening area of thinning, or smooth bald patches</li>
  <li>Redness, pain, tenderness, or swelling of the scalp</li>
  <li>Loss of eyebrows or eyelashes alongside scalp hair</li>
  <li>Hair loss with severe fatigue, weight change, or menstrual irregularities</li>
  <li>Persistent shedding continuing for many months without improvement</li>
 </ul>
</div>
<p class="instr">If hair pulling linked to compulsive urges felt familiar while reading this workbook, it's worth saying plainly: this is a recognised, treatable condition, and there's no shame in raising it with a doctor.</p>
<div class="refbox">
 <span class="reflbl">Final Reflection</span>
 <p class="refq">Am I reacting to fear, or to evidence? Have I been looking at the pattern, rather than a single event?</p>
 <textarea class="fa" data-key="ch15-r1" placeholder="" rows="2"></textarea>
</div>
<p class="instr" style="margin-top:1.1rem">If there's one message to carry forward, it's this: you are more than your hair. Your confidence, your identity, and your relationships are not measured by the number of strands on your scalp. At the same time, your concerns deserve to be heard.</p>
<div class="pearl">
 <span class="pearl-lbl">◆ Chiranjivi Pearl</span>
 <p class="pearl-tx">Fear counts hairs.<br>Medicine looks for patterns.<br>Wisdom knows the difference.</p>
</div>`,
   closer:'Thank you for reading with care and patience. What follows is a short summary of your own journey through these pages.'},
