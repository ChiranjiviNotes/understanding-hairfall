/* ═══════════════════════════════════════════════
   VISUAL WIDGETS
═══════════════════════════════════════════════ */
 
/* ── FATIGUE WHEEL ── */
const WHEEL_LEVELS = [0,0,0,0];
const WHEEL_COLORS = ['#7a9e8a','#6b7b8d','#c4a799','#bfa07a'];
const WHEEL_LABELS = ['Shedding','Thinning','Patchy','Breakage'];
const WHEEL_SUBS   = ['Falling out','Less dense','Bald spots','Snapped strands'];
 
function initWheelSVG() {
  const svg = document.getElementById('fatigue-wheel');
  if (!svg) return;
  svg.innerHTML = '';
  svg.setAttribute('role','img');
  svg.setAttribute('tabindex','0');
  svg.setAttribute('aria-label', 'My Hair Pattern Wheel. ' + WHEEL_LABELS.map((l,i)=>`${l}: level ${WHEEL_LEVELS[i]} of 3`).join('. ') + '. Click or press a quadrant to cycle its level.');
  const cx=140,cy=140,r=110,inner=28;
  const rings=[r*0.32,r*0.64,r];
  // Draw ring outlines
  rings.forEach(radius=>{
    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',cx);circle.setAttribute('cy',cy);
    circle.setAttribute('r',radius);
    circle.setAttribute('fill','none');
    circle.setAttribute('stroke','rgba(191,160,122,0.18)');
    circle.setAttribute('stroke-width','1');
    svg.appendChild(circle);
  });
  // Draw axes
  for(let i=0;i<4;i++){
    const angle=-Math.PI/2+i*Math.PI/2;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',cx);line.setAttribute('y1',cy);
    line.setAttribute('x2',cx+Math.cos(angle)*r);
    line.setAttribute('y2',cy+Math.sin(angle)*r);
    line.setAttribute('stroke','rgba(191,160,122,0.22)');
    line.setAttribute('stroke-width','1');
    svg.appendChild(line);
  }
  // Draw segments
  for(let i=0;i<4;i++) drawWheelSegment(svg,i,cx,cy,r,inner);
  // Center hub
  const hub=document.createElementNS('http://www.w3.org/2000/svg','circle');
  hub.setAttribute('cx',cx);hub.setAttribute('cy',cy);hub.setAttribute('r',inner);
  hub.setAttribute('fill','var(--paper)');
  hub.setAttribute('stroke','var(--gold)');hub.setAttribute('stroke-width','1');hub.setAttribute('opacity','0.9');
  svg.appendChild(hub);
  const hubTxt=document.createElementNS('http://www.w3.org/2000/svg','text');
  hubTxt.setAttribute('x',cx);hubTxt.setAttribute('y',cy+3);
  hubTxt.setAttribute('text-anchor','middle');
  hubTxt.setAttribute('class','wheel-sublabel');
  hubTxt.setAttribute('style','font-size:0.56rem;letter-spacing:0.18em;text-transform:uppercase;fill:var(--gold-dim)');
  hubTxt.textContent='Now';
  svg.appendChild(hubTxt);
  // Labels
  const labelPos=[
    [cx,cy-r-14],[cx+r+14,cy],[cx,cy+r+22],[cx-r-14,cy]
  ];
  WHEEL_LABELS.forEach((lbl,i)=>{
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',labelPos[i][0]);t.setAttribute('y',labelPos[i][1]);
    t.setAttribute('text-anchor','middle');t.setAttribute('class','wheel-label');
    t.textContent=lbl;svg.appendChild(t);
    const s=document.createElementNS('http://www.w3.org/2000/svg','text');
    s.setAttribute('x',labelPos[i][0]);s.setAttribute('y',labelPos[i][1]+13);
    s.setAttribute('text-anchor','middle');s.setAttribute('class','wheel-sublabel');
    s.textContent=WHEEL_SUBS[i];svg.appendChild(s);
  });
  // Click handler
  const handleWheelInteract=(clientX,clientY)=>{
    const rect=svg.getBoundingClientRect();
    const scaleX=280/(rect.width||280);
    const scaleY=280/(rect.height||280);
    const x=(clientX-rect.left)*scaleX-cx;
    const y=(clientY-rect.top)*scaleY-cy;
    if(Math.sqrt(x*x+y*y)<inner) return;
    let q;
    if(Math.abs(x)>Math.abs(y)) q=x>0?1:3;
    else q=y>0?2:0;
    WHEEL_LEVELS[q]=(WHEEL_LEVELS[q]+1)%4;
    saveWheelData();
    svg.innerHTML='';
    initWheelSVG();
    showToast(`${WHEEL_LABELS[q]}: level ${WHEEL_LEVELS[q]} of 3`,1400);
  };
  svg.addEventListener('click',e=>handleWheelInteract(e.clientX,e.clientY));
  svg.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];handleWheelInteract(t.clientX,t.clientY);});
  svg.addEventListener('keydown',e=>{
    if(['1','2','3','4'].includes(e.key)){
      const q=parseInt(e.key)-1;
      WHEEL_LEVELS[q]=(WHEEL_LEVELS[q]+1)%4;
      saveWheelData();svg.innerHTML='';initWheelSVG();
      showToast(`${WHEEL_LABELS[q]}: level ${WHEEL_LEVELS[q]} of 3`,1400);
    }
  });
}
 
function drawWheelSegment(svg,q,cx,cy,r,inner){
  const level=WHEEL_LEVELS[q];
  if(level===0) return;
  const rings=[r*0.32,r*0.64,r];
  const fillR=rings[level-1];
  const startAngle=-Math.PI/2+q*Math.PI/2;
  const endAngle=startAngle+Math.PI/2;
  const gap=0.05;
  const sa=startAngle+gap,ea=endAngle-gap;
  const x1=cx+inner*Math.cos(sa),y1=cy+inner*Math.sin(sa);
  const x2=cx+fillR*Math.cos(sa),y2=cy+fillR*Math.sin(sa);
  const x3=cx+fillR*Math.cos(ea),y3=cy+fillR*Math.sin(ea);
  const x4=cx+inner*Math.cos(ea),y4=cy+inner*Math.sin(ea);
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  const d=`M${x1},${y1} L${x2},${y2} A${fillR},${fillR} 0 0,1 ${x3},${y3} L${x4},${y4} A${inner},${inner} 0 0,0 ${x1},${y1} Z`;
  path.setAttribute('d',d);
  path.setAttribute('fill',WHEEL_COLORS[q]);
  path.setAttribute('opacity','0.55');
  svg.appendChild(path);
}
 
function saveWheelData(){
  const tag=document.getElementById('save-toast');
  try{
    const raw=localStorage.getItem(SKEY)||'{}';
    const d=JSON.parse(raw);
    d['wheel-levels']=WHEEL_LEVELS.join(',');
    localStorage.setItem(SKEY,JSON.stringify(d));
    if(tag){tag.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>tag.classList.remove('show'),2000);}
  }catch(e){}
}
 
/* ── ENERGY CURVE CANVAS ── */
function initEnergyCurve(){
  const canvas=document.getElementById('energy-canvas');
  if(!canvas) return;
  drawEnergyCurve();
}
 
function drawEnergyCurve(){
  const canvas=document.getElementById('energy-canvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const pad={t:20,r:20,b:30,l:38};
  const gw=W-pad.l-pad.r,gh=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(191,160,122,0.12)';ctx.lineWidth=1;
  for(let i=0;i<=10;i+=2){
    const y=pad.t+gh-(i/10)*gh;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+gw,y);ctx.stroke();
    ctx.fillStyle='rgba(74,68,56,0.45)';ctx.font='10px Georgia';
    ctx.textAlign='right';ctx.fillText(i,pad.l-6,y+4);
  }
  // Midline
  ctx.strokeStyle='rgba(191,160,122,0.2)';ctx.setLineDash([4,4]);ctx.lineWidth=1;
  const midY=pad.t+gh/2;
  ctx.beginPath();ctx.moveTo(pad.l,midY);ctx.lineTo(pad.l+gw,midY);ctx.stroke();
  ctx.setLineDash([]);
  // X labels
  const xlbls=['Wake','Mid-AM','Lunch','Mid-PM','Evening','Night'];
  xlbls.forEach((lbl,i)=>{
    const x=pad.l+(i/(xlbls.length-1))*gw;
    ctx.fillStyle='rgba(74,68,56,0.5)';ctx.font='9px Georgia';
    ctx.textAlign='center';ctx.fillText(lbl,x,H-6);
  });
  // Data points
  const ids=['em0','em1','em2','em3','em4','em5'];
  const pts=ids.map((id,i)=>{
    const el=document.getElementById(id);
    const v=el?parseFloat(el.value):NaN;
    return isNaN(v)?null:{x:pad.l+(i/(ids.length-1))*gw,y:pad.t+gh-(v/10)*gh,v};
  });
  const valid=pts.filter(p=>p!==null);
  if(valid.length<2) return;
  // Filled area
  ctx.beginPath();
  ctx.moveTo(valid[0].x,pad.t+gh);
  valid.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(valid[valid.length-1].x,pad.t+gh);
  ctx.closePath();
  ctx.fillStyle='rgba(122,158,138,0.12)';ctx.fill();
  // Line
  ctx.beginPath();
  ctx.moveTo(valid[0].x,valid[0].y);
  for(let i=1;i<valid.length;i++){
    const cp1x=(valid[i-1].x+valid[i].x)/2,cp1y=valid[i-1].y;
    const cp2x=cp1x,cp2y=valid[i].y;
    ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,valid[i].x,valid[i].y);
  }
  ctx.strokeStyle='#7a9e8a';ctx.lineWidth=2;ctx.stroke();
  // Points
  valid.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle='#7a9e8a';ctx.fill();
    ctx.fillStyle='rgba(74,68,56,0.7)';ctx.font='bold 10px Georgia';
    ctx.textAlign='center';ctx.fillText(p.v,p.x,p.y-8);
  });
}
 
/* ═══════════════════════════════════════════════
   ENERGY BATTERY WIDGET
═══════════════════════════════════════════════ */
const BATTERY_LEVELS = { current: 0, target: 0 };
const BATTERY_SEG_COLORS = ['#b5614a','#b5614a','#bfa07a','#7a9e8a','#7a9e8a'];
 
function buildBatteryWidget() {
  return `<div class="worksheet" id="ws-battery">
<span class="ws-title">\u25c6 My Confidence Battery</span>
<div class="battery-row">
  <div class="battery-wrap">
    <svg class="battery-svg" id="battery-current" width="70" height="150" viewBox="0 0 70 150"></svg>
    <span class="battery-lbl">Where I Am</span>
    <input type="text" class="battery-input" data-key="batt-now-label" placeholder="One word for this level\u2026">
  </div>
  <div class="battery-wrap">
    <svg class="battery-svg" id="battery-target" width="70" height="150" viewBox="0 0 70 150"></svg>
    <span class="battery-lbl">Where I\u2019d Like To Be</span>
    <input type="text" class="battery-input" data-key="batt-target-label" placeholder="One word for this level\u2026">
  </div>
</div>
<p class="ws-caption">Tap a segment to set the level. Tap the same level again to lower it.</p>
</div>`;
}
 
function drawBattery(svgId, key) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  svg.innerHTML = '';
  const level = BATTERY_LEVELS[key];
  const ns = 'http://www.w3.org/2000/svg';
  // Terminal nub
  const nub = document.createElementNS(ns,'rect');
  nub.setAttribute('x','27');nub.setAttribute('y','3');nub.setAttribute('width','16');nub.setAttribute('height','9');
  nub.setAttribute('rx','2');nub.setAttribute('fill','none');
  nub.setAttribute('stroke','var(--gold-dim)');nub.setAttribute('stroke-width','1.3');nub.setAttribute('opacity','0.6');
  svg.appendChild(nub);
  // Body outline
  const body = document.createElementNS(ns,'rect');
  body.setAttribute('x','10');body.setAttribute('y','12');body.setAttribute('width','50');body.setAttribute('height','134');
  body.setAttribute('rx','6');body.setAttribute('fill','none');
  body.setAttribute('stroke','var(--ink-light)');body.setAttribute('stroke-width','1.4');body.setAttribute('opacity','0.55');
  svg.appendChild(body);
  // 5 segments, bottom to top
  const pad=6, gap=3, totalH=134-pad*2, segH=(totalH-gap*4)/5;
  for(let i=0;i<5;i++){
    const y = 12+134-pad-(i+1)*segH-i*gap;
    const seg = document.createElementNS(ns,'rect');
    seg.setAttribute('x','15');seg.setAttribute('y',y.toFixed(1));
    seg.setAttribute('width','40');seg.setAttribute('height',segH.toFixed(1));
    seg.setAttribute('rx','2');seg.setAttribute('class','batt-seg');
    const filled = i < level;
    seg.setAttribute('fill', filled ? BATTERY_SEG_COLORS[i] : 'transparent');
    seg.setAttribute('opacity', filled ? '0.7' : '0');
    seg.setAttribute('stroke', filled ? 'none' : 'rgba(191,160,122,0.16)');
    seg.setAttribute('stroke-width','1');
    if(!filled) seg.setAttribute('fill','rgba(191,160,122,0.04)');
    svg.appendChild(seg);
  }
  // Percentage label
  const pct = document.createElementNS(ns,'text');
  pct.setAttribute('x','35');pct.setAttribute('y','148');
  pct.setAttribute('text-anchor','middle');
  pct.setAttribute('style','font-family:var(--serif);font-size:9px;letter-spacing:0.08em;fill:var(--ink-faint)');
  pct.textContent = (level*20)+'%';
  svg.appendChild(pct);
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label', (key==='current'?'Current confidence level: ':'Desired confidence level: ')+(level*20)+'%, '+level+' of 5');
}
 
function initBatteries() {
  drawBattery('battery-current','current');
  drawBattery('battery-target','target');
  ['battery-current','battery-target'].forEach(id=>{
    const svg = document.getElementById(id);
    if(!svg) return;
    const key = id==='battery-current' ? 'current' : 'target';
    const handle = (clientY) => {
      const rect = svg.getBoundingClientRect();
      const scaleY = 150/(rect.height||150);
      const y = (clientY-rect.top)*scaleY;
      const pad=6, gap=3, totalH=134-pad*2, segH=(totalH-gap*4)/5;
      let seg = 0;
      for(let i=0;i<5;i++){
        const segTop = 12+134-pad-(i+1)*segH-i*gap;
        const segBottom = segTop+segH;
        if(y>=segTop-gap/2 && y<=segBottom+gap/2) seg=i+1;
      }
      if(seg===0 && y>12+134-pad) seg=0;
      if(seg===0 && y<12+pad) seg=5;
      const newLevel = (BATTERY_LEVELS[key]===seg) ? seg-1 : seg;
      BATTERY_LEVELS[key] = Math.max(0,Math.min(5,newLevel));
      drawBattery(id,key);
      saveBatteryData();
    };
    svg.addEventListener('click', e=>handle(e.clientY));
    svg.addEventListener('touchend', e=>{e.preventDefault();handle(e.changedTouches[0].clientY);});
  });
}
 
function saveBatteryData(){
  try{
    const raw=localStorage.getItem(SKEY)||'{}';
    const d=JSON.parse(raw);
    d['battery-levels']=BATTERY_LEVELS.current+','+BATTERY_LEVELS.target;
    localStorage.setItem(SKEY,JSON.stringify(d));
    const tag=document.getElementById('save-toast');
    if(tag){tag.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>tag.classList.remove('show'),2000);}
  }catch(e){}
}
 
/* ═══════════════════════════════════════════════
   SMART SUMMARY
═══════════════════════════════════════════════ */
function genSummary(){
  const ss=WB.smartSummary;
  const el=document.getElementById('ss-txt');
  if(!el) return;
  const scores={};
  document.querySelectorAll('[data-contrib]').forEach(inp=>{
    const v=parseFloat(inp.value);
    if(!isNaN(v)&&v>0){
      const k=inp.dataset.contrib;
      scores[k]=Math.max(scores[k]||0,v);
    }
  });
  if(!Object.keys(scores).length){el.textContent=ss.noData;return;}
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const top=sorted.filter(([,v])=>v>=6);
  if(!top.length) top.push(...sorted.slice(0,Math.min(3,sorted.length)));
  const parts=top.map(([k])=>ss.templates[k]).filter(Boolean);
  if(!parts.length){el.textContent=ss.noData;return;}
  let txt=ss.intro;
  if(parts.length===1) txt+=parts[0];
  else txt+=parts.slice(0,-1).join(ss.connector)+ss.connector_last+parts[parts.length-1];
  txt+=ss.suffix;
  el.textContent=txt;
  document.getElementById('smart-sum').classList.add('show');
  // Recommendation
  const topKey=top[0][0];
  const rec=WB.recommendations[topKey];
  if(rec){
    const rt=document.getElementById('rec-t'),rd=document.getElementById('rec-d');
    if(rt) rt.textContent=rec.t;
    if(rd) rd.textContent=rec.d;
    document.getElementById('recom').classList.add('show');
  }
}
 
/* ═══════════════════════════════════════════════
   PAGE COMPLETION INDICATORS
═══════════════════════════════════════════════ */
function updatePageCompletion(){
  document.querySelectorAll('.page-card').forEach(card=>{
    let touched=false;
    card.querySelectorAll('[data-key]').forEach(el=>{
      if(touched) return;
      if(el.type==='checkbox'||el.type==='radio'){ if(el.checked) touched=true; }
      else if(el.value && el.value.trim().length>0) touched=true;
    });
    card.classList.toggle('card-touched', touched);
  });
}
 
/* ═══════════════════════════════════════════════
   AUTOSAVE
═══════════════════════════════════════════════ */
function saveAll(){
  const data={};
  document.querySelectorAll('[data-key]').forEach(el=>{
    if(el.type==='checkbox') data[el.dataset.key]=el.checked;
    else if(el.type==='radio'){if(el.checked) data[el.dataset.key]=el.value;}
    else data[el.dataset.key]=el.value;
  });
  data['wheel-levels']=WHEEL_LEVELS.join(',');
  data['battery-levels']=BATTERY_LEVELS.current+','+BATTERY_LEVELS.target;
  try{
    localStorage.setItem(SKEY,JSON.stringify(data));
    const tag=document.getElementById('save-toast');
    if(tag){tag.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>tag.classList.remove('show'),2000);}
  }catch(e){}
  genSummary();
  drawEnergyCurve();
  updatePageCompletion();
}
 
function loadAll(){
  try{
    const raw=localStorage.getItem(SKEY);
    if(!raw) return;
    const data=JSON.parse(raw);
    // Restore wheel
    if(data['wheel-levels']){
      const lvls=data['wheel-levels'].split(',').map(Number);
      lvls.forEach((v,i)=>{if(i<4) WHEEL_LEVELS[i]=v;});
      const svg=document.getElementById('fatigue-wheel');
      if(svg){svg.innerHTML='';initWheelSVG();}
    }
    // Restore battery
    if(data['battery-levels']){
      const bl=data['battery-levels'].split(',').map(Number);
      if(bl.length===2){BATTERY_LEVELS.current=bl[0]||0;BATTERY_LEVELS.target=bl[1]||0;}
    }
    Object.entries(data).forEach(([k,v])=>{
      if(k==='wheel-levels'||k==='battery-levels') return;
      document.querySelectorAll(`[data-key="${k}"]`).forEach(el=>{
        if(el.type==='checkbox') el.checked=v;
        else if(el.type==='radio'){if(el.value===String(v)) el.checked=true;}
        else el.value=v;
      });
    });
    drawEnergyCurve();
  }catch(e){}
  updatePageCompletion();
}
 
let firstInputDone=false;
document.addEventListener('input',()=>{
  if(!firstInputDone){
    firstInputDone=true;
    setTimeout(()=>showToast('Your responses are being saved automatically',3500),400);
  }
  saveAll();
});
document.addEventListener('change',saveAll);
 
/* ═══════════════════════════════════════════════
   OBSERVERS — fade-in + progress
═══════════════════════════════════════════════ */
function observePages(){
  const all=document.querySelectorAll('.page-card,.pull-page,.chapter-opener,.ecosystem-page,.closing-page,.section-divider');
  const nav=document.getElementById('sticky-nav');
  const fadeObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');fadeObs.unobserve(e.target);}});
  },{threshold:0.04});
  const progObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const n=parseInt(e.target.dataset.pgn)||0;
        updDots(n);
        if(nav) nav.classList.add('show');
        const sec=e.target.dataset.section||e.target.querySelector('.card-section,.co-label')?.textContent||'';
        const nsec=document.getElementById('nav-section');
        if(nsec) nsec.textContent=sec;
      }
    });
  },{threshold:0.2,rootMargin:'-5% 0px -45% 0px'});
  all.forEach(p=>{fadeObs.observe(p);progObs.observe(p);});
  const covObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>0.35&&nav) nav.classList.remove('show');});
  },{threshold:0.35});
  const cov=document.getElementById('wb-cover');
  if(cov) covObs.observe(cov);
}
 
function updDots(n){
  document.querySelectorAll('.pdot').forEach(d=>{
    const dn=parseInt(d.dataset.n);
    d.className='pdot'+(dn<n?' done':dn===n?' active':'');
  });
}
 
/* ═══════════════════════════════════════════════
   SCROLL PROGRESS + BTT
═══════════════════════════════════════════════ */
window.addEventListener('scroll',()=>{
  const st=document.documentElement.scrollTop;
  const sh=document.documentElement.scrollHeight-document.documentElement.clientHeight;
  const bar=document.getElementById('scroll-prog');
  if(bar) bar.style.width=(sh>0?(st/sh)*100:0)+'%';
  const btt=document.getElementById('btt');
  if(btt){if(st>300) btt.classList.add('show');else btt.classList.remove('show');}
});
 
/* ═══════════════════════════════════════════════
   FONT SIZE
═══════════════════════════════════════════════ */
function adjustFS(dir){
  baseFontSize=Math.min(20,Math.max(14,baseFontSize+dir));
  document.documentElement.style.fontSize=baseFontSize+'px';
  showToast(baseFontSize>=20?'Maximum text size':baseFontSize<=14?'Minimum text size':'Text size adjusted');
}
 
/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
function showToast(msg,dur){
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),dur||2200);
}
 
/* ═══════════════════════════════════════════════
   COPY SUMMARY
═══════════════════════════════════════════════ */
function copySummary(){
  var ss=document.getElementById('ss-txt');
  var t1=document.querySelector('[data-key="top1"]');
  var t2=document.querySelector('[data-key="top2"]');
  var t3=document.querySelector('[data-key="top3"]');
  var step=document.querySelector('[data-key="ns-will"]');
  var NL='\n';
  var txt='*My Hair Fall Summary*'+NL+NL;
  if(ss&&ss.textContent) txt+=ss.textContent+NL+NL;
  if((t1&&t1.value)||(t2&&t2.value)||(t3&&t3.value)){
    txt+='*Top contributors:*'+NL;
    if(t1&&t1.value) txt+='1. '+t1.value+NL;
    if(t2&&t2.value) txt+='2. '+t2.value+NL;
    if(t3&&t3.value) txt+='3. '+t3.value+NL;
    txt+=NL;
  }
  if(step&&step.value) txt+='*My next step:* '+step.value+NL+NL;
  txt+='_Chiranjivi Notes\u00ae \u2014 Understanding Hair Fall_';
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>showToast('Summary copied \u2014 paste into WhatsApp or share with your doctor',3000)).catch(()=>fallbackCopy(txt));
  }else{fallbackCopy(txt);}
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();document.execCommand('copy');
  document.body.removeChild(ta);showToast('Summary copied!');
}
 
/* ═══════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════ */
function confirmReset(){
  if(confirm('This will clear all your responses. Are you sure?')){
    try{localStorage.removeItem(SKEY);}catch(e){}
    firstInputDone=false;
    showToast('Responses cleared. Refreshing\u2026',1800);
    setTimeout(()=>renderWorkbook(),1800);
  }
}
