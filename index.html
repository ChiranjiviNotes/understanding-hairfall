<div class="callout" style="margin-top:1rem"><span class="callout-lbl">Photographs Outperform Memory</span><p class="callout-text">Doctors diagnose hair loss by stories and patterns &mdash; not by arithmetic. Comparing standardised photographs taken months apart is consistently more revealing than counting hairs day to day. If you have old photographs, look at them before you answer this page.</p></div>
<div class="ref-box"><span class="ref-lbl">Reflection</span>
<p class="ref-q">What does your timeline tell you about your own pattern?</p>
<textarea class="f-area" data-key="hd-ref" placeholder="What pattern do you see?"></textarea></div>`,
   closer:'Your pattern is information. The shape of your hair story over time is a kind of self-portrait.'},
    {id:'p-c1',badge:'Case 01 of 31',section:'Sudden Shedding',accent:'sage-accent',title:'&ldquo;I thought I was going bald overnight.&rdquo;',
   purp:'Meet Priya, 27. Three months after recovering from dengue fever, she stepped into the shower and froze.',
   body:`<p class="body-text">The drain was covered with hair. The next morning, more hair appeared on her pillow. Her comb looked frightening. By the end of the week, she was convinced she would soon be bald. She searched the internet for hours, ordered expensive oils, and considered shaving her head to &ldquo;start fresh.&rdquo;</p>
<p class="body-text">When she finally visited her doctor, the doctor did not count the hairs she had collected in a plastic bag. Instead, she asked one question: <em>&ldquo;What happened about three months before this started?&rdquo;</em> That question changed everything.</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="c1-clue1"><span class="chk-lbl">High fever and dengue infection 3 months earlier</span></label>
<label class="chk"><input type="checkbox" data-key="c1-clue2"><span class="chk-lbl">Hair falling diffusely from all over the scalp</span></label>
<label class="chk"><input type="checkbox" data-key="c1-clue3"><span class="chk-lbl">No bald patches, healthy-looking scalp</span></label>
</div>
<div class="callout sage"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Telogen Effluvium</strong> &mdash; temporary stress-related shedding. The trigger often occurs 2&ndash;4 months before the shedding begins. The follicles are resting, not dead.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Sometimes the scariest hair fall has the best chance of recovery.</p><div class="confidence-meter" data-case="c1"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c1" data-key="conf-c1" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c1" data-key="conf-c1" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c1" data-key="conf-c1" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c1" data-key="conf-c1" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c5',badge:'Case 05 of 31',section:'Sudden Shedding',accent:'sage-accent',title:'The Weight-Loss Victory That Became a Hair Problem',
   purp:'Meet Vikram, 29. He proudly lost 18 kilograms in four months. Then his hair started falling.',
   body:`<p class="body-text">Friends applauded. His weighing scale celebrated. Soon every pillowcase, towel, and shower drain reminded him of a new problem. He wondered if the diet had &ldquo;damaged the roots forever.&rdquo;</p>
<p class="body-text">When resources become scarce, the body prioritises survival. Hair growth &mdash; a biologically expensive, non-essential process &mdash; is temporarily placed on hold. The follicles are not damaged; they are conserving energy.</p>
<div class="callout sage"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Diet-Related Telogen Effluvium.</strong> Hair is a luxury tissue. During nutritional stress, the body protects the heart before it protects the hairstyle.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Your body can survive a crash diet &mdash; but your hair may protest later.</p>
<div class="ref-box sage"><span class="ref-lbl sage">Reflection</span>
<p class="ref-q">Have you recently lost weight rapidly, followed an extreme diet, or eliminated major food groups?</p>
<textarea class="f-area" data-key="c5-ref"></textarea></div><div class="confidence-meter" data-case="c5"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c5" data-key="conf-c5" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c5" data-key="conf-c5" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c5" data-key="conf-c5" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c5" data-key="conf-c5" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c7',badge:'Case 07 of 31',section:'Sudden Shedding',accent:'sage-accent',title:'Four Months After Baby',
   purp:'Meet Sneha, 31. She loved becoming a mother. She didn&rsquo;t expect motherhood to fill her shower drain with hair.',
   body:`<p class="body-text">At four months postpartum, she became convinced she was developing permanent baldness. Fortunately, her doctor recognised the familiar timeline immediately.</p>
<p class="body-text">During pregnancy, elevated hormones keep many hairs in the growth phase longer than usual. After delivery, hormone levels normalise and those hairs shed together &mdash; making the volume feel alarming. This is biology working correctly, not a sign of disease.</p>
<div class="callout sage"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Postpartum Telogen Effluvium.</strong> Common, temporary, and usually self-limited within 6&ndash;12 months.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Postpartum shedding often reflects biology &mdash; not failure or disease.</p><div class="confidence-meter" data-case="c7"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c7" data-key="conf-c7" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c7" data-key="conf-c7" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c7" data-key="conf-c7" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c7" data-key="conf-c7" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c19',badge:'Case 19 of 31',section:'Lifestyle &amp; Nutritional Causes',accent:'',title:'&ldquo;My Hair Started Falling After COVID&rdquo;',
   purp:'Meet Sameer, 41. Three months after recovering from COVID-19, diffuse shedding began.',
   body:`<p class="body-text">He worried that the virus had permanently damaged his scalp. The clues told a different story: a major illness three months earlier, the classic three-month gap, diffuse loss throughout the scalp with no patches, and a healthy scalp on examination.</p>
<p class="body-text">Many infections &mdash; including COVID-19 &mdash; can temporarily synchronise the hair cycle and trigger diffuse shedding. This is a body response, not permanent damage. Post-COVID telogen effluvium became one of the most commonly reported hair conditions during and after the pandemic.</p>
<div class="callout sage"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Post-Illness Telogen Effluvium.</strong> Recovery is typically spontaneous once overall health is restored.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Recovery from illness sometimes includes temporary shedding before recovery of hair.</p><div class="confidence-meter" data-case="c19"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c19" data-key="conf-c19" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c19" data-key="conf-c19" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c19" data-key="conf-c19" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c19" data-key="conf-c19" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c21',badge:'Case 21 of 31',section:'Lifestyle &amp; Nutritional Causes',accent:'',title:'&ldquo;My Crash Diet Cost Me More Than Weight&rdquo;',
   purp:'Meet Nisha, 30. Determined to lose weight before her wedding, she followed an 800-calorie diet and lost 12 kg in three months.',
   body:`<p class="body-text">About three months later, she noticed hair everywhere &mdash; on her pillow, in the shower, on her clothes. The pattern was identical to Vikram&rsquo;s story earlier in this workbook: severe restriction, rapid loss, diffuse shedding beginning weeks later, normal scalp.</p>
<div class="callout sage"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Telogen Effluvium triggered by nutritional stress.</strong> Hair follicles respond to sudden metabolic stress long after the triggering event.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Your body can survive a crash diet &mdash; but your hair may protest later.</p><div class="confidence-meter" data-case="c21"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c21" data-key="conf-c21" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c21" data-key="conf-c21" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c21" data-key="conf-c21" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c21" data-key="conf-c21" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c23',badge:'Case 23 of 31',section:'Lifestyle &amp; Nutritional Causes',accent:'',title:'&ldquo;The Baby Was Fine. My Hair Was Falling.&rdquo;',
   purp:'Meet Meera, 31. Three months after delivering a healthy baby, she became alarmed by heavy shedding.',
   body:`<p class="body-text">Friends blamed breastfeeding. Internet forums blamed vitamin deficiency. Her doctor recognised the familiar timeline: recent childbirth, diffuse shedding beginning 3&ndash;4 months later, healthy scalp, no bald patches.</p>
<p class="body-text">Many hairs stay in growth phase during pregnancy and shed together afterward.</p>
<div class="callout sage"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Postpartum Telogen Effluvium.</strong></p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Postpartum shedding often reflects biology &mdash; not failure or disease.</p><div class="confidence-meter" data-case="c23"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c23" data-key="conf-c23" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c23" data-key="conf-c23" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c23" data-key="conf-c23" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c23" data-key="conf-c23" value="4"><span>Very confident</span></label></div></div>`,
   closer:'Five different triggers. One identical mechanism. The body, asked to weather a storm, quietly reschedules its hair growth &mdash; and tells you about it three months later.'},
  {id:'p-c6',badge:'Case 06 of 31',section:'Sudden Shedding',accent:'sage-accent',title:'&ldquo;Maybe It&rsquo;s Just Exam Stress&rdquo;',
   purp:'Meet Nisha, 22. She blamed everything on exams &mdash; late nights, stress, coffee, hair fall. But one conversation changed the diagnosis entirely.',
   body:`<p class="body-text">When asked about her general health, she quietly admitted: <em>&ldquo;I&rsquo;ve been feeling exhausted&hellip; and my periods have been unusually heavy.&rdquo;</em> That single clue mattered far more than stress alone.</p>
<div class="ref-box"><span class="ref-lbl">Pause &amp; Think</span>
<p class="ref-q">What would you do next &mdash; recommend a new shampoo, attribute everything to exam stress, or consider iron deficiency as a contributing factor?</p>
<div class="confidence-meter" data-case="c6"><span class="cm-lbl">How confident were you before reading the answer?</span>
<div class="cm-opts">
<label class="cm-opt"><input type="radio" name="conf-c6" data-key="conf-c6" value="1"><span>Not confident</span></label>
<label class="cm-opt"><input type="radio" name="conf-c6" data-key="conf-c6" value="2"><span>Somewhat</span></label>
<label class="cm-opt"><input type="radio" name="conf-c6" data-key="conf-c6" value="3"><span>Fairly</span></label>
<label class="cm-opt"><input type="radio" name="conf-c6" data-key="conf-c6" value="4"><span>Very confident</span></label>
</div></div></div>
<div class="callout sage"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Iron Deficiency Contributing to Diffuse Hair Shedding.</strong> Hair often provides the first visible clue to an underlying medical problem. Always consider what the rest of the body might be saying.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Treat the person &mdash; not just the hair.</p>`,
   closer:null},

  {id:'p-c11',badge:'Case 11 of 31',section:'Pattern Hair Loss',accent:'slate-accent',title:'&ldquo;My Hair Is Falling Because I Wear a Helmet&rdquo;',
   purp:'Meet Karan, 28. He rode his motorcycle nearly every day and became convinced the helmet trapped heat, suffocated his scalp, and caused his receding hairline.',
   body:`<p class="body-text">His solution? He bought a more expensive helmet. The hairline continued to recede.</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="c11-clue1"><span class="chk-lbl">Slow recession at the temples over several years</span></label>
<label class="chk"><input type="checkbox" data-key="c11-clue2"><span class="chk-lbl">Positive family history &mdash; father also bald</span></label>
<label class="chk"><input type="checkbox" data-key="c11-clue3"><span class="chk-lbl">Daily helmet use (coincidence, not cause)</span></label>
</div>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Pattern Hair Loss (Androgenetic Alopecia).</strong></p></div>
<div class="callout" style="border-color:rgba(201,169,106,.3)"><span class="callout-lbl">Myth vs Reality</span><p class="callout-text"><strong>Myth:</strong> Helmets suffocate scalp follicles and cause hair loss. <strong>Reality:</strong> Helmets may flatten hair temporarily but cannot cause genetic baldness. Coincidence is not causation.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Helmets protect your brain &mdash; they do not harm your hair.</p>
<div class="confidence-meter" data-case="c11"><span class="cm-lbl">How confident were you before reading the answer?</span>
<div class="cm-opts">
<label class="cm-opt"><input type="radio" name="conf-c11" data-key="conf-c11" value="1"><span>Not confident</span></label>
<label class="cm-opt"><input type="radio" name="conf-c11" data-key="conf-c11" value="2"><span>Somewhat</span></label>
<label class="cm-opt"><input type="radio" name="conf-c11" data-key="conf-c11" value="3"><span>Fairly</span></label>
<label class="cm-opt"><input type="radio" name="conf-c11" data-key="conf-c11" value="4"><span>Very confident</span></label>
</div></div>`,
   closer:null},

  {id:'p-c14',badge:'Case 14 of 31',section:'Patchy Hair Loss &amp; Scalp Disorders',accent:'rose-accent',title:'&ldquo;Everything Was Normal&hellip; Except My Thyroid&rdquo;',
   purp:'Meet Sanya, 39. She complained of hair fall, fatigue, weight gain, feeling unusually cold, and dry skin. She assumed ageing was to blame.',
   body:`<p class="body-text">One blood test revealed the real explanation.</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="c14-clue1"><span class="chk-lbl">Multiple body symptoms &mdash; not just hair</span></label>
<label class="chk"><input type="checkbox" data-key="c14-clue2"><span class="chk-lbl">Diffuse shedding, slowed metabolism</span></label>
<label class="chk"><input type="checkbox" data-key="c14-clue3"><span class="chk-lbl">Fatigue, weight gain, cold intolerance, dry skin</span></label>
</div>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Hair Shedding Associated with Hypothyroidism.</strong> Hair can reflect systemic illness. When multiple body systems are involved, hair loss may be a clue &mdash; not the primary disease. Always consider the whole patient.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: When hair changes, ask what the rest of the body is saying.</p><div class="confidence-meter" data-case="c14"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c14" data-key="conf-c14" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c14" data-key="conf-c14" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c14" data-key="conf-c14" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c14" data-key="conf-c14" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c16',badge:'Case 16 of 31',section:'Patchy Hair Loss &amp; Scalp Disorders',accent:'rose-accent',title:'&ldquo;I Started Treatment Yesterday. Why Isn&rsquo;t It Working?&rdquo;',
   purp:'Meet Dev, 30. He applied topical treatment faithfully. Three weeks later he returned disappointed: &ldquo;Nothing has changed.&rdquo;',
   body:`<p class="body-text">His doctor smiled. Hair follicles weren&rsquo;t ignoring him. They were simply following biology.</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="c16-clue1"><span class="chk-lbl">Excellent adherence to prescribed treatment</span></label>
<label class="chk"><input type="checkbox" data-key="c16-clue2"><span class="chk-lbl">Only three weeks elapsed</span></label>
<label class="chk"><input type="checkbox" data-key="c16-clue3"><span class="chk-lbl">Unrealistic expectations about speed</span></label>
</div>
<div class="callout rose"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Premature treatment abandonment risk</strong> &mdash; not a new diagnosis, but a critical juncture. The underlying condition was responding correctly; only time had not yet passed.</p></div>
<div class="callout"><span class="callout-lbl">Clinical Lesson on Timing</span><p class="callout-text">Meaningful hair improvement often takes several months of consistent treatment. Hair growth cycles are slow &mdash; there are no shortcuts.</p></div>
<div class="ref-box"><span class="ref-lbl">Reflection</span>
<p class="ref-q">How quickly do you personally expect visible change &mdash; days, weeks, or months?</p>
<textarea class="f-area" data-key="c16-ref"></textarea></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Consistency beats impatience.</p><div class="confidence-meter" data-case="c16"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c16" data-key="conf-c16" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c16" data-key="conf-c16" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c16" data-key="conf-c16" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c16" data-key="conf-c16" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c22',badge:'Case 22 of 31',section:'Lifestyle &amp; Nutritional Causes',accent:'',title:'&ldquo;It Wasn&rsquo;t Hair Loss. It Was Hair Breakage.&rdquo;',
   purp:'Meet Priya, 24. She coloured, straightened, and heat-styled her hair almost every week. She complained that her hair &ldquo;kept falling.&rdquo;',
   body:`<p class="body-text">On examination, the roots were intact &mdash; but many strands were snapped midway.</p>
<div class="ref-box"><span class="ref-lbl">Pause &amp; Think</span>
<p class="ref-q">Was this follicular hair loss from the root, or hair shaft damage &mdash; breakage midway?</p></div>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Hair Shaft Breakage Due to Cosmetic Damage.</strong> Broken hair and shed hair are not the same problem. Breakage starts at the shaft; hair loss starts at the follicle. The treatment is completely different.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Sometimes the strand breaks before the follicle ever lets go.</p>
<div class="confidence-meter" data-case="c22"><span class="cm-lbl">How confident were you before reading the answer?</span>
<div class="cm-opts">
<label class="cm-opt"><input type="radio" name="conf-c22" data-key="conf-c22" value="1"><span>Not confident</span></label>
<label class="cm-opt"><input type="radio" name="conf-c22" data-key="conf-c22" value="2"><span>Somewhat</span></label>
<label class="cm-opt"><input type="radio" name="conf-c22" data-key="conf-c22" value="3"><span>Fairly</span></label>
<label class="cm-opt"><input type="radio" name="conf-c22" data-key="conf-c22" value="4"><span>Very confident</span></label>
</div></div>`,
   closer:null},

  {id:'p-c28',badge:'Case 28 of 31',section:'Habits, Expectations &amp; Common Mistakes',accent:'',title:'&ldquo;The Problem Was in the Hairstyle&rdquo;',
   purp:'Meet Fatima, 29. For years she wore tightly pulled buns for work. Gradually, thinning appeared around the temples.',
   body:`<p class="body-text">The rest of her scalp looked entirely healthy.</p>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Traction Alopecia.</strong> Removing the tension early may allow recovery. Ignoring it for years can make loss permanent. Prevention is far easier than reversal.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Beauty should never come at the cost of your follicles.</p><div class="confidence-meter" data-case="c28"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c28" data-key="conf-c28" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c28" data-key="conf-c28" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c28" data-key="conf-c28" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c28" data-key="conf-c28" value="4"><span>Very confident</span></label></div></div>`,
   closer:'Six more stories, six more reminders: the body keeps a calendar, the scalp keeps a record, and habits leave fingerprints too.'},
  {id:'p-c2',badge:'Case 02 of 31',section:'Sudden Shedding',accent:'sage-accent',title:'&ldquo;My Shampoo Is Destroying My Hair&rdquo;',
   purp:'Meet Rohan, 32. Every morning he stared at the sink after washing his hair, certain the shampoo was to blame.',
   body:`<p class="body-text">Then hard water. Then his helmet. Then office stress. Over the next year he changed products six different times. Nothing improved. At his consultation, the doctor barely looked at the shampoo bottle Rohan proudly carried. Instead, she looked at his temples.</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="c2-clue1"><span class="chk-lbl">Gradual change developing over several years</span></label>
<label class="chk"><input type="checkbox" data-key="c2-clue2"><span class="chk-lbl">Receding temples &mdash; bilateral and symmetric</span></label>
<label class="chk"><input type="checkbox" data-key="c2-clue3"><span class="chk-lbl">Father with a similar hair pattern</span></label>
</div>
<p class="body-text">This wasn&rsquo;t excessive shedding. The follicles were slowly producing thinner and thinner hairs over time &mdash; miniaturisation. Changing shampoo could never reverse that biology.</p>
<div class="callout slate"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Androgenetic Alopecia (Pattern Hair Loss).</strong> Driven by genetics and hormone sensitivity at the follicle level &mdash; not by what touches the scalp surface.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: The pattern often matters more than the number of hairs you shed.</p><div class="confidence-meter" data-case="c2"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c2" data-key="conf-c2" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c2" data-key="conf-c2" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c2" data-key="conf-c2" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c2" data-key="conf-c2" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c10',badge:'Case 10 of 31',section:'Pattern Hair Loss',accent:'slate-accent',title:'The Spreadsheet Patient',
   purp:'Meet Siddharth, 30. He tracked every hair he lost &mdash; every wash, every pillow, every comb. Six months of graphs.',
   body:`<p class="body-text">Yet when the doctor compared photographs taken two years apart, the answer became obvious in seconds: his temples had slowly receded. The pattern solved the mystery. The spreadsheet hadn&rsquo;t.</p>
<div class="callout slate"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Pattern Hair Loss</strong> &mdash; identified via photographs, not daily counting.</p></div>
<div class="callout slate"><span class="callout-lbl">Clinical Pearl</span><p class="callout-text">Doctors diagnose hair loss by stories and patterns &mdash; not by arithmetic. Standardised photographs taken every 3&ndash;6 months consistently outperform daily counting. Obsessing over daily numbers creates anxiety without providing clinical insight.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Doctors diagnose hair loss by stories and patterns &mdash; not by arithmetic.</p><div class="confidence-meter" data-case="c10"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c10" data-key="conf-c10" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c10" data-key="conf-c10" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c10" data-key="conf-c10" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c10" data-key="conf-c10" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c12',badge:'Case 12 of 31',section:'Pattern Hair Loss',accent:'slate-accent',title:'&ldquo;The Hairdresser Found It Before I Did&rdquo;',
   purp:'Meet Leena, 42. She visited the salon every month. One afternoon her hairdresser quietly asked a question that changed everything.',
   body:`<p class="body-text"><em>&ldquo;Have you noticed that your central part is becoming wider?&rdquo;</em> Leena hadn&rsquo;t. When she compared old photographs taken five years apart, the difference was unmistakable.</p>
<p class="body-text">Many women notice thinning long before they notice increased shedding. A widening central part is often the earliest visible sign, because density can decline quietly while daily shedding stays unremarkable.</p>
<div class="callout slate"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Female Pattern Hair Loss.</strong></p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Sometimes widening is more important than falling.</p><div class="confidence-meter" data-case="c12"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c12" data-key="conf-c12" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c12" data-key="conf-c12" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c12" data-key="conf-c12" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c12" data-key="conf-c12" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c18',badge:'Case 18 of 31',section:'Patchy Hair Loss &amp; Scalp Disorders',accent:'rose-accent',title:'&ldquo;I Thought My Ponytail Was Shrinking&rdquo;',
   purp:'Meet Divya, 33. She wasn&rsquo;t seeing large amounts of hair in the shower. Instead, tying her ponytail required an extra twist.',
   body:`<p class="body-text">Photographs showed a wider part and lower overall volume &mdash; two years of quiet, invisible change. Hair density may decline quietly even without dramatic shedding.</p>
<div class="callout slate"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Female Pattern Hair Loss</strong> &mdash; density declining quietly, no dramatic shedding.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Volume often disappears before panic begins.</p><div class="confidence-meter" data-case="c18"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c18" data-key="conf-c18" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c18" data-key="conf-c18" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c18" data-key="conf-c18" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c18" data-key="conf-c18" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c25',badge:'Case 25 of 31',section:'Habits, Expectations &amp; Common Mistakes',accent:'',title:'&ldquo;My Father Was Bald. Am I Doomed?&rdquo;',
   purp:'Meet Arjun, 22. His father and grandfather both had significant pattern baldness. He noticed only mild temple recession and feared the worst.',
   body:`<p class="body-text">His doctor explained that genetics increase risk but do not perfectly predict timing or severity. Family history is a risk factor &mdash; not a verdict. Early evaluation opens management options that become less available with time.</p>
<div class="callout slate"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Early Pattern Hair Loss</strong> &mdash; mild but genuine, caught at the most treatable possible stage.</p></div>
<div class="ref-box slate"><span class="ref-lbl slate">Reflection</span>
<p class="ref-q">Does a family history of hair loss shape how you feel about your own? In what way?</p>
<textarea class="f-area" data-key="c25-ref"></textarea></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Genes influence your story &mdash; but they don&rsquo;t write every chapter.</p><div class="confidence-meter" data-case="c25"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c25" data-key="conf-c25" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c25" data-key="conf-c25" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c25" data-key="conf-c25" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c25" data-key="conf-c25" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c29',badge:'Case 29 of 31',section:'Habits, Expectations &amp; Common Mistakes',accent:'',title:'&ldquo;Everything Looked Normal Until the Dermatoscope&rdquo;',
   purp:'Meet Naveen, 36. His scalp appeared almost normal to the naked eye. Under magnification, the story was different.',
   body:`<p class="body-text">Many hairs were noticeably thinner than their neighbours &mdash; miniaturisation invisible without equipment, but unmistakable under a dermatoscope. Technology often confirms what clinical experience suspects.</p>
<div class="callout slate"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Pattern Hair Loss</strong> &mdash; detected via dermatoscopy, years before visible thinning becomes obvious.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Sometimes the diagnosis is hidden in details invisible to the naked eye.</p><div class="confidence-meter" data-case="c29"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c29" data-key="conf-c29" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c29" data-key="conf-c29" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c29" data-key="conf-c29" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c29" data-key="conf-c29" value="4"><span>Very confident</span></label></div></div>`,
   closer:'Six stories, one mechanism: slow, genetically-driven miniaturisation that rewards early, patient attention and punishes years of product-switching.'},
  {id:'p-c3',badge:'Case 03 of 31',section:'Sudden Shedding',accent:'sage-accent',title:'&ldquo;Where did this bald patch come from?&rdquo;',
   purp:'Meet Ananya, 24. One ordinary morning, while tying her hair, she noticed a perfectly round bald spot.',
   body:`<p class="body-text">It hadn&rsquo;t been there a week earlier &mdash; or at least she hadn&rsquo;t noticed it. There was no itching, no pain, no scaling. Just smooth skin where hair used to be. She feared permanent baldness. Her doctor saw something different.</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="c3-clue1"><span class="chk-lbl">Sudden appearance, single smooth patch</span></label>
<label class="chk"><input type="checkbox" data-key="c3-clue2"><span class="chk-lbl">No inflammation, no scaling</span></label>
<label class="chk"><input type="checkbox" data-key="c3-clue3"><span class="chk-lbl">Normal surrounding hair and scalp</span></label>
</div>
<p class="body-text">The follicles were still alive. The immune system had temporarily interrupted their activity. With timely treatment, regrowth was entirely possible.</p>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Alopecia Areata.</strong> Patchy hair loss and diffuse shedding belong to different diagnostic pathways.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: A smooth bald patch deserves evaluation &mdash; but it often carries hope, not hopelessness.</p><div class="confidence-meter" data-case="c3"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c3" data-key="conf-c3" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c3" data-key="conf-c3" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c3" data-key="conf-c3" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c3" data-key="conf-c3" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c9',badge:'Case 09 of 31',section:'Pattern Hair Loss',accent:'slate-accent',title:'The Child with the Scaly Patch',
   purp:'Meet Arjun, 8. His parents feared permanent baldness. The bald area looked inflamed.',
   body:`<p class="body-text">Tiny broken hairs dotted the scalp. It itched constantly. Fortunately, the diagnosis was entirely treatable: a child, visible scaling, broken hairs at the surface, constant itching &mdash; a completely different picture from a smooth patch.</p>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Tinea Capitis</strong> (Scalp Fungal Infection). Usually requires prescription oral antifungal medication, since the infection lives within the hair follicle itself and topical products alone cannot reach it.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: An itchy, scaly patch tells a very different story from a smooth bald patch.</p><div class="confidence-meter" data-case="c9"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c9" data-key="conf-c9" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c9" data-key="conf-c9" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c9" data-key="conf-c9" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c9" data-key="conf-c9" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c15',badge:'Case 15 of 31',section:'Patchy Hair Loss &amp; Scalp Disorders',accent:'rose-accent',title:'&ldquo;The Bald Spot That Wasn&rsquo;t Autoimmune&rdquo;',
   purp:'Meet Ravi, 10. His parents noticed a circular bald area and immediately feared alopecia areata.',
   body:`<p class="body-text">But the doctor noticed redness, scaling, and tiny broken hairs &mdash; a completely different picture from a smooth patch.</p>
<div class="ref-box"><span class="ref-lbl">Pause &amp; Think</span>
<p class="ref-q">Which single clue changes everything here &mdash; the circular shape, the scaling and redness, or the child&rsquo;s age?</p>
<textarea class="f-area" data-key="c15-guess" placeholder="Write your guess before reading on."></textarea></div>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Tinea Capitis</strong> (Fungal Infection) &mdash; not Alopecia Areata. The treatment for one is entirely wrong for the other.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Texture matters as much as shape.</p><div class="confidence-meter" data-case="c15"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c15" data-key="conf-c15" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c15" data-key="conf-c15" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c15" data-key="conf-c15" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c15" data-key="conf-c15" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c26',badge:'Case 26 of 31',section:'Habits, Expectations &amp; Common Mistakes',accent:'',title:'The Child Who Kept Pulling Her Own Hair',
   purp:'Meet Sana, 11. She developed irregular patches of missing hair on an otherwise healthy scalp. Parents suspected fungal infection.',
   body:`<p class="body-text">In conversation, they revealed she often twisted and pulled her hair while studying. Sometimes the history explains what the scalp examination cannot.</p>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Trichotillomania</strong> (Hair-Pulling Disorder). Requires compassionate evaluation, not blame. It is often associated with anxiety or stress, and treatment addresses the underlying behaviour, not the scalp.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Behaviour can leave patterns that resemble disease.</p><div class="confidence-meter" data-case="c26"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c26" data-key="conf-c26" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c26" data-key="conf-c26" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c26" data-key="conf-c26" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c26" data-key="conf-c26" value="4"><span>Very confident</span></label></div></div>`,
   closer:'Four very different patches. Four very different stories. The lesson is the same: look closely before you fear the worst.'},
  {id:'p-c4',badge:'Case 04 of 31',section:'Sudden Shedding',accent:'sage-accent',title:'&ldquo;I&rsquo;ve worn this hairstyle my whole life.&rdquo;',
   purp:'Meet Meera, 36. As a school principal, she kept her hair tied into a firm bun every single day. After more than ten years, she noticed thinning around the temples.',
   body:`<p class="body-text">She bought oils, changed shampoos, even stopped colouring her hair. Nothing helped. During the consultation, the doctor asked only one unexpected question: <em>&ldquo;How tightly do you tie your hair?&rdquo;</em></p>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Traction Alopecia.</strong> Years of continuous pulling gradually injures the follicles. Early traction alopecia may recover when tension is removed promptly; late disease may become permanent.</p></div>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="c4-act1"><span class="chk-lbl">This week, I will loosen my everyday hairstyle</span></label>
<label class="chk"><input type="checkbox" data-key="c4-act2"><span class="chk-lbl">I will avoid extremely tight styles for long periods</span></label>
</div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Sometimes the hairstyle &mdash; not the shampoo &mdash; is the culprit.</p><div class="confidence-meter" data-case="c4"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c4" data-key="conf-c4" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c4" data-key="conf-c4" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c4" data-key="conf-c4" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c4" data-key="conf-c4" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c8',badge:'Case 08 of 31',section:'Pattern Hair Loss',accent:'slate-accent',title:'The \u20b920,000 Supplement Collection',
   purp:'Meet Aman, 34. His bathroom shelf looked like a pharmacy &mdash; biotin gummies, marine collagen, imported capsules, hair vitamins, mineral powders.',
   body:`<p class="body-text">Despite spending thousands, his thinning continued. His blood tests were entirely normal. Supplements help when deficiencies exist. Without a true deficiency, additional supplementation offers very limited benefit &mdash; especially for genetic hair loss.</p>
<div class="callout slate"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Pattern Hair Loss, untreated.</strong> No nutritional deficiency was present &mdash; the thinning was genetic, and no quantity of supplements could substitute for an evidence-based treatment plan.</p></div>
<div class="callout"><span class="callout-lbl">Clinical Pearl</span><p class="callout-text">Evidence beats advertising. Before purchasing any supplement, ask: has a deficiency been confirmed by testing? If not, the money may be better spent on a specialist consultation.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: More vitamins do not automatically mean more hair.</p><div class="confidence-meter" data-case="c8"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c8" data-key="conf-c8" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c8" data-key="conf-c8" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c8" data-key="conf-c8" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c8" data-key="conf-c8" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c13',badge:'Case 13 of 31',section:'Pattern Hair Loss',accent:'slate-accent',title:'&ldquo;I Changed Six Oils in Six Months&rdquo;',
   purp:'Meet Farhan, 35. His bathroom shelf held coconut, onion, rosemary, and castor oil, plus two imported blends &mdash; each promising miraculous regrowth.',
   body:`<p class="body-text">None changed the gradual thinning at his crown. No medical evaluation had ever been sought. Changing oils changes the shine of the hair shaft &mdash; not the biology of the follicle.</p>
<div class="callout slate"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Pattern Hair Loss, unevaluated.</strong> Six months of cosmetic experimentation had delayed an actual diagnosis &mdash; and an actual treatment plan.</p></div>
<div class="ref-box"><span class="ref-lbl">Reflection</span>
<p class="ref-q">Have you been changing products more often than understanding the diagnosis?</p>
<textarea class="f-area" data-key="c13-ref"></textarea></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: A new bottle cannot replace a correct diagnosis.</p><div class="confidence-meter" data-case="c13"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c13" data-key="conf-c13" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c13" data-key="conf-c13" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c13" data-key="conf-c13" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c13" data-key="conf-c13" value="4"><span>Very confident</span></label></div></div>`,

  {id:'p-c17',badge:'Case 17 of 31',section:'Patchy Hair Loss &amp; Scalp Disorders',accent:'rose-accent',title:'&ldquo;The Salon Suggested PRP Immediately&rdquo;',
   purp:'Meet Anita, 37. Before anyone had diagnosed her condition, she was advised expensive injections and procedures at a cosmetic salon.',
   body:`<p class="body-text">She wisely sought another opinion. After proper examination, her doctor recommended a much simpler, evidence-based plan.</p>
<div class="callout rose"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Pattern Hair Loss</strong> &mdash; identified only after Anita insisted on a proper diagnosis before any procedure.</p></div>
<div class="callout"><span class="callout-lbl">The Correct Order</span><p class="callout-text">Diagnosis &rarr; Discussion &rarr; Evidence-based treatment &rarr; Procedures only when appropriate. Never let the treatment determine the diagnosis.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Know what you&rsquo;re treating before deciding how to treat it.</p><div class="confidence-meter" data-case="c17"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c17" data-key="conf-c17" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c17" data-key="conf-c17" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c17" data-key="conf-c17" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c17" data-key="conf-c17" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c20',badge:'Case 20 of 31',section:'Lifestyle &amp; Nutritional Causes',accent:'',title:'&ldquo;The Mirror Became My Enemy&rdquo;',
   purp:'Meet Aisha, 26. Every morning she photographed her scalp. Every evening she counted hairs. The anxiety became more disabling than the hair loss itself.',
   body:`<p class="body-text">Her dermatologist recommended something unexpected: <em>&ldquo;Take one photograph every three months instead.&rdquo;</em> Daily monitoring magnifies anxiety but rarely improves decision-making.</p>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Health Anxiety Amplifying Normal Shedding.</strong> The underlying hair loss was unremarkable; the daily checking ritual had become its own source of distress.</p></div>

<label class="chk"><input type="checkbox" data-key="c20-3"><span class="chk-lbl">I would like to check less often, but find it hard to stop</span></label>

<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Progress is measured over months &mdash; not mirrors.</p><div class="confidence-meter" data-case="c20"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c20" data-key="conf-c20" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c20" data-key="conf-c20" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c20" data-key="conf-c20" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c20" data-key="conf-c20" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c24',badge:'Case 24 of 31',section:'Lifestyle &amp; Nutritional Causes',accent:'',title:'&ldquo;I Bought the Celebrity Shampoo&rdquo;',
   purp:'Meet Rohit, 34. He purchased an expensive imported shampoo endorsed by a famous actor. Three months later his temples continued receding.',
   body:`<p class="body-text">The shampoo had cleaned his scalp beautifully. It had not changed his genetics. Cosmetic products improve hair feel and appearance &mdash; they cannot alter the genetic programme driving pattern hair loss.</p>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Pattern Hair Loss</strong> &mdash; unaffected by three months of cosmetic-only intervention.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Marketing can improve expectations faster than follicles.</p><div class="confidence-meter" data-case="c24"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c24" data-key="conf-c24" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c24" data-key="conf-c24" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c24" data-key="conf-c24" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c24" data-key="conf-c24" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c27',badge:'Case 27 of 31',section:'Habits, Expectations &amp; Common Mistakes',accent:'',title:'&ldquo;The Treatment Was Working\u2026 But He Quit Too Early&rdquo;',
   purp:'Meet Vikram, 38. He started evidence-based therapy. After six weeks he saw no dramatic change and stopped.',
   body:`<p class="body-text">Six months later, progression had continued unchecked &mdash; and the treatment window had narrowed. Hair biology responds slowly. A fair assessment of any treatment requires at least 3&ndash;6 months of consistent use.</p>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Pattern Hair Loss, treatment interrupted.</strong> The original plan had been appropriate; the six-week abandonment, not the treatment, was the failure.</p></div>
<div class="ref-box"><span class="ref-lbl">Reflection</span>
<p class="ref-q">How long do you currently expect to wait before judging whether a treatment is &ldquo;working&rdquo;?</p>
<textarea class="f-area" data-key="c27-ref"></textarea></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Stopping too early may fail the treatment before the treatment fails you.</p><div class="confidence-meter" data-case="c27"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c27" data-key="conf-c27" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c27" data-key="conf-c27" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c27" data-key="conf-c27" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c27" data-key="conf-c27" value="4"><span>Very confident</span></label></div></div>`,
   closer:null},

  {id:'p-c30',badge:'Case 30 of 31',section:'Habits, Expectations &amp; Common Mistakes',accent:'',title:'&ldquo;The Best Treatment Was Reassurance&rdquo;',
   purp:'Meet Kavita, 47. She counted around 70 hairs after washing. No thinning. No widening part. No scalp disease. Photographs over two years were completely unchanged.',
   body:`<p class="body-text">Her doctor gave her the most valuable prescription of all: <em>&ldquo;Your hair is entirely normal. You don&rsquo;t need treatment.&rdquo;</em> Not every hair concern requires treatment. Losing 50&ndash;100 hairs per day is entirely within the normal range.</p>
<div class="callout"><span class="callout-lbl">Most Likely Diagnosis</span><p class="callout-text"><strong>Normal Physiological Shedding.</strong> No disease, no genetic pattern, no deficiency &mdash; simply the ordinary hair cycle, misread as a problem.</p></div>
<div class="callout"><span class="callout-lbl">Clinical Pearl</span><p class="callout-text">Medicine isn&rsquo;t always about prescribing. Sometimes the most powerful intervention is a calm, evidence-based explanation. Reassurance is a legitimate and often underused therapeutic tool.</p></div>
<p class="body-text" style="font-style:italic;opacity:.75">One sentence to remember: Medicine isn&rsquo;t always about prescribing. Sometimes it&rsquo;s about explaining.</p><div class="confidence-meter" data-case="c30"><span class="cm-lbl">How confident were you before reading the answer?</span><div class="cm-opts"><label class="cm-opt"><input type="radio" name="conf-c30" data-key="conf-c30" value="1"><span>Not confident</span></label><label class="cm-opt"><input type="radio" name="conf-c30" data-key="conf-c30" value="2"><span>Somewhat</span></label><label class="cm-opt"><input type="radio" name="conf-c30" data-key="conf-c30" value="3"><span>Fairly</span></label><label class="cm-opt"><input type="radio" name="conf-c30" data-key="conf-c30" value="4"><span>Very confident</span></label></div></div>`,
   closer:'Eight cases. Eight habits, hairstyles, or states of mind &mdash; each one a thread in the larger fabric of a hair story.'},
  {id:'p-grandfinale',badge:'The Grand Finale',section:'Case 31 of 31',accent:'terra-accent',title:'The Man With Three Different Hair Problems',dropcap:true,
   purp:'Meet Rajesh, 45. He came expecting one diagnosis. Instead, careful evaluation revealed three simultaneous issues.',
   body:`<p class="body-text">Rajesh had gradual temple recession for many years. Then, after dengue fever, heavy diffuse shedding began three months later. He had also started tying his remaining hair tightly into a small bun to conceal the thinning &mdash; which was beginning to cause its own damage.</p>
<p class="body-text">No single explanation fit everything.</p>
<div class="ref-box terra"><span class="ref-lbl" style="color:var(--terra)">Final Detective Challenge</span>
<p class="ref-q">Which diagnoses could coexist here? Select all that apply.</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="gf-1"><span class="chk-lbl">Pattern Hair Loss</span></label>
<label class="chk"><input type="checkbox" data-key="gf-2"><span class="chk-lbl">Telogen Effluvium</span></label>
<label class="chk"><input type="checkbox" data-key="gf-3"><span class="chk-lbl">Traction Alopecia</span></label>
<label class="chk"><input type="checkbox" data-key="gf-4"><span class="chk-lbl">Thyroid Disease</span></label>
</div></div>
<div class="callout terra"><span class="callout-lbl">Answer &mdash; All Three of the First Options</span><p class="callout-text">Rajesh had long-standing Pattern Hair Loss, temporary Telogen Effluvium after dengue, and early Traction Alopecia from tight hairstyles &mdash; all at the same time. Each needed to be recognised and addressed separately.</p></div>
<p class="body-text"><strong>The biggest lesson in this workbook:</strong> Patients are not textbooks. They may have multiple overlapping conditions at the same time. The correct diagnosis is sometimes &ldquo;more than one diagnosis.&rdquo;</p>`,
   closer:'The correct diagnosis is sometimes more than one diagnosis.'},

  {id:'p-rapidfire',badge:'Rapid-Fire',section:'Micro Cases',accent:'',title:'Rapid-Fire Micro Cases',
   purp:'Ten scenarios. Answer in your head before reading the explanation. Trust your instincts &mdash; you know more than you think by now.',
   body:`<table class="data-table">
<tbody>
<tr><td><strong>A.</strong> Diffuse shedding three months after typhoid.</td><td style="color:var(--sage);font-style:italic">Telogen Effluvium</td></tr>
<tr><td><strong>B.</strong> Itchy, scaly patch with broken hairs in a child.</td><td style="color:var(--sage);font-style:italic">Tinea Capitis</td></tr>
<tr><td><strong>C.</strong> Gradual recession at both temples over 8 years.</td><td style="color:var(--sage);font-style:italic">Pattern Hair Loss</td></tr>
<tr><td><strong>D.</strong> Shedding four months after childbirth.</td><td style="color:var(--sage);font-style:italic">Postpartum TE</td></tr>
<tr><td><strong>E.</strong> Tight buns, thinning along the hairline.</td><td style="color:var(--sage);font-style:italic">Traction Alopecia</td></tr>
<tr><td><strong>F.</strong> Smooth circular patch, no redness or scaling.</td><td style="color:var(--sage);font-style:italic">Alopecia Areata</td></tr>
<tr><td><strong>G.</strong> Five supplements, entirely normal blood tests.</td><td style="color:var(--sage);font-style:italic">Unlikely to help</td></tr>
<tr><td><strong>H.</strong> Stops minoxidil after 3 weeks, no change.</td><td style="color:var(--sage);font-style:italic">Too early to judge</td></tr>
<tr><td><strong>I.</strong> Fatigue, heavy periods, diffuse shedding.</td><td style="color:var(--sage);font-style:italic">Consider iron deficiency</td></tr>
<tr><td><strong>J.</strong> Daily photos, increasing anxiety, stable disease.</td><td style="color:var(--sage);font-style:italic">Monitor less often</td></tr>
</tbody></table>`,
   closer:'Ten quick patterns. By now, you are reading them as a clinician would &mdash; by timeline, by texture, by context.'},

  {id:'p-lessons',badge:'Summary',section:'The Three Biggest Lessons',accent:'',title:'The Three Biggest Lessons',
   purp:'You are beginning to think like a clinician. Not because you have memorised diseases, but because you have learned to ask better questions.',
   body:`<h3 class="subsec">Lesson 1 &mdash; The Timeline Matters</h3>
<p class="body-text">Ask: <em>&ldquo;What happened two to four months before the hair started changing?&rdquo;</em> The trigger is usually in the past &mdash; not in the present.</p>
<h3 class="subsec">Lesson 2 &mdash; The Pattern Matters</h3>
<p class="body-text">Ask: <em>&ldquo;Is this shedding, thinning, breakage, or patchy loss?&rdquo;</em> Each pattern points to a different cause and a different solution.</p>
<h3 class="subsec">Lesson 3 &mdash; The Person Matters</h3>
<p class="body-text">Medical history, nutrition, medications, hormones, family history, stressors, scalp findings, and expectations all shape the diagnosis. Hair cannot be understood in isolation. Treat the person, not just the hair.</p>`,
   closer:'Great diagnosis doesn&rsquo;t start with a microscope. It starts with curiosity.'},

  {id:'p-pr-1',badge:'Pattern Recognition',section:'After Cases 1\u20137',accent:'sage-accent',title:'What Have These Cases Taught Us?',
   purp:'Seven stories of sudden, diffuse shedding \u2014 each with its own trigger, all sharing one biological mechanism.',
   body:`<ul class="nlist pr-list">
<li>Timelines matter: the trigger is almost always 2&ndash;4 months before the shedding, not the day before.</li>
<li>Diffuse shedding differs fundamentally from patterned thinning &mdash; different mechanism, different prognosis.</li>
<li>Fever, childbirth, surgery, crash dieting, and viral illness can all trigger the identical process: telogen effluvium.</li>
<li>Most of these stories end in spontaneous recovery once the body is given time.</li>
</ul>
<div class="confidence-meter" data-case="pr1" style="border-top:none;padding-top:0">
<span class="cm-lbl">Looking back across Cases 1&ndash;7, how confident do you now feel recognising telogen effluvium?</span>

<label class="cm-opt"><input type="radio" name="conf-pr1" data-key="conf-pr1" value="1"><span>Not confident</span></label>
<label class="cm-opt"><input type="radio" name="conf-pr1" data-key="conf-pr1" value="2"><span>Somewhat</span></label>
<label class="cm-opt"><input type="radio" name="conf-pr1" data-key="conf-pr1" value="3"><span>Fairly</span></label>
<label class="cm-opt"><input type="radio" name="conf-pr1" data-key="conf-pr1" value="4"><span>Very confident</span></label>
</div></div>`,
   closer:null},

  {id:'p-pr-2',badge:'Pattern Recognition',section:'After Cases 8\u201313',accent:'slate-accent',title:'What Have These Cases Taught Us?',
   purp:'Six stories of gradual, quiet thinning \u2014 the opposite rhythm to the cases before them.',
   body:`<ul class="nlist pr-list">
<li>Patterned thinning unfolds over years, not weeks &mdash; and rarely announces itself with dramatic shedding.</li>
<li>A widening part or thinner ponytail can matter more than the volume of hair in the shower drain.</li>
<li>Genetics raise risk but do not determine outcome on their own.</li>
<li>Photographs taken months apart consistently reveal more than daily hair-counting ever can.</li>
</ul>
<div class="confidence-meter" data-case="pr2" style="border-top:none;padding-top:0">
<span class="cm-lbl">Looking back across Cases 8&ndash;13, how confident do you now feel recognising pattern hair loss?</span>

  {id:'p-pr-3',badge:'Pattern Recognition',section:'After Cases 14\u201318',accent:'rose-accent',title:'What Have These Cases Taught Us?',
   purp:'Five stories where the scalp itself \u2014 its texture, its shape, its surface \u2014 held the decisive clue.',
   body:`<ul class="nlist pr-list">
<li>Patchy loss requires a different differential diagnosis entirely from diffuse or gradual loss.</li>
<li>A smooth patch and a scaly patch can look similar at a glance but point to opposite treatments.</li>
<li>Systemic illness &mdash; like thyroid disease &mdash; can present first through the hair.</li>
<li>Behavioural causes, like hair-pulling, deserve compassion rather than blame.</li>
</ul>
<div class="confidence-meter" data-case="pr3" style="border-top:none;padding-top:0">

  {id:'p-pr-4',badge:'Pattern Recognition',section:'After Cases 19\u201324',accent:'',title:'What Have These Cases Taught Us?',
   purp:'Six stories where nutrition, weight, hormones, and infection sat at the centre of the mystery.',
   body:`<ul class="nlist pr-list">
<li>Crash diets and rapid weight loss can trigger the same telogen effluvium seen after illness.</li>
<li>Breakage and shedding are not the same problem and do not share a treatment.</li>
<li>Postpartum shedding usually reflects biology, not failure.</li>
<li>Marketing can change expectations far faster than it can change follicles.</li>
</ul>

   body:`<ul class="nlist pr-list">
<li>Anxiety can amplify normal shedding into something that feels catastrophic.</li>

<li>Procedures should follow diagnosis &mdash; never replace it.</li>
<li>Sometimes the correct prescription is simply reassurance, clearly explained.</li>

  {id:'p-mythrecap',badge:'Recap',section:'Top 10 Myths',accent:'terra-accent',title:'The Top Ten Myths, Once More',
   purp:'You have met each of these myths individually across thirty-one cases. Here they are gathered in one place \u2014 a final inoculation against them.',
   body:`<ol class="myth-recap-list">
<li><strong>Shampoo caused my baldness.</strong> Cosmetic products clean and condition; they do not alter follicle genetics.</li>
<li><strong>Oiling reverses genetic hair loss.</strong> Oils improve shine and shaft texture, not follicle biology.</li>
<li><strong>Wearing helmets causes baldness.</strong> Helmets flatten hair temporarily; they do not trigger genetic loss.</li>
<li><strong>Every strand in the shower means disease.</strong> Losing 50&ndash;100 hairs daily is entirely normal.</li>
<li><strong>Celebrity products regrow hair.</strong> Marketing changes expectations faster than it changes follicles.</li>
<li><strong>Stress causes all hair loss.</strong> Stress can trigger telogen effluvium, but many other contributors exist.</li>
<li><strong>Hair supplements work for everyone.</strong> Supplements help only when a true deficiency exists.</li>
<li><strong>Cutting hair makes it thicker.</strong> Cutting affects length only; it cannot change the follicle.</li>
<li><strong>Counting hairs is the best way to judge progress.</strong> Standardised photographs outperform daily counting every time.</li>
<li><strong>More expensive treatment is always better.</strong> Diagnosis should always precede treatment &mdash; procedures are not a shortcut around it.</li>
</ol>
<div class="ref-box terra"><span class="ref-lbl" style="color:var(--terra)">Reflection</span>
<p class="ref-q">Which of these ten myths did you believe most strongly before this workbook? What changed your mind?</p>
<textarea class="f-area" data-key="myth-recap-ref"></textarea></div>`,
   closer:null},

<h3 class="subsec">Green, Yellow, or Red?</h3>
<p class="body-text">Use this guide to assess your current situation.</p>

  {id:'p-physician',badge:'A Note',section:"A Physician's Note",dropcap:true,accent:'physician-card',title:"A Physician's Note",
   purp:null,
   body:`<p class="body-text">If you have completed this workbook, you have already done something valuable.</p>
<p class="body-text">You have paid attention. Most symptoms go unexamined for years &mdash; not from negligence, but because daily life is demanding, and sitting quietly with a difficult question requires a kind of courage that is easy to underestimate.</p>
<p class="body-text">Hair loss rarely has a single explanation. More often, it emerges from the interaction of timeline, pattern, nutrition, hormones, hairstyle habits, and the person carrying it all.</p>
<p class="body-text">Normal test results are not the end of the conversation. They are the beginning of a more specific one. If your scalp examination has been reassuring and you still feel uncertain, the right response is to ask: <em>what question have we not yet asked?</em></p>
<p class="body-text">You are not obligated to accept hair loss as something to simply endure. Even hair loss that has been present for years often has contributors that have not yet been identified or adequately addressed.</p>
<p class="body-text">The purpose of this workbook was not to turn you into your own dermatologist. It was to help you arrive at the right conversation &mdash; with a clinician who can hear what you are describing, and perhaps, most usefully of all, with yourself.</p>
<p class="body-text" style="font-style:italic;margin-top:1.4rem;opacity:.7">&mdash; A Physician</p>`,
   closer:null},

  {id:'p-letter',badge:'The Final Chapter',section:'A Letter From Your Doctor',accent:'rose-accent',title:'A Final Letter From Your Doctor',dropcap:true,
   purp:'If you remember only one message from this workbook, let it be this.',
   body:`<p class="body-text" style="font-family:var(--serif);font-style:italic;font-size:1.12rem;color:var(--ink)">Hair loss is a clue &mdash; not a verdict.</p>
<p class="body-text">Most people do not need to fear every strand they see in the shower or on a comb. At the same time, some patterns deserve timely medical evaluation &mdash; to preserve hair and to uncover underlying health conditions that deserve attention.</p>
<p class="body-text">The goal was never to turn you into a dermatologist. It was to help you become a thoughtful, informed observer of your own health &mdash; someone who asks better questions, recognises important patterns, and approaches the clinic with confidence rather than panic.</p>
<p class="body-text">Hair growth is slow. Recovery, when it comes, is patient. And the best outcomes usually belong to those who start early, stay consistent, and keep asking the right questions.</p>
<p class="body-text" style="font-style:italic;opacity:.8;margin-top:1.2rem">Fear counts hairs. Wisdom looks for patterns. Good decisions begin with understanding.</p>
<p class="body-text" style="font-style:italic;opacity:.65;margin-top:1.2rem">Take care of yourself &mdash; and never be afraid to ask for help.</p>`,
   closer:null},

   body:`<div class="four-ps-grid">

<div class="four-p-card"><span class="four-p-letter">P</span><span class="four-p-word">Progression</span><p class="four-p-desc">How fast is it changing? Sudden and dramatic often means temporary. Slow and quiet often means genetic.</p></div>
