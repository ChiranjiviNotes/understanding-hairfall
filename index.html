<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════ */
:root {
  --ground:      #0f0e0c;
  --paper:       #f7f4ef;
  --paper-warm:  #f0ece4;
  --paper-rose:  #f5ede8;
  --ink:         #232018;
  --ink-light:   #4a4438;
  --ink-faint:   #7a7068;
  --gold:        #bfa07a;
  --gold-dim:    #8a7056;
  --gold-rule:   rgba(191,160,122,0.35);
  --sage:        #7a9e8a;
  --sage-light:  rgba(122,158,138,0.1);
  --slate:       #6b7b8d;
  --slate-light: rgba(107,123,141,0.1);
  --rose:        #c4a799;
  --rose-light:  rgba(196,167,153,0.12);
  --terra:       #b5614a;
  --terra-light: rgba(181,97,74,0.1);
  --shadow:      rgba(15,14,12,0.18);
  --shadow-sm:   0 1px 3px rgba(35,32,24,0.06), 0 1px 2px rgba(35,32,24,0.05);
  --shadow-md:   0 6px 24px rgba(35,32,24,0.07), 0 2px 8px rgba(35,32,24,0.05);
  --shadow-lg:   0 18px 60px rgba(15,14,12,0.16), 0 4px 16px rgba(15,14,12,0.08);
  --shadow-gold: 0 8px 32px rgba(191,160,122,0.12);
 
  --illus-stroke: rgba(74,68,56,0.5);
  --illus-fill:   rgba(191,160,122,0.06);
 
  --serif:   'Cormorant Garamond', 'Palatino Linotype', Georgia, serif;
  --body:    'EB Garamond', 'Palatino Linotype', Georgia, serif;
  --deva:    'Tiro Devanagari Hindi', 'Noto Serif Devanagari', serif;
 
  --page-max: 720px;
  --col-max:  620px;
 
  --ease-out:    cubic-bezier(.16,1,.3,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}
 
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
 
/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  background: var(--ground);
  font-family: var(--body);
  color: var(--ink);
  line-height: 1.75;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E"),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='turbulence' baseFrequency='0.012 0.04' numOctaves='2' result='t'/%3E%3CfeColorMatrix in='t' type='matrix' values='0 0 0 0 0.46  0 0 0 0 0.39  0 0 0 0 0.30  0 0 0 0.05 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
  background-size: 200px 200px, 100% 100%;
  pointer-events: none; z-index: 9999; opacity: 0.4; mix-blend-mode: multiply;
}
 
/* ═══════════════════════════════════════════════
   SCROLL PROGRESS
═══════════════════════════════════════════════ */
#scroll-prog {
  position: fixed; top: 0; left: 0; height: 2px; width: 0%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  z-index: 300; transition: width 0.08s linear; pointer-events: none;
}
 
/* ═══════════════════════════════════════════════
   STICKY NAV
═══════════════════════════════════════════════ */
#sticky-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: rgba(15,14,12,0.94); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(191,160,122,0.12);
  padding: 0.62rem 1.4rem;
  display: flex; align-items: center; gap: 1rem;
  transform: translateY(-100%); transition: transform 0.35s ease;
}
#sticky-nav.show { transform: translateY(0); }
.nav-brand {
  font-family: var(--serif); font-size: 0.6rem; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--gold); opacity: 0.62; flex-shrink: 0;
}
#nav-section {
  font-family: var(--serif); font-size: 0.65rem; color: var(--gold);
  opacity: 0.45; margin-left: auto; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 200px; flex-shrink: 0;
  letter-spacing: 0.06em;
}
#save-toast {
  font-family: var(--serif); font-size: 0.57rem; letter-spacing: 0.1em;
  color: var(--gold-dim); opacity: 0; transition: opacity 0.4s; flex-shrink: 0;
}
#save-toast.show { opacity: 0.62; }
#prog-dots { display: flex; gap: 0.3rem; }
.pdot {
  width: 5px; height: 5px; border-radius: 50%;
  border: 1px solid rgba(191,160,122,0.25); background: transparent;
  transition: background 0.2s, transform 0.18s;
}
.pdot.done { background: var(--gold-dim); border-color: var(--gold-dim); }
.pdot.active { background: var(--gold); border-color: var(--gold); transform: scale(1.5); }
 
/* ═══════════════════════════════════════════════
   UTILITY BUTTONS
═══════════════════════════════════════════════ */
#btt {
  position: fixed; bottom: 1.2rem; right: 1.2rem; z-index: 150;
  width: 44px; height: 44px; border-radius: 2px;
  border: 1px solid rgba(191,160,122,0.28); background: rgba(15,14,12,0.9);
  backdrop-filter: blur(8px); color: var(--gold); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.35s var(--ease-out), transform 0.35s var(--ease-out), background 0.25s, border-color 0.25s; pointer-events: none;
}
#btt.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
#btt:hover { background: rgba(191,160,122,0.12); border-color: var(--gold); }
#btt svg { width: 14px; height: 14px; }
.fs-wrap {
  position: fixed; bottom: 4.6rem; right: 1.2rem; z-index: 150;
  display: flex; flex-direction: column; gap: 0.35rem;
}
.fs-btn {
  width: 44px; height: 44px; border-radius: 2px;
  border: 1px solid rgba(191,160,122,0.28); background: rgba(15,14,12,0.9);
  backdrop-filter: blur(8px); color: var(--gold); cursor: pointer;
  font-family: var(--serif); font-size: 0.78rem;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.25s var(--ease-out), border-color 0.25s var(--ease-out);
}
.fs-btn:hover { background: rgba(191,160,122,0.12); border-color: var(--gold); }
#toast {
  position: fixed; bottom: 3.5rem; left: 50%; z-index: 400;
  transform: translateX(-50%) translateY(16px);
  background: rgba(15,14,12,0.95); border: 1px solid rgba(191,160,122,0.25);
  color: var(--gold); font-family: var(--serif); font-size: 0.7rem;
  letter-spacing: 0.1em; padding: 0.6rem 1.4rem;
  opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
 
/* ═══════════════════════════════════════════════
   WORKBOOK WRAPPER
═══════════════════════════════════════════════ */
#workbook {
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 0 1rem 8rem;
  perspective: 1400px;
}
 
/* ═══════════════════════════════════════════════
   COVER
═══════════════════════════════════════════════ */
.cover {
  min-height: 100vh; display: flex; align-items: center;
  justify-content: center; padding: 5rem 2rem;
  position: relative; overflow: hidden; text-align: center;
}
.cover::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 22% 28%, rgba(191,160,122,0.1) 0%, transparent 52%),
    radial-gradient(ellipse at 80% 18%, rgba(196,167,153,0.05) 0%, transparent 45%),
    radial-gradient(ellipse at 78% 78%, rgba(122,158,138,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(181,97,74,0.04) 0%, transparent 60%),
    linear-gradient(165deg, #14130f 0%, #0f0e0c 45%, #0c0b09 100%);
  z-index: 0;
}
.cover-illus {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: min(640px, 110vw); height: min(640px, 110vw);
  z-index: 0; opacity: 0.9; pointer-events: none;
}
.cover-illus .ci-pulse { animation: coverPulse 12s var(--ease-out) infinite; transform-origin: center; }
.cover-illus .ci-rotate { animation: coverRotate 240s linear infinite; transform-origin: center; }
@keyframes coverPulse {
  0%, 100% { opacity: 0.55; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.035); }
}
@keyframes coverRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.cover-inner { position: relative; max-width: 480px; z-index: 1; }
.cover-mono {
  width: 58px; height: 58px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 2.2rem; position: relative;
  font-family: var(--serif); font-size: 1rem; color: var(--gold);
  letter-spacing: 0.06em; opacity: 0.9;
}
.cover-mono::before, .cover-mono::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(191,160,122,0.5);
}
.cover-mono::after { inset: -7px; border-color: rgba(191,160,122,0.18); }
.cover-kicker {
  font-family: var(--serif); font-size: 0.6rem; letter-spacing: 0.38em;
  text-transform: uppercase; color: var(--gold); opacity: 0.58; margin-bottom: 1.4rem;
}
.cover-h1 {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(2.2rem, 6vw, 3.4rem);
  color: var(--paper); line-height: 1.16; margin-bottom: 0.5rem;
  letter-spacing: -0.01em; text-shadow: 0 2px 40px rgba(0,0,0,0.3);
}
.cover-h1 em { font-style: italic; color: var(--gold); }
.cover-sub {
  font-family: var(--serif); font-style: italic; font-size: 0.95rem;
  color: var(--paper); opacity: 0.4; margin-bottom: 3rem; letter-spacing: 0.02em;
}
.cover-rule { width: 48px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.45; margin: 0 auto 2.8rem; }
.cover-epigraph {
  font-family: var(--serif); font-style: italic; font-size: 1.02rem;
  color: var(--paper); opacity: 0.55; line-height: 1.9; margin-bottom: 2.8rem;
}
.cover-begin {
  font-family: var(--serif); font-size: 0.65rem; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--gold);
  border: 1px solid rgba(191,160,122,0.35); padding: 0.82rem 2rem;
  background: transparent; cursor: pointer; border-radius: 1px;
  transition: background 0.4s var(--ease-out), border-color 0.4s var(--ease-out), color 0.4s var(--ease-out), letter-spacing 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
}
.cover-begin:hover {
  background: rgba(191,160,122,0.08); border-color: var(--gold); color: var(--paper);
  letter-spacing: 0.34em; box-shadow: var(--shadow-gold);
}
 
/* ═══════════════════════════════════════════════
   CHAPTER OPENERS (dark ground)
═══════════════════════════════════════════════ */
.chapter-opener {
  min-height: 96vh; display: flex; align-items: center;
  padding: 5rem 3rem; margin-bottom: 0;
  position: relative; overflow: hidden;
  --co-accent: var(--gold);
}
.chapter-opener::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 28% 50%, color-mix(in srgb, var(--co-accent) 9%, transparent) 0%, transparent 62%),
    radial-gradient(ellipse at 88% 14%, color-mix(in srgb, var(--co-accent) 6%, transparent) 0%, transparent 50%);
}
.chapter-opener::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--co-accent) 45%, transparent), transparent);
}
.co-illus {
  position: absolute; right: -4%; top: 50%; transform: translateY(-50%);
  width: min(46vw, 460px); height: min(46vw, 460px);
  opacity: 0.5; pointer-events: none; z-index: 0;
}
.co-illus.left { right: auto; left: -6%; }
@media (max-width: 760px) {
  .co-illus { width: 78vw; height: 78vw; right: 50%; top: 14%; transform: translate(50%,0); opacity: 0.32; }
}
.co-inner { position: relative; max-width: var(--col-max); z-index: 1; }
.co-icon {
  font-size: 1.2rem; color: var(--co-accent); opacity: 0.65;
  margin-bottom: 1.4rem; display: block;
}
.co-label {
  font-family: var(--serif); font-size: 0.58rem; letter-spacing: 0.36em;
  text-transform: uppercase; color: var(--co-accent); opacity: 0.65;
  display: block; margin-bottom: 0.6rem;
}
.co-title {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(1.8rem, 4.5vw, 2.8rem);
  color: var(--paper); line-height: 1.18; margin-bottom: 0.8rem;
}
.co-desc {
  font-family: var(--serif); font-style: italic; font-size: 1rem;
  color: var(--paper); opacity: 0.42; line-height: 1.7;
  max-width: 30em;
}
.co-rule {
  width: 40px; height: 1px; margin: 1.8rem 0 0;
  background: linear-gradient(90deg, var(--co-accent), transparent); opacity: 0.5;
}
 
/* ═══════════════════════════════════════════════
   SECTION DIVIDERS (botanical / anatomical line art)
═══════════════════════════════════════════════ */
.section-divider {
  display: flex; align-items: center; justify-content: center;
  padding: 2.2rem 0; opacity: 0;
  transform: translateY(10px) scale(0.96);
  transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out);
}
.section-divider.vis { opacity: 0.85; transform: translateY(0) scale(1); }
.section-divider svg { display: block; }
 
/* ═══════════════════════════════════════════════
   PAGE CARDS
═══════════════════════════════════════════════ */
.page-card {
  background: var(--paper); padding: 3rem 3.5rem;
  margin-bottom: 2.5rem; position: relative;
  box-shadow: var(--shadow-md);
  opacity: 0; transform: translateY(28px) rotateX(2deg) scale(0.985);
  transform-origin: top center;
  transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out), box-shadow 0.5s var(--ease-out);
}
.page-card.vis { opacity: 1; transform: translateY(0) rotateX(0) scale(1); box-shadow: var(--shadow-lg); }
.page-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--gold) 0%, transparent 100%); opacity: 0.45;
}
.page-card.sage-accent::before { background: linear-gradient(90deg, var(--sage) 0%, transparent 100%); }
.page-card.slate-accent::before { background: linear-gradient(90deg, var(--slate) 0%, transparent 100%); }
.page-card.rose-accent { background: var(--paper-rose); }
.page-card.rose-accent::before { background: linear-gradient(90deg, var(--rose) 0%, transparent 100%); }
.page-card.terra-accent::before { background: linear-gradient(90deg, var(--terra) 0%, transparent 100%); }
.page-card.physician-card { background: var(--paper-warm); }
.page-card.physician-card::before { background: none; border-top: 1px solid var(--gold-rule); }
 
.card-badge {
  position: absolute; top: 1.4rem; right: 1.8rem;
  font-family: var(--serif); font-size: 0.58rem; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gold-dim); opacity: 0.6;
}
 
/* Completion indicator — small seal that appears once a page has been engaged with */
.pg-check {
  position: absolute; top: 1.35rem; left: 1.55rem;
  width: 21px; height: 21px; border-radius: 50%;
  background: var(--gold); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; opacity: 0; transform: scale(0.4) rotate(-20deg);
  transition: opacity 0.45s var(--ease-spring), transform 0.45s var(--ease-spring);
  pointer-events: none; box-shadow: var(--shadow-sm);
}
.page-card.card-touched .pg-check { opacity: 0.92; transform: scale(1) rotate(0deg); }
.sage-accent .pg-check { background: var(--sage); }
.slate-accent .pg-check { background: var(--slate); }
.rose-accent .pg-check { background: var(--rose); }
.terra-accent .pg-check { background: var(--terra); }
.card-section {
  font-family: var(--serif); font-size: 0.56rem; letter-spacing: 0.34em;
  text-transform: uppercase; color: var(--gold-dim); display: block; margin-bottom: 0.42rem;
}
.card-section.sage { color: var(--sage); }
.card-section.slate { color: var(--slate); }
.card-section.rose { color: var(--rose); }
.card-section.terra { color: var(--terra); }
.card-title {
  font-family: var(--serif); font-size: 1.75rem; font-weight: 400;
  color: var(--ink); line-height: 1.2; margin-bottom: 0.32rem;
}
.card-rule { border: none; border-top: 1px solid var(--gold-rule); margin: 1.4rem 0; }
.card-rule.sage { border-top-color: rgba(122,158,138,0.3); }
.card-rule.slate { border-top-color: rgba(107,123,141,0.3); }
.card-purp {
  font-style: italic; font-size: 0.92rem; color: var(--ink-light);
  border-left: 2px solid var(--gold); padding-left: 1rem;
  line-height: 1.68; margin-bottom: 1.5rem; opacity: 0.88;
}
.card-purp.sage { border-left-color: var(--sage); }
.card-purp.slate { border-left-color: var(--slate); }
 
/* ═══════════════════════════════════════════════
   TYPOGRAPHY WITHIN CARDS
═══════════════════════════════════════════════ */
.body-text {
  font-size: 1rem; color: var(--ink-light); line-height: 1.8;
  margin-bottom: 1.1rem;
}
 
/* ═══════════════════════════════════════════════
   DROP CAPS — literary opening for major essays
═══════════════════════════════════════════════ */
.dropcap {
  float: left; font-family: var(--serif); font-weight: 400;
  font-size: 3.6em; line-height: 0.78; padding: 0.04em 0.1em 0 0;
  color: var(--gold); font-style: normal;
}
.sage-accent .dropcap { color: var(--sage); }
.slate-accent .dropcap { color: var(--slate); }
.rose-accent .dropcap { color: var(--rose); }
.terra-accent .dropcap { color: var(--terra); }
.body-text em { font-style: italic; color: var(--ink); }
.body-text strong { font-weight: 500; color: var(--ink); }
.subsec {
  font-family: var(--serif); font-size: 1rem; font-weight: 500;
  color: var(--ink); margin: 1.55rem 0 0.65rem; letter-spacing: 0.01em;
}
.card-closer {
  margin-top: 1.8rem; padding-top: 1.15rem;
  border-top: 1px solid rgba(191,160,122,0.14);
  font-style: italic; font-size: 0.88rem; color: var(--ink-light);
  opacity: 0.6; text-align: center; line-height: 1.7;
}
 
/* ═══════════════════════════════════════════════
   PULL QUOTE PAGES (standalone)
═══════════════════════════════════════════════ */
.pull-page {
  min-height: 46vh; display: flex; align-items: center; justify-content: center;
  padding: 4rem 3rem; margin-bottom: 2.5rem; position: relative; overflow: hidden;
  opacity: 0; transform: translateY(18px);
  transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out);
}
.pull-page.vis { opacity: 1; transform: translateY(0); }
.pull-page.dark { /* no background — uses body ground */ }
.pull-page.light {
  background:
    radial-gradient(ellipse at 80% 20%, rgba(191,160,122,0.05) 0%, transparent 55%),
    var(--paper);
  box-shadow: var(--shadow-lg);
}
.pull-inner { max-width: 520px; text-align: center; position: relative; z-index: 1; }
.pull-quotemark {
  position: absolute; top: -2.6rem; left: 50%; transform: translateX(-50%);
  font-family: var(--serif); font-size: 7rem; line-height: 1;
  color: var(--gold); opacity: 0.12; pointer-events: none; user-select: none;
  z-index: 0;
}
.pull-page.light .pull-quotemark { opacity: 0.08; }
.pull-diamond {
  font-size: 0.7rem; color: var(--gold); opacity: 0.5;
  display: block; margin-bottom: 1.4rem; letter-spacing: 0.5em;
}
.pull-text {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(1.2rem, 3vw, 1.7rem); font-weight: 300;
  line-height: 1.65; color: var(--paper);
}
.pull-page.light .pull-text { color: var(--ink); }
.pull-attr {
  font-family: var(--serif); font-size: 0.68rem; letter-spacing: 0.18em;
  color: var(--gold-dim); opacity: 0.65; margin-top: 1.2rem; display: block;
}
 
/* ═══════════════════════════════════════════════
   CHECKLISTS
═══════════════════════════════════════════════ */
.chk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.2rem; margin-bottom: 0.9rem; }
.chk-grid.col1 { grid-template-columns: 1fr; }
.chk {
  display: flex; align-items: flex-start; gap: 0.6rem;
  cursor: pointer; padding: 0.22rem 0.3rem; margin: -0.22rem -0.3rem;
  border-radius: 3px; min-height: 28px;
  transition: background 0.25s var(--ease-out);
}
.chk:hover { background: rgba(191,160,122,0.06); }
.chk input[type=checkbox] {
  appearance: none; -webkit-appearance: none;
  width: 17px; height: 17px; border: 1.5px solid var(--gold-dim);
  background: var(--paper); flex-shrink: 0; cursor: pointer;
  position: relative; margin-top: 3px; border-radius: 3px;
  transition: background 0.2s var(--ease-out), border-color 0.2s var(--ease-out), transform 0.15s var(--ease-spring);
}
.chk input[type=checkbox]:active { transform: scale(0.88); }
.chk input[type=checkbox]:checked {
  background: var(--gold); border-color: var(--gold);
  animation: checkPop 0.32s var(--ease-spring);
}
.chk input[type=checkbox]:checked::after {
  content: ''; position: absolute; top: 2px; left: 5px;
  width: 4px; height: 8px;
  border: 2px solid var(--paper); border-top: none; border-left: none;
  transform: rotate(45deg);
}
@keyframes checkPop {
  0% { transform: scale(0.7); }
  55% { transform: scale(1.18); }
  100% { transform: scale(1); }
}
.sage-accent .chk input[type=checkbox]:checked { background: var(--sage); border-color: var(--sage); }
.slate-accent .chk input[type=checkbox]:checked { background: var(--slate); border-color: var(--slate); }
.terra-accent .chk input[type=checkbox] { border-color: var(--terra); }
.terra-accent .chk input[type=checkbox]:checked { background: var(--terra); border-color: var(--terra); }
.chk-lbl { font-size: 0.92rem; color: var(--ink-light); line-height: 1.5; transition: color 0.2s, opacity 0.2s; }
.chk input[type=checkbox]:checked ~ .chk-lbl { color: var(--ink); }
@media (hover: none) {
  .chk { min-height: 44px; }
  .chk input[type=checkbox] { width: 19px; height: 19px; }
}
 
/* ═══════════════════════════════════════════════
   REFLECTION BOXES
═══════════════════════════════════════════════ */
.ref-box {
  background: var(--rose-light); border-left: 2px solid var(--rose);
  padding: 1.2rem 1.4rem; margin: 1.6rem 0 0.5rem;
}
.ref-box.sage { background: var(--sage-light); border-left-color: var(--sage); }
.ref-box.slate { background: var(--slate-light); border-left-color: var(--slate); }
.ref-lbl {
  font-family: var(--serif); font-size: 0.54rem; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--rose); opacity: 0.78;
  display: block; margin-bottom: 0.55rem;
}
.ref-lbl.sage { color: var(--sage); }
.ref-lbl.slate { color: var(--slate); }
.ref-q {
  font-family: var(--serif); font-style: italic; font-size: 1rem;
  color: var(--ink); margin-bottom: 0.68rem; line-height: 1.58;
}

/* ═══════════════════════════════════════════════
   CONFIDENCE METER
═══════════════════════════════════════════════ */
.confidence-meter {
  margin-top: 1rem; padding-top: 0.9rem;
  border-top: 1px dashed rgba(191,160,122,0.28);
}
.cm-lbl {
  display: block; font-family: var(--serif); font-style: italic;
  font-size: 0.82rem; color: var(--ink-faint); margin-bottom: 0.6rem;
}
.cm-opts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.cm-opt {
  display: flex; align-items: center; gap: 0.35rem;
  cursor: pointer; padding: 0.32rem 0.7rem;
  border: 1px solid rgba(191,160,122,0.3); border-radius: 20px;
  font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.03em;
  color: var(--ink-faint); transition: all 0.22s var(--ease-out);
}
.cm-opt:hover { border-color: var(--gold); color: var(--ink); }
.cm-opt input[type=radio] {
  appearance: none; -webkit-appearance: none;
  width: 9px; height: 9px; border-radius: 50%;
  border: 1.5px solid var(--gold-dim); margin: 0; flex-shrink: 0;
  transition: all 0.2s var(--ease-out);
}
.cm-opt input[type=radio]:checked {
  background: var(--gold); border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(191,160,122,0.18);
}
.cm-opt:has(input:checked) {
  border-color: var(--gold); background: rgba(191,160,122,0.08); color: var(--ink);
}
@media (hover: none) { .cm-opt { padding: 0.4rem 0.8rem; } }
.sage-accent .cm-opt:hover, .sage-accent .cm-opt:has(input:checked) { border-color: var(--sage); }
.sage-accent .cm-opt input[type=radio]:checked { background: var(--sage); border-color: var(--sage); box-shadow: 0 0 0 2px rgba(124,154,128,0.18); }
.terra-accent .cm-opt:hover, .terra-accent .cm-opt:has(input:checked) { border-color: var(--terra); }
.terra-accent .cm-opt input[type=radio]:checked { background: var(--terra); border-color: var(--terra); box-shadow: 0 0 0 2px rgba(196,108,74,0.18); }
.rose-accent .cm-opt:hover, .rose-accent .cm-opt:has(input:checked) { border-color: var(--rose); }
.rose-accent .cm-opt input[type=radio]:checked { background: var(--rose); border-color: var(--rose); box-shadow: 0 0 0 2px rgba(196,140,140,0.18); }

 
/* ═══════════════════════════════════════════════
   INPUTS & TEXTAREAS
═══════════════════════════════════════════════ */
.f-line {
  display: block; width: 100%; border: none;
  border-bottom: 1.5px solid rgba(191,160,122,0.2);
  background: transparent; font-family: var(--body); font-size: 1rem;
  color: var(--ink); padding: 0.5rem 0.2rem; margin-bottom: 0.85rem;
  outline: none; -webkit-appearance: none; border-radius: 2px 2px 0 0;
  transition: border-color 0.3s var(--ease-out), background 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out);
  min-height: 44px;
}
.f-line::placeholder { color: var(--gold-dim); opacity: 0.45; font-style: italic; }
.f-line:focus { border-bottom-color: var(--gold); background: rgba(191,160,122,0.045); box-shadow: 0 1px 0 0 var(--gold); }
.f-area {
  display: block; width: 100%; border: none;
  border-bottom: 1.5px solid rgba(191,160,122,0.2);
  background: rgba(191,160,122,0.035);
  font-family: var(--body); font-size: 1rem; color: var(--ink);
  padding: 0.7rem 0.7rem; margin-bottom: 0.85rem; border-radius: 3px 3px 2px 2px;
  outline: none; resize: vertical; min-height: 80px; line-height: 1.8;
  transition: border-color 0.3s var(--ease-out), background 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out);
}
.f-area::placeholder { color: var(--gold-dim); opacity: 0.42; font-style: italic; }
.f-area:focus { border-bottom-color: var(--gold); background: rgba(191,160,122,0.065); box-shadow: 0 1px 0 0 var(--gold), 0 4px 18px rgba(191,160,122,0.08); }
.f-area.large { min-height: 140px; }
.f-area.letter { min-height: 200px; font-style: italic; }
.fpair { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; margin-bottom: 0.9rem; }
.fgrp label {
  display: block; font-family: var(--serif); font-size: 0.65rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-light);
  margin-bottom: 0.2rem; opacity: 0.65;
}
 
/* rating scale */
.rating-wrap { margin: 0.8rem 0 1.2rem; }
.rating-ends {
  display: flex; justify-content: space-between;
  font-family: var(--serif); font-size: 0.68rem; letter-spacing: 0.06em;
  color: var(--ink-light); opacity: 0.55; margin-bottom: 0.45rem;
}
.rating-row { display: flex; gap: 0.35rem; }
.rating-row input[type=radio] { display: none; }
.rating-row label {
  flex: 1; text-align: center; font-family: var(--serif); font-size: 0.85rem;
  color: var(--ink-light); padding: 0.5rem 0; min-height: 38px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold-rule); cursor: pointer; border-radius: 2px;
  transition: background 0.2s var(--ease-out), color 0.2s var(--ease-out), border-color 0.2s var(--ease-out), transform 0.18s var(--ease-spring), box-shadow 0.2s var(--ease-out);
}
.rating-row input[type=radio]:checked + label {
  background: var(--gold); color: var(--paper); border-color: var(--gold); font-weight: 600;
  transform: scale(1.08); box-shadow: var(--shadow-gold);
}
.rating-row label:hover { background: rgba(191,160,122,0.1); border-color: var(--gold); transform: translateY(-1px); }
.rating-row label:active { transform: scale(0.95); }
 
/* ═══════════════════════════════════════════════
   SPECIAL CALLOUT BOXES
═══════════════════════════════════════════════ */
.callout {
  background: rgba(191,160,122,0.06); border: 1px solid rgba(191,160,122,0.2);
  padding: 1.1rem 1.4rem; margin: 1.1rem 0;
}
.callout-lbl {
  font-family: var(--serif); font-size: 0.54rem; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--gold-dim); display: block; margin-bottom: 0.45rem;
}
.callout-text { font-size: 0.9rem; color: var(--ink-light); line-height: 1.7; font-style: italic; }
.callout.terra { background: var(--terra-light); border-color: rgba(181,97,74,0.25); }
.callout.terra .callout-lbl { color: var(--terra); }
.callout.sage { background: var(--sage-light); border-color: rgba(122,158,138,0.28); }
.callout.sage .callout-lbl { color: var(--sage); }
.callout.rose { background: var(--rose-light); border-color: rgba(196,167,153,0.3); }
.callout.rose .callout-lbl { color: var(--rose); }
.callout.slate { background: var(--slate-light); border-color: rgba(107,123,141,0.28); }
.callout.slate .callout-lbl { color: var(--slate); }
 
/* ═══════════════════════════════════════════════
   TABLES
═══════════════════════════════════════════════ */
.data-table { width: 100%; border-collapse: collapse; margin-bottom: 1.1rem; font-size: 0.93rem; }
.data-table th {
  font-family: var(--serif); font-size: 0.6rem; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gold-dim); padding: 0.45rem 0.6rem;
  text-align: left; border-bottom: 1px solid var(--gold-rule);
}
.data-table td { padding: 0.52rem 0.6rem; border-bottom: 1px solid rgba(191,160,122,0.1); color: var(--ink-light); }
.data-table td input {
  width: 60px; border: none; border-bottom: 1px solid rgba(191,160,122,0.2);
  background: transparent; font-size: 0.93rem; color: var(--ink);
  text-align: center; outline: none; font-family: var(--body);
}
.data-table td input:focus { border-bottom-color: var(--gold); }
 
/* ═══════════════════════════════════════════════
   VISUAL WORKSHEETS
═══════════════════════════════════════════════ */
.worksheet {
  border: 1px solid var(--gold-rule); padding: 1.8rem 1.6rem;
  margin: 1.3rem 0; background: rgba(191,160,122,0.035);
  box-shadow: var(--shadow-sm); position: relative;
  border-radius: 2px;
}
.ws-title {
  font-family: var(--serif); font-size: 0.6rem; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--gold-dim);
  display: block; margin-bottom: 1.1rem; text-align: center;
}
.ws-caption {
  text-align: center; font-family: var(--serif); font-style: italic;
  font-size: 0.8rem; color: var(--ink-faint); margin-top: 0.6rem;
}
 
/* Fatigue Wheel */
.fatigue-wheel-wrap { display: flex; justify-content: center; padding: 1.2rem 0 1.6rem; }
#fatigue-wheel { cursor: pointer; touch-action: manipulation; }
#fatigue-wheel path { transition: opacity 0.35s var(--ease-out), fill 0.35s var(--ease-out); }
#fatigue-wheel path:hover { opacity: 0.8 !important; }
.wheel-label {
  font-family: var(--serif); font-size: 0.7rem; fill: var(--ink); font-weight: 500;
  letter-spacing: 0.07em;
}
.wheel-sublabel {
  font-family: var(--body); font-size: 0.58rem; fill: var(--ink-faint);
  font-style: italic;
}
 
/* Energy Curve */
.energy-curve-wrap { position: relative; border-radius: 2px; overflow: hidden; }
#energy-canvas {
  border: 1px solid rgba(191,160,122,0.15); display: block; cursor: crosshair;
  background: linear-gradient(180deg, rgba(247,244,239,0.7), rgba(240,236,228,0.5));
  width: 100%; max-width: 100%; box-shadow: var(--shadow-sm);
}
 
/* Battery */
.battery-row { display: flex; gap: 3rem; justify-content: center; align-items: flex-start; padding: 1.2rem 0 0.6rem; flex-wrap: wrap; }
.battery-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.7rem; }
.battery-lbl { font-family: var(--serif); font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-light); opacity: 0.6; }
.battery-svg { cursor: pointer; transition: transform 0.2s var(--ease-out); }
.battery-svg:hover { transform: translateY(-2px); }
.battery-svg rect.batt-seg { transition: fill 0.35s var(--ease-out), opacity 0.35s; }
.battery-readout { font-family: var(--serif); font-style: italic; font-size: 0.78rem; color: var(--ink-light); opacity: 0.7; min-height: 1.2em; }
.battery-input {
  width: 140px; text-align: center; border: none; border-bottom: 1.5px solid rgba(191,160,122,0.2);
  background: transparent; font-family: var(--body); font-size: 0.85rem; color: var(--ink);
  padding: 0.3rem 0; outline: none; font-style: italic;
}
.battery-input::placeholder { color: var(--gold-dim); opacity: 0.45; }
.battery-input:focus { border-bottom-color: var(--gold); }
 
/* Energy Leaks */
.leaks-wrap { display: flex; justify-content: center; padding: 0.5rem 0 1rem; }
 
/* Fatigue Map (radar) */
.radar-wrap { display: flex; justify-content: center; padding: 0.5rem 0 1rem; }
 
/* Consultation card */
.consult-card {
  border: 1.5px solid var(--gold-rule);
  padding: 1.8rem; margin: 1.2rem 0;
  background: var(--paper-warm);
  position: relative;
}
.consult-card::before {
  content: '✂'; position: absolute; top: -0.6rem; right: 1.2rem;
  font-size: 0.7rem; color: var(--gold-dim); opacity: 0.5; background: var(--paper-warm);
  padding: 0 0.2rem;
}
.consult-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem;
}
.consult-zone { display: flex; flex-direction: column; gap: 0.4rem; }
.consult-zone-lbl {
  font-family: var(--serif); font-size: 0.58rem; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gold-dim); opacity: 0.7;
}
.nlist { list-style: none; counter-reset: nl; margin-bottom: 0.9rem; }
.nlist li { display: flex; align-items: baseline; gap: 0.65rem; margin-bottom: 0.72rem; counter-increment: nl; }
.nlist li::before {
  content: counter(nl); font-family: var(--serif); font-size: 0.7rem;
  color: var(--gold); font-weight: 500; min-width: 1rem; opacity: 0.8;
}

/* ═══════════════════════════════════════════════
   PATTERN RECOGNITION LIST
═══════════════════════════════════════════════ */
.pr-list { list-style: none; margin: 0 0 0.4rem; }
.pr-list li {
  position: relative; padding-left: 1.3rem; margin-bottom: 0.85rem;
  font-family: var(--serif); font-size: 0.98rem; line-height: 1.62; color: var(--ink-light);
}
.pr-list li::before {
  content: '\2014'; position: absolute; left: 0; color: var(--gold); opacity: 0.7;
}

/* ═══════════════════════════════════════════════
   MYTH RECAP LIST
═══════════════════════════════════════════════ */
.myth-recap-list { list-style: none; counter-reset: myth; margin: 0.4rem 0 0.6rem; }
.myth-recap-list li {
  position: relative; padding: 0.6rem 0 0.6rem 2.3rem; counter-increment: myth;
  font-size: 0.93rem; line-height: 1.6; color: var(--ink-light);
  border-bottom: 1px solid rgba(191,160,122,0.12);
}
.myth-recap-list li:last-child { border-bottom: none; }
.myth-recap-list li::before {
  content: counter(myth); position: absolute; left: 0; top: 0.55rem;
  width: 1.5rem; height: 1.5rem; border-radius: 50%;
  border: 1px solid rgba(196,108,74,0.4); color: var(--terra);
  font-family: var(--serif); font-size: 0.78rem; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.myth-recap-list li strong { color: var(--ink); }

/* ═══════════════════════════════════════════════
   ROADMAP TABLE
═══════════════════════════════════════════════ */
.roadmap-table .rm-num {
  font-family: var(--serif); font-style: italic; font-size: 0.95rem;
  color: var(--gold-dim); white-space: nowrap; width: 4.5rem;
}
.rm-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 0.6rem; vertical-align: middle;
}
.rm-dot.sage { background: var(--sage); }
.rm-dot.slate { background: var(--slate); }
.rm-dot.rose { background: var(--rose); }
.rm-dot.gold { background: var(--gold); }
.rm-dot.terra { background: var(--terra); }
.rm-dot.plain { background: var(--ink-faint); }

/* ═══════════════════════════════════════════════
   FOUR Ps CLOSING FRAMEWORK
═══════════════════════════════════════════════ */
.four-ps-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
  margin: 1.5rem 0;
}
@media (max-width: 480px) { .four-ps-grid { grid-template-columns: 1fr; } }
.four-p-card {
  border: 1px solid rgba(191,160,122,0.18); padding: 1.1rem 1.2rem;
  background: rgba(247,244,239,0.02);
}
.four-p-letter {
  font-family: var(--serif); font-size: 1.7rem; font-weight: 600;
  color: var(--gold); line-height: 1; margin-bottom: 0.4rem; display: block;
}
.four-p-word {
  font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink); margin-bottom: 0.45rem; display: block;
}
.four-p-desc { font-size: 0.85rem; color: var(--ink-faint); line-height: 1.55; }
 
/* ═══════════════════════════════════════════════
   WHAT NEXT (dark ground)
═══════════════════════════════════════════════ */
.ecosystem-page {
  padding: 3.5rem; margin-bottom: 2.5rem;
  border: 1px solid rgba(191,160,122,0.12);
  position: relative;
  opacity: 0; transform: translateY(18px);
  transition: opacity 0.55s ease, transform 0.55s ease;
}
.ecosystem-page.vis { opacity: 1; transform: translateY(0); }
.ecosystem-page::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--gold) 0%, transparent 100%); opacity: 0.55;
}
.eco-title { font-family: var(--serif); font-weight: 300; font-size: 1.65rem; color: var(--paper); margin-bottom: 0.3rem; }
.eco-purp { font-family: var(--serif); font-style: italic; font-size: 0.9rem; color: var(--paper); opacity: 0.38; margin-bottom: 1.6rem; line-height: 1.65; }
.eco-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin: 1rem 0 1.4rem; }
.eco-card { border: 1px solid rgba(191,160,122,0.13); padding: 0.95rem 1.1rem; transition: border-color 0.2s, background 0.2s; }
.eco-card:hover { border-color: rgba(191,160,122,0.3); background: rgba(191,160,122,0.04); }
.eco-card-t { font-family: var(--serif); font-size: 0.9rem; color: var(--paper); opacity: 0.75; display: block; margin-bottom: 0.22rem; }
.eco-card-d { font-size: 0.76rem; color: var(--gold-dim); font-style: italic; line-height: 1.4; display: block; opacity: 0.68; }
 
/* ═══════════════════════════════════════════════
   CLOSING PAGE
═══════════════════════════════════════════════ */
.closing-page {
  min-height: 70vh; display: flex; align-items: center; justify-content: center;
  padding: 5rem 3rem; text-align: center; position: relative; overflow: hidden;
  opacity: 0; transform: translateY(18px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.closing-page.vis { opacity: 1; transform: translateY(0); }
.closing-page::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, rgba(191,160,122,0.06) 0%, transparent 65%);
}
.closing-inner { max-width: 500px; position: relative; }
.closing-text {
  font-family: var(--serif); font-style: italic; font-size: clamp(1rem, 2.5vw, 1.3rem);
  color: var(--paper); line-height: 2; opacity: 0.75;
}
.closing-text em { opacity: 1; color: var(--gold); font-style: normal; }
.closing-rule { width: 40px; height: 1px; background: var(--gold); opacity: 0.28; margin: 2rem auto; }
.closing-brand {
  font-family: var(--serif); font-size: 0.62rem; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--gold); opacity: 0.5;
}
 
/* ═══════════════════════════════════════════════
   COLOPHON
═══════════════════════════════════════════════ */
.colophon {
  text-align: center; padding: 4rem 2rem 7rem; color: var(--paper); opacity: 0.3;
}
.colophon p { font-family: var(--serif); font-size: 0.7rem; letter-spacing: 0.16em; line-height: 2.1; }
 
/* ═══════════════════════════════════════════════
   SUMMARY / PRINT SECTION
═══════════════════════════════════════════════ */
.sum-stat { font-family: var(--serif); font-size: 0.8rem; color: var(--ink-light); opacity: 0.65; margin-bottom: 1.2rem; }
.sum-stat span { color: var(--gold); font-weight: 500; }
#smart-sum { background: rgba(191,160,122,0.07); border-left: 3px solid var(--gold); padding: 1.2rem 1.4rem; margin: 1.3rem 0; display: none; }

function buildCoverIllustration() {
  const cx=300, cy=300;
  const palette=['#bfa07a','#7a9e8a','#c4a799','#6b7b8d'];
  let rays='';
  const n=36;
  for(let i=0;i<n;i++){
    const angle=(i/n)*Math.PI*2;
    // organic variation: some rays long & bright (energy), some short & faint (depletion)
    const seed=Math.sin(i*2.4)*Math.cos(i*0.9);
    const len=128 + seed*70 + (i%5===0?40:0);
    const r1=104, r2=104+Math.max(40,len);
    const x1=cx+Math.cos(angle)*r1, y1=cy+Math.sin(angle)*r1;
    const x2=cx+Math.cos(angle)*r2, y2=cy+Math.sin(angle)*r2;
    const color=palette[i%palette.length];
    const op=(0.12+Math.abs(seed)*0.22).toFixed(2);
    const w=(i%3===0)?1.4:0.7;
    rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
  }
  let dots='';
  for(let i=0;i<24;i++){
    const angle=(i/24)*Math.PI*2 + 0.13;
    const r=275;
    const x=cx+Math.cos(angle)*r, y=cy+Math.sin(angle)*r;
    const color=palette[i%palette.length];
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i%4===0?1.6:0.9}" fill="${color}" opacity="${i%4===0?0.4:0.18}"/>`;
  }
  return `<svg class="cover-illus" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfa07a" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#bfa07a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#bfa07a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g class="ci-rotate">${dots}
    <circle cx="${cx}" cy="${cy}" r="275" fill="none" stroke="#bfa07a" stroke-width="0.5" stroke-dasharray="1 9" opacity="0.25"/>
  </g>
  <g class="ci-pulse">
    <circle cx="${cx}" cy="${cy}" r="190" fill="none" stroke="#7a9e8a" stroke-width="0.5" opacity="0.14"/>
    <circle cx="${cx}" cy="${cy}" r="148" fill="none" stroke="#c4a799" stroke-width="0.5" opacity="0.16"/>
    <circle cx="${cx}" cy="${cy}" r="104" fill="none" stroke="#bfa07a" stroke-width="0.6" opacity="0.22"/>
    ${rays}
    <circle cx="${cx}" cy="${cy}" r="100" fill="url(#coreGlow)"/>
    <circle cx="${cx}" cy="${cy}" r="46" fill="none" stroke="#bfa07a" stroke-width="0.7" opacity="0.4"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="#bfa07a" opacity="0.5"/>
  </g>
</svg>`;
}

function buildAllPages() {
  return [
  {id:'p-fear',badge:'Foundational',section:'Before We Begin',accent:'',title:'You Are Not Vain',dropcap:true,
   purp:'Many people living with hair fall carry an invisible burden alongside the shedding itself. Not just worry. But shame.',
   body:`<p class="body-text">They stand at the mirror, counting strands, convinced something is deeply wrong. They wonder whether caring about this makes them shallow. <em>It's just hair,</em> they tell themselves. <em>Why does this bother me so much?</em></p>
<p class="body-text">Over time, a quieter, more painful idea takes hold: <em>Maybe I am overreacting. Maybe I should just accept it.</em></p>
<p class="body-text">Hair loss is not a trivial concern, and noticing it is not vanity. Hair is visible. It is tied to identity, to how we are seen, to confidence in rooms full of strangers. A person worried about their hairline is not shallow. A person who feels less like themselves after a bald patch appears is not overreacting.</p>
<p class="body-text">The body rarely shouts before it whispers. For many conditions &mdash; stress, nutrition, thyroid, hormones &mdash; hair is one of the first places the whisper becomes visible.</p>
<div class="ref-box"><span class="ref-lbl">Reflection</span>
<p class="ref-q">What has worrying about your hair cost you? Has it stopped you from seeking help, or made you avoid mirrors, photographs, or certain situations?</p>
<textarea class="f-area large" data-key="fear-ref" placeholder="Write freely. This page is only for you."></textarea></div>`,
   closer:null},

  {id:'p-normal',badge:'Foundational',section:'Before We Begin',accent:'',title:'If Your Tests Were Normal',dropcap:true,
   purp:'You may have come here after hearing a sentence that many people with hair fall know very well.',
   body:`<p class="body-text" style="font-family:var(--serif);font-style:italic;font-size:1.12rem;color:var(--ink)">&ldquo;Everything looks normal.&rdquo;</p>
<p class="body-text">Perhaps your blood tests were normal. Your scalp examination was unremarkable. Yet you are still watching more hair collect in the drain than you remember, or a part line that seems wider than it used to be. This experience can be surprisingly lonely.</p>
<p class="body-text"><strong>Normal tests do not mean your experience is imaginary.</strong></p>
<p class="body-text">A blood test can measure ferritin. It cannot measure how it feels to find hair on every pillow for three months running. A scalp exam can measure follicle density. It cannot measure the quiet dread of running your fingers through your hair each morning.</p>
<div class="callout"><span class="callout-lbl">An important distinction</span><p class="callout-text">Normal results are reassuring. But they are not the same thing as understanding. This workbook is an attempt to understand &mdash; through the stories of others who have asked the same questions.</p></div>
<div class="ref-box"><span class="ref-lbl">Reflection</span>
<p class="ref-q">If you could say one sentence to a doctor who told you your tests were normal, what would it be?</p>
<textarea class="f-area" data-key="normal-ref" placeholder="Write it here first."></textarea></div>`,
   closer:null},

  {id:'p-redflags',badge:'Important',section:'Before We Begin',accent:'terra-accent',title:'When Hair Fall Needs Medical Attention',
   purp:'Most hair fall is not an emergency. But some situations deserve medical evaluation before any self-assessment.',
   body:`<p class="body-text">Please seek medical advice promptly if your hair changes are accompanied by:</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="rf1"><span class="chk-lbl">Pain, burning, or tenderness on the scalp</span></label>
<label class="chk"><input type="checkbox" data-key="rf2"><span class="chk-lbl">Visible redness, pus, or crusting</span></label>
<label class="chk"><input type="checkbox" data-key="rf3"><span class="chk-lbl">Rapidly spreading bald patches</span></label>
<label class="chk"><input type="checkbox" data-key="rf4"><span class="chk-lbl">Loss of eyebrows or eyelashes alongside scalp hair</span></label>
<label class="chk"><input type="checkbox" data-key="rf5"><span class="chk-lbl">Visible scarring where hair has been lost</span></label>
<label class="chk"><input type="checkbox" data-key="rf6"><span class="chk-lbl">Hair loss in a child with scaling or itching</span></label>
<label class="chk"><input type="checkbox" data-key="rf7"><span class="chk-lbl">Hair loss alongside unexplained weight change, fatigue, or fever</span></label>
<label class="chk"><input type="checkbox" data-key="rf8"><span class="chk-lbl">Sudden, severe shedding with no obvious explanation</span></label>
</div>
<div class="callout terra"><span class="callout-lbl">Note</span><p class="callout-text">Most hair fall has none of these features. But if any apply, please see a doctor before continuing this workbook.</p></div>`,
   closer:null},

  {id:'p-detective',badge:'One Question',section:'Before We Begin',accent:'',title:'Become the Detective',
   purp:'Before we go any further, a shift in how you think about your hair.',
   body:`<p class="body-text" style="font-family:var(--serif);font-size:1.18rem;color:var(--ink);line-height:1.55"><strong>What happened two to four months before this started?</strong></p>
<p class="body-text">This single question solves more hair-fall mysteries than any other. Hair follicles often respond to stress, illness, or change months after the event &mdash; not the next day. A fever in March can mean shedding in June. A crash diet in autumn can mean a thinner ponytail by winter.</p>
<p class="body-text">Throughout this workbook, you will meet patients &mdash; composites drawn from real clinical patterns &mdash; each with a mystery to solve. You will be invited to pause, guess, and then compare your thinking with how an experienced clinician approaches the same problem.</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="det1"><span class="chk-lbl">I am ready to look for patterns, not just panic</span></label>
<label class="chk"><input type="checkbox" data-key="det2"><span class="chk-lbl">I understand these are educational composites, not real patients</span></label>
<label class="chk"><input type="checkbox" data-key="det3"><span class="chk-lbl">I will use this workbook to prepare for a real conversation with a doctor, not to self-diagnose</span></label>
</div>`,
   closer:'Become the detective. Your hair has a story. Let&rsquo;s read it together.'},

  {id:'p-rest',badge:'One Question',section:'Before We Begin',accent:'',title:'Is It Shedding, Thinning, or Both?',
   purp:'Before we go further, pause and sit with this distinction. It changes everything that follows.',
   body:`<p class="body-text" style="font-family:var(--serif);font-size:1.18rem;color:var(--ink);line-height:1.55"><strong>Shedding</strong> is hair falling out. <strong>Thinning</strong> is hair becoming less dense over time, with or without visible shedding.</p>
<p class="body-text">Some hair loss is dramatic and sudden &mdash; handfuls in the shower, alarming clumps on the pillow. This is usually shedding, and it is often temporary. Some hair loss is quiet and gradual &mdash; a widening part, a thinner ponytail, more scalp visible in old photographs. This is usually thinning, and it often has a different explanation entirely.</p>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="st1"><span class="chk-lbl">Mostly shedding &mdash; I notice hair falling out, often dramatically</span></label>
<label class="chk"><input type="checkbox" data-key="st2"><span class="chk-lbl">Mostly thinning &mdash; I notice less density, but not large amounts of falling hair</span></label>
<label class="chk"><input type="checkbox" data-key="st3"><span class="chk-lbl">Both &mdash; I notice shedding and a sense that my hair is less dense overall</span></label>
<label class="chk"><input type="checkbox" data-key="st4"><span class="chk-lbl">Neither &mdash; I have patches, breakage, or another pattern entirely</span></label>
</div>`,
   closer:'Keep this answer with you as you move through the workbook.'},

  {id:'p-types',badge:'Understanding',section:'What Kind of Hair Loss Is This',accent:'',title:'What Kind of Hair Loss Is This?',
   purp:'Understanding the type of hair change you are experiencing is often the first step toward understanding why it is happening.',
   body:`<p class="body-text">Most people use one phrase: hair fall. But hair fall can mean many different things.</p>
<h3 class="subsec">Diffuse Shedding &mdash; &ldquo;It&rsquo;s coming out from everywhere.&rdquo;</h3>
<p class="body-text">Hair falls evenly across the whole scalp, often dramatically. Contributors: illness, fever, surgery, childbirth, crash dieting, iron deficiency, thyroid changes.</p>
<h3 class="subsec">Gradual Thinning &mdash; &ldquo;It&rsquo;s just less dense than it used to be.&rdquo;</h3>
<p class="body-text">A slow, progressive reduction in hair density, often at the temples or crown. Contributors: genetic pattern hair loss, ageing, chronic low-grade nutritional or hormonal factors.</p>
<h3 class="subsec">Patchy Loss &mdash; &ldquo;There&rsquo;s a bald spot.&rdquo;</h3>
<p class="body-text">One or more localised areas of hair loss. Contributors: alopecia areata, fungal infection, traction, trichotillomania &mdash; each looks different on close examination.</p>
<h3 class="subsec">Breakage &mdash; &ldquo;The strand snaps, not the root.&rdquo;</h3>
<p class="body-text">Hair appears to be falling but is actually snapping partway along the shaft. Contributors: heat styling, chemical treatments, bleaching, mechanical damage.</p>
<h3 class="subsec">My Hair Pattern Wheel</h3>
<p class="body-text">Tap or click each segment to show how much each type applies to you right now. The outer edge is most significant.</p>
<div class="worksheet" id="ws-wheel"><span class="ws-title">\u25c6 My Hair Pattern Wheel</span>
<div class="fatigue-wheel-wrap"><svg id="fatigue-wheel" width="280" height="280" viewBox="0 0 280 280"></svg></div>
<p style="text-align:center;font-family:var(--serif);font-style:italic;font-size:.8rem;color:var(--ink-faint);margin-top:.5rem">Click or tap each quadrant to increase shading (up to 3 levels)</p></div>
<div class="ref-box"><span class="ref-lbl">Reflection</span>
<p class="ref-q">If you could describe your hair change without using the word &ldquo;falling,&rdquo; what would you say? Which of the four patterns feels most like yours?</p>
<textarea class="f-area" data-key="types-ref" placeholder="Perhaps your answer is the first clue."></textarea></div>`,
   closer:'Perhaps your hair fall is not a problem to be solved immediately. Perhaps it is a pattern that deserves to be read first.'},

  {id:'p-story',badge:'Your Story',section:'My Hair Story',accent:'',title:'My Hair Story',
   purp:'Hair loss is rarely a sudden arrival. Understanding when it began, and what was happening in your life at that time, is often as revealing as any blood test.',
   body:`<h3 class="subsec">When did I first notice a change?</h3>
<div class="chk-grid col1">
<label class="chk"><input type="checkbox" data-key="hs-1"><span class="chk-lbl">Within the last few weeks &mdash; this is new</span></label>
<label class="chk"><input type="checkbox" data-key="hs-2"><span class="chk-lbl">Over the past few months</span></label>
<label class="chk"><input type="checkbox" data-key="hs-3"><span class="chk-lbl">Over the past year or more</span></label>
<label class="chk"><input type="checkbox" data-key="hs-4"><span class="chk-lbl">It has come and gone in episodes for years</span></label>
</div>
<h3 class="subsec">What was happening in my life 2&ndash;4 months before it began?</h3>
<div class="chk-grid">
<label class="chk"><input type="checkbox" data-key="hs-fever"><span class="chk-lbl">High fever or significant illness</span></label>
<label class="chk"><input type="checkbox" data-key="hs-covid"><span class="chk-lbl">COVID-19 or another viral illness</span></label>
<label class="chk"><input type="checkbox" data-key="hs-surgery"><span class="chk-lbl">Surgery or hospitalisation</span></label>
<label class="chk"><input type="checkbox" data-key="hs-baby"><span class="chk-lbl">Childbirth</span></label>
<label class="chk"><input type="checkbox" data-key="hs-stress"><span class="chk-lbl">Major emotional stress or life event</span></label>
<label class="chk"><input type="checkbox" data-key="hs-diet"><span class="chk-lbl">Crash dieting or rapid weight loss</span></label>
<label class="chk"><input type="checkbox" data-key="hs-meds"><span class="chk-lbl">A new medication</span></label>
<label class="chk"><input type="checkbox" data-key="hs-none"><span class="chk-lbl">Nothing I can identify</span></label>
</div>
<div class="ref-box"><span class="ref-lbl">Reflection</span>
<p class="ref-q">Describe the moment you first knew something had changed. What did you see, and what did you feel?</p>
<textarea class="f-area large" data-key="story-ref" placeholder="Write it as you remember it."></textarea></div>`,
   closer:'The timing is rarely a coincidence. The body keeps its own calendar.'},

  {id:'p-checkin',badge:'Visual Exercise',section:'My Hair Story',accent:'',title:'My Hair Through the Year',
   purp:'This exercise is simple but often surprisingly revealing. Most people have never plotted their own hair density over time before.',
   body:`<p class="body-text">Rate your hair density at each point over the past year, from 0 (significant loss) to 10 (full, as you remember it at your best).</p>
<div class="worksheet">
